- page: 685
  title: A 40-minute classroom pattern that works
  text: " A 40-minute classroom pattern that works\n\n\n    Time                 \
    \             Segment       Instructor / student activity\n    5 min         \
    \                    Problem       Present the decision, data, and cost of being\
    \ wrong\n    5 min                             Intuition     One visual and one\
    \ hand-worked example\n    8 min                             Demo          Run\
    \ a prepared baseline and the target method\n    12 min                      \
    \      Modify        Students change one assumption, parameter, or threshold\n\
    \    5 min                             Break it      Introduce leakage, imbalance,\
    \ drift, or bad assumptions\n    5 min                             Defend    \
    \    One student explains method choice, metric, and stop\n                  \
    \                                  condition\n\n\n Do not start with a blank notebook\n\
    \ Provide runnable scaffolding. The learning objective is judgment: reading, modifying,\
    \ testing, and\n defending the code."
  paragraphs:
  - A 40-minute classroom pattern that works
  - Time Segment Instructor / student activity 5 min Problem Present the decision,
    data, and cost of being wrong 5 min Intuition One visual and one hand-worked example
    8 min Demo Run a prepared baseline and the target method 12 min Modify Students
    change one assumption, parameter, or threshold 5 min Break it Introduce leakage,
    imbalance, drift, or bad assumptions 5 min Defend One student explains method
    choice, metric, and stop condition
  - 'Do not start with a blank notebook Provide runnable scaffolding. The learning
