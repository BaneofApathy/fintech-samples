- page: 393
  title: Scaled Forecast Errors
  text: " Scaled Forecast Errors\n\n   M22 | Interpretation\n\n What the answer means\n\
    \ MAPE averages each day’s percentage miss. WAPE compares total absolute error\
    \ with total\n volume. MASE says the test error is 62.5% of the training naive-error\
    \ scale; it does not, by\n itself, establish superiority to a naive forecast on\
    \ the test period. MAPE is undefined at zero\n actuals.\n Why these steps matter\n\
    \ The denominators intentionally differ. MAPE gives each day’s proportional miss\
    \ equal weight;\n WAPE evaluates error relative to total volume; MASE compares\
    \ against a historical forecasting\n scale. A name containing “percentage” is\
    \ not permission to ignore zeros, signs, or the\n evaluation window."
  paragraphs:
  - Scaled Forecast Errors
  - M22 | Interpretation
  - What the answer means MAPE averages each day’s percentage miss. WAPE compares
    total absolute error with total volume. MASE says the test error is 62.5% of the
    training naive-error scale; it does not, by itself, establish superiority to a
    naive forecast on the test period. MAPE is undefined at zero actuals. Why these
    steps matter The denominators intentionally differ. MAPE gives each day’s proportional
    miss equal weight; WAPE evaluates error relative to total volume; MASE compares
    against a historical forecasting scale. A name containing “percentage” is not
    permission to ignore zeros, signs, or the evaluation window.
  source:
    pages:
    - 393
    verbatim: true
