  text: " Scaled Forecast Errors\n\n   M22 | Formula explained (1/2)\n\n Question:\
    \ What does the error represent relative to the target’s size?\n             \
    \                    n                              P\n                      \
    \        1 X |yi − ŷi |                       |yi − ŷi |\n                 \
    \ M AP E =                    ,     W AP E = iP                 .\n          \
    \                    n i=1 |yi |                             i |yi |\n\n Read\
    \ it aloud: MAPE calculates a percentage-type error for each day and then averages.\n\
    \ WAPE totals all absolute errors and divides by total absolute actual volume.\n\
    \ Both formulas above return fractions; multiply by 100 when writing percentage\
    \ numbers.\n MAPE is undefined when an individual actual value is zero. WAPE requires\
    \ a nonzero total\n denominator."
