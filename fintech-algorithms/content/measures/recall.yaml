- page: 237
  title: Recall
  text: " Recall\n\n   M05 | Interpretation\n\n What the answer means\n A captures\
    \ 75% of fraud events and leaves $14,000 less modeled missed-fraud loss than\n\
    \ B. This is event recall; it equals value capture here only because fraud losses\
    \ are assumed equal.\n False alerts, review costs, and intervention effectiveness\
    \ are still needed for the overall decision.\n Why these steps matter\n A higher\
    \ recall can reduce the number of missed frauds, but it does not describe the\
    \ cost of the\n extra flags. The modeled US$14,000 difference is a comparison\
    \ of missed-fraud loss only, not\n a complete profit comparison."
  paragraphs:
  - Recall
