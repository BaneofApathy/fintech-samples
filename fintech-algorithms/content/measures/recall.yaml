- page: 233
  title: Recall
  text: " Recall\n\n   M05 | Symbols and terms (1/2)\n\n\n   Symbol or term      \
    \                           Meaning in this example\n   TP                   \
    \                          Number of actual frauds caught by the detector.\n \
    \  FN                                             Number of actual frauds missed\
    \ by the detector.\n   F = TP + FN                                    Total fraud\
    \ events in the batch, here 20; F is a count, not an\n                       \
    \                           F-score.\n   cF N                                \
    \           Unrecovered loss for each missed fraud, assumed to be US$2,000.\n\
    \   Lmiss                                          Residual loss attributable\
    \ to missed frauds under the stated\n                                        \
    \          assumption, in dollars.\n   Recall                                \
    \         Share of all actual frauds that were identified, also called sensitivity\n\
    \                                                  or TPR."
