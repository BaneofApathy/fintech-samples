- page: 235
  title: Recall
  text: " Recall\n\n   M05 | Class problem | 5 minutes — Put a Price on Missed Fraud\n\
    \n A batch contains 20 actual frauds.\n▶ Detector A catches 15.\n▶ Detector B\
    \ catches 8.\n Assume each missed fraud causes $2,000 of unrecovered loss. For\
    \ this exercise, all frauds\n have the same loss amount.\n                   \
    \                            Frauds caught\n                                 \
    \   Recall =                    .\n                                          \
    \    All actual frauds\n Calculate recall, missed-fraud counts, and residual fraud\
    \ loss for each detector. How much lower\n is A’s missed-fraud loss? Can you select\
    \ a final policy without knowing false alerts and review\n costs?"
