- page: 236
  title: Recall
  text: " Recall\n\n   M05 | Worked solution — Put a Price on Missed Fraud\n\n1. Recall:\
    \ A = 15/20 = 75%; B = 8/20 = 40%.\n2. Frauds missed: A = 20 − 15 = 5; B = 20\
    \ − 8 = 12.\n3. Residual loss:\n                                          A =\
    \ 5(2,000) = $10,000,   B = 12(2,000) = $24,000.\n4. Difference: 24,000 − 10,000\
    \ = $14,000."
  paragraphs:
  - Recall
  - M05 | Worked solution — Put a Price on Missed Fraud
  - '1. Recall: A = 15/20 = 75%; B = 8/20 = 40%. 2. Frauds missed: A = 20 − 15 = 5;
    B = 20 − 8 = 12. 3. Residual loss: A = 5(2,000) = $10,000, B = 12(2,000) = $24,000.
    4. Difference: 24,000 − 10,000 = $14,000.'
