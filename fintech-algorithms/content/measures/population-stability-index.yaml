  title: Population Stability Index – does production still resemble development data?
  text: " Population Stability Index – does production still resemble development\n\
    \ data?\n\n Financial interpretation\n PSI compares feature or score distributions\
    \ between a reference period and a current period. It signals\n population shift,\
    \ not necessarily model failure.\n\n Working example\n Expected score-band shares\
    \ are [20, 30, 30, 20]%; current shares are [10, 25, 35, 30]%.\n             \
    \                                                  Ai\n                      \
    \                      X                 \x10 \x11\n                         \
    \         P SI =        (Ai − Ei ) ln       ≈ 0.127\n                        \
    \                                       Ei\n                                 \
    \                 i\n The applicant mix has shifted noticeably toward the highest\
    \ score band. Investigate product, channel,\n policy, and data-pipeline changes.\n\
    \n What it misses\n There is no universal magic cutoff. PSI does not show whether\
    \ labels, calibration, loss, fairness, or data\n quality have degraded."
