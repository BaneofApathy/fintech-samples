- page: 561
  title: PSI
  text: " PSI\n\n   M38 | Symbols and terms (1/2)\n\n\n   Symbol or term         \
    \                        Meaning in this example\n   PSI                     \
    \                       Population Stability Index: a comparison of two distributions\n\
    \                                                  represented using matching\
    \ bins or bands.\n   i, B                                           Score-band\
    \ index and number of bands; two here.\n   Ei                                \
    \             Reference-period share in band i. E labels the reference distribution;\n\
    \                                                  it is not the expectation operator\
    \ in this formula.\n   Ai                                             Current-period\
    \ share in the same band; A labels current share, not a\n                    \
    \                              group of applicants from the fairness exercise.\n\
    \   Ai − Ei                                        Absolute change in share as\
    \ a fraction, not the relative percentage\n                                  \
    \                increase.\n   Ai /Ei                                        \
    \ Current share divided by reference share for that band."
