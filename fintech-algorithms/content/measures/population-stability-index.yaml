title: Population Stability Index
question: operate
financialInterpretation: PSI compares feature or score distributions between a reference
  period and a current period. It signals population shift, not necessarily model
  failure.
workingExample: "Expected score-band shares are [20, 30, 30, 20]%; current shares\
  \ are [10, 25, 35, 30]%. Ai X \x10 \x11 P SI = (Ai − Ei ) ln ≈ 0.127 Ei i The applicant\
  \ mix has shifted noticeably toward the highest score band. Investigate product,\
  \ channel, policy, and data-pipeline changes."
whatItMisses: There is no universal magic cutoff. PSI does not show whether labels,
  calibration, loss, fairness, or data quality have degraded.
