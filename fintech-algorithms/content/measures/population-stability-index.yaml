- page: 560
  title: PSI
  text: " PSI\n\n   M38 | Formula explained (1/1)\n\n Question: How much has the distribution\
    \ across fixed score bands changed?\n                                        B\
    \                \x12 \x13\n                                      X          \
    \         Ai\n                             P SI =        (Ai − Ei ) ln     .\n\
    \                                       i=1\n                                \
    \                          Ei\n Read it aloud: For each band, multiply the change\
    \ in its population share by the natural\n logarithm of its current-to-reference\
    \ share ratio. Add the contributions across bands.\n Use proportions that sum\
    \ to 1 within each period and the same band boundaries in both\n periods. The\
    \ supplied shares are all positive, so the logarithms are defined.\n PSI is a\
    \ distribution-shift measure. No realized default labels appear in its formula."
