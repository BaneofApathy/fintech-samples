slug: precision-recall-curve-and-pr-auc
number: 11
title: Precision-Recall Curve and PR-AUC
question: rank
financialInterpretation: The precision-recall curve is usually more informative than
  ROC for rare events. It shows how alert quality declines as the model tries to capture
  more fraud.
workingExample: Fraud prevalence is 1%, so random ranking produces about 1% precision
  on average. A model with average precision / PR-AUC of 0.32 maintains much higher
  precision across recall levels than the 0.01 baseline. At one threshold the model
  may have 45% precision and 45% recall; at a lower threshold it may have 18% precision
  and 75% recall.
whatItMisses: PR-AUC changes with event prevalence. Compare models on the same population
  and time window, then inspect the actual operating point.
