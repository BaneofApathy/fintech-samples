- page: 280
  title: Precision-recall curve and PR-AUC – how clean is the alert queue as capture
    increases?
  text: " Precision-recall curve and PR-AUC – how clean is the alert queue as\n capture\
    \ increases?\n\n\n Financial interpretation\n The precision-recall curve is usually\
    \ more informative than ROC for rare events. It shows how alert quality\n declines\
    \ as the model tries to capture more fraud.\n\n Working example\n Fraud prevalence\
    \ is 1%, so random ranking produces about 1% precision on average. A model with\
    \ average\n precision / PR-AUC of 0.32 maintains much higher precision across\
    \ recall levels than the 0.01 baseline. At\n one threshold the model may have\
    \ 45% precision and 45% recall; at a lower threshold it may have 18%\n precision\
    \ and 75% recall.\n\n What it misses\n PR-AUC changes with event prevalence. Compare\
    \ models on the same population and time window, then\n inspect the actual operating\
    \ point."
  paragraphs:
  - Precision-recall curve and PR-AUC – how clean is the alert queue as capture increases?
  - Financial interpretation The precision-recall curve is usually more informative
    than ROC for rare events. It shows how alert quality declines as the model tries
    to capture more fraud.
  - Working example Fraud prevalence is 1%, so random ranking produces about 1% precision
