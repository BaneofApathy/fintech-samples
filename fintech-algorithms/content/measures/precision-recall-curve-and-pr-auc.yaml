  title: Average Precision and PR-AUC
  text: " Average Precision and PR-AUC\n\n   M11b | Formula explained (1/2)\n\n Question:\
    \ How does average precision summarize the ranking?\n                        \
    \       X\n                        AP =       ∆Rj Pj ,    ∆Rj = Rj − Rj−1 .\n\
    \                                                  j\n\n Read it aloud: For every\
    \ increase in recall, multiply the size of the increase by precision at that\n\
    \ point, then add the contributions.\n Only newly discovered frauds increase recall\
    \ in this untied ranking. With three frauds, each\n discovery contributes a recall\
    \ increase of one-third.\n This is a weighted average of precision, with recall\
    \ increments as weights. It is not the ordinary\n average of precision at every\
    \ rank."
