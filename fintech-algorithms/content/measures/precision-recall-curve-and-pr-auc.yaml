- page: 286
  title: Precision–Recall Curve
  text: " Precision–Recall Curve\n\n   M11a | Interpretation\n\n What the answer means\n\
    \ Reviewing six cases captures every fraud in this sample, but half the queue\
    \ is legitimate. An\n empirical precision–recall curve can rise locally; precision\
    \ does not necessarily fall at every\n additional rank.\n Why these steps matter\n\
    \ Recall cannot decrease when the queue only expands, because caught frauds are\
    \ not removed.\n Precision can rise or fall: its numerator and denominator change\
    \ differently depending on\n whether the next case is fraud."
  paragraphs:
  - Precision–Recall Curve
  - M11a | Interpretation
  - 'What the answer means Reviewing six cases captures every fraud in this sample,
    but half the queue is legitimate. An empirical precision–recall curve can rise
    locally; precision does not necessarily fall at every additional rank. Why these
    steps matter Recall cannot decrease when the queue only expands, because caught
    frauds are not removed. Precision can rise or fall: its numerator and denominator
    change differently depending on whether the next case is fraud.'
