  title: Monte Carlo Error
  text: " Monte Carlo Error\n\n   M34 | Formula explained (1/1)\n\n Question: What\
    \ fraction of simulations breaches the reserve, and how much uncertainty comes\n\
    \ only from the finite run count?\n                                          \
    \          r\n                                    k                  p̂(1 − p̂)\n\
    \                                p̂ = ,     SE(p̂) =               ,\n       \
    \                             N                      N\n                     \
    \     Approximate 95% interval = p̂ ± 1.96 SE(p̂).\n Read it aloud: Divide breach\
    \ runs by total runs. Multiply that estimated fraction by its\n complement, divide\
    \ by run count, and take the square root. Add and subtract 1.96 standard\n errors\
    \ for the stated normal approximation.\n Runs are independent, equally weighted,\
    \ and generated under one fixed simulation model. This\n approximation is not\
    \ suitable for every very small or near-zero/near-one breach sample."
