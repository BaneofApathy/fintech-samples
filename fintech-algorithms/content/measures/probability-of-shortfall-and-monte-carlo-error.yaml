  title: Probability of shortfall and Monte Carlo error – is the reserve enough?
  text: " Probability of shortfall and Monte Carlo error – is the reserve enough?\n\
    \n\n Financial interpretation\n Probability of shortfall estimates how often a\
    \ financial limit fails. Monte Carlo standard error measures uncertainty\n caused\
    \ only by a finite number of simulation runs.\n\n\n Working example\n Loss exceeds\
    \ the reserve in 1,200 of 10,000 simulations:\n                              \
    \                                           r\n                              \
    \                                               0.12(0.88)\n                 \
    \                                 p̂ = 12%,   SE(p̂) =                  = 0.00325\n\
    \                                                                            \
    \   10,000\n\n A rough 95% simulation interval is 12% ± 0.64 percentage points.\n\
    \n\n What it misses\n More runs reduce sampling noise; they do not fix unrealistic\
    \ defaults, correlations, recoveries, or omitted stress\n scenarios."
