  text: " Monte Carlo Error\n\n   M34 | Class problem | 9 minutes — How Much of the\
    \ Estimate Is Simulation Noise?\n\n In 2,500 independent simulation runs, a loan\
    \ portfolio loses more than its reserve in 250 runs.\n Calculate the estimated\
    \ shortfall probability and its Monte Carlo standard error:\n                \
    \                                        r\n                                 \
    \                          p̂(1 − p̂)\n                               p̂ = k/N,\
    \       SE(p̂) =               .\n                                           \
    \                    N\n Construct the approximate 95% simulation interval p̂\
    \ ± 1.96SE. Then suppose the model runs\n 10,000 simulations, with the same estimated\
    \ probability. What happens to standard error?\n Does the interval include uncertainty\
    \ about the model’s default assumptions?"
