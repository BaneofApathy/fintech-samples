  title: Prediction-interval coverage and width – did uncertainty bands contain reality?
  text: " Prediction-interval coverage and width – did uncertainty bands contain\n\
    \ reality?\n\n Financial interpretation\n A forecast interval supports reserves\
    \ and liquidity buffers. Coverage asks how often reality falls inside the\n interval;\
    \ width asks how useful or conservative the interval is.\n\n Working example\n\
    \ A model issues 90% prediction intervals for 50 days. Only 37 actual values fall\
    \ inside:\n                                                               37\n\
    \                                                  Coverage =      = 74%\n   \
    \                                                            50\n The model is\
    \ overconfident. If another model achieves 92% coverage only by making every interval\n\
    \ extremely wide, it may still be operationally weak.\n\n What it misses\n Report\
    \ coverage and average width together, by horizon and during stress periods. Average\
    \ coverage can\n hide poor tail behavior."
