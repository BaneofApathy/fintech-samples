- page: 409
  title: Prediction Intervals
  text: " Prediction Intervals\n\n   M24 | Worked solution — Covered, but Useful?\n\
    \n1. Original coverage: days 1, 3, 4, and 5 are inside; day 2 is outside. Coverage\
    \ = 4/5 = 80%.\n2. Original widths: 30, 20, 20, 30, 10. Mean = 110/5 = $22 million.\n\
    3. Widened intervals: [80, 130], [90, 130], [75, 115], [120, 170], [90, 120].\n\
    4. Widened coverage: all five actuals are inside, so 5/5 = 100%.\n5. Widened average\
    \ width: each interval grows by 20; 22 + 20 = $42 million."
  paragraphs:
  - Prediction Intervals
  - M24 | Worked solution — Covered, but Useful?
