title: Value at Risk and Expected Shortfall
question: act
financialInterpretation: VaR gives a loss threshold at a confidence level. Expected
  Shortfall gives the average loss beyond that threshold and is more informative about
  the tail.
workingExample: 'In 10,000 one-day loss scenarios, 99% VaR is $2.0 million. About
  100 scenarios are worse than $2.0 million. Their average loss is $3.4 million, so
  99% Expected Shortfall is $3.4 million. Interpretation: Under the model, only 1%
  of days are expected to lose more than $2.0 million; when that happens, the average
  modeled loss is $3.4 million.'
whatItMisses: VaR is not the maximum loss. Both measures depend on distribution, correlation,
  liquidity, and regime assumptions.
