- page: 522
  title: VaR and Expected Shortfall
  text: " VaR and Expected Shortfall\n\n   M33 | Interpretation\n\n What the answer\
    \ means\n Under this empirical scenario distribution, 80% of one-day losses are\
    \ no more than $7,000; the\n worst fifth averages $15,000. VaR is not a maximum\
    \ loss: even this tiny sample includes a\n $20,000 loss. The 80% level is a teaching\
    \ choice, not a recommended risk policy.\n Why these steps matter\n VaR identifies\
    \ where the tail begins under the chosen convention. Expected Shortfall describes\n\
    \ the size of losses within that tail. They can differ considerably because the\
    \ threshold does not\n reveal how far the worst observations extend beyond it.\
    \ Both are conditional on the supplied\n scenario distribution."
  paragraphs:
  - VaR and Expected Shortfall
  - M33 | Interpretation
