- page: 515
  title: Value at Risk and Expected Shortfall – how large can tail loss become?
  text: " Value at Risk and Expected Shortfall – how large can tail loss become?\n\
    \n\n Financial interpretation\n VaR gives a loss threshold at a confidence level.\
    \ Expected Shortfall gives the average loss beyond that\n threshold and is more\
    \ informative about the tail.\n\n Working example\n In 10,000 one-day loss scenarios,\
    \ 99% VaR is $2.0 million. About 100 scenarios are worse than $2.0 million.\n\
    \ Their average loss is $3.4 million, so 99% Expected Shortfall is $3.4 million.\
    \ Interpretation: Under the\n model, only 1% of days are expected to lose more\
    \ than $2.0 million; when that happens, the average\n modeled loss is $3.4 million.\n\
    \n What it misses\n VaR is not the maximum loss. Both measures depend on distribution,\
    \ correlation, liquidity, and regime\n assumptions."
