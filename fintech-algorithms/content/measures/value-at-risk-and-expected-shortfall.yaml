- page: 520
  title: VaR and Expected Shortfall
  text: " VaR and Expected Shortfall\n\n   M33 | Class problem | 8 minutes — Threshold\
    \ versus Tail Average\n\n A risk model produces these 10 equally weighted one-day\
    \ loss scenarios, in $ thousands:\n                                          \
    \        [10, 0, 5, 20, 1, 7, 3, 6, 2, 4].\n Use 80% confidence to keep the hand\
    \ calculation small.\n▶ VaR: sort losses and choose observation ⌈0.80N ⌉ using\
    \ the nearest-rank convention.\n▶ Expected Shortfall: average the losses in the\
    \ worst 20% of scenarios.\n Calculate VaR, Expected Shortfall, and the observed\
    \ fraction strictly exceeding VaR. Is VaR the\n largest possible loss? State the\
    \ horizon with your answer."
  paragraphs:
  - VaR and Expected Shortfall
