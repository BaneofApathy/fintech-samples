  title: Turnover and Constraints
  text: " Turnover and Constraints\n\n   M32b | Worked solution — Can the Allocation\
    \ Be Implemented?\n\n1. Weight changes: [−20, +10, +10] percentage points.\n2.\
    \ One-way turnover: (20 + 10 + 10)/2 = 20%, equivalent to $200,000 on one side.\n\
    3. Trades: sell $200,000 of A; buy $100,000 of B and $100,000 of C. Gross traded\
    \ value\n   = $400, 000.\n4. Cost: 400,000 × 0.001 = $400. Costs apply to both\
    \ purchases and sales, not just one-way\n   turnover.\n5. Constraint check: [40,\
    \ 40, 20]% is feasible. The alternative has one violation: A exceeds its\n   50%\
    \ cap by 5 percentage points, or $50,000."
  paragraphs:
  - Turnover and Constraints
