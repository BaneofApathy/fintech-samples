  title: Turnover and Constraints
  text: " Turnover and Constraints\n\n   M32b | Interpretation\n\n What the answer\
    \ means\n Turnover estimates the trading burden; the fee calculation depends on\
    \ the stated convention. A\n mandatory allocation cap is a separate pass/fail\
    \ condition. Better expected performance does\n not make a noncompliant proposed\
    \ allocation feasible.\n Why these steps matter\n Selling 20% of portfolio value\
    \ and reinvesting it creates 20% one-way turnover but 40% gross\n trading. The\
    \ stated fee charges both sides. Likewise, an asset at 55% breaches a 50% cap\
    \ by\n five percentage points, not by 5% of its current holding."
  paragraphs:
  - Turnover and Constraints
