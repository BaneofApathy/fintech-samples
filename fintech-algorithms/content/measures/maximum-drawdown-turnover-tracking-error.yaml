- page: 493
  title: Maximum drawdown, turnover, and tracking error – can the strategy survive
    and be implemented?
  text: " Maximum drawdown, turnover, and tracking error – can the strategy\n survive\
    \ and be implemented?\n\n\n Financial interpretation\n These measures capture\
    \ investor pain, trading cost, and deviation from a benchmark – dimensions that\n\
    \ average return does not show.\n\n Working example\n▶ Portfolio rises from 100\
    \ to 120, then falls to 90: max drawdown = (120 − 90)/120 = 25%.\n▶ Weights move\
    \ from [50, 30, 20]% to [30, 50, 20]%: one-way turnover = 12 (20 + 20 + 0) = 20%.\n\
    ▶ If active returns have 3% standard deviation, tracking error is 3%.\n\n What\
    \ it misses\n Report transaction cost, liquidity, taxes, and hard constraint violations.\
    \ An optimizer is unacceptable if any\n mandatory constraint is breached."
