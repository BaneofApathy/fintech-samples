- page: 513
  title: Tracking Error
  text: " Tracking Error\n\n   M32c | Interpretation\n\n What the answer means\n Tracking\
    \ error describes the variability of benchmark-relative returns—not a 4% loss\
    \ or 4%\n underperformance. Mean monthly active return is zero here, yet active\
    \ risk is positive.\n Annualization and this four-observation estimate should\
    \ not be treated as reliable without more\n data.\n Why these steps matter\n Active\
    \ returns of +1 and −1 percentage point average to zero but still fluctuate. Tracking\
    \ error\n measures that fluctuation. Computing the standard deviation of the fund’s\
    \ returns alone would\n answer a different question about total risk rather than\
    \ benchmark-relative risk."
  paragraphs:
  - Tracking Error
  - M32c | Interpretation
  - What the answer means Tracking error describes the variability of benchmark-relative
    returns—not a 4% loss or 4% underperformance. Mean monthly active return is zero
    here, yet active risk is positive. Annualization and this four-observation estimate
    should not be treated as reliable without more data. Why these steps matter Active
    returns of +1 and −1 percentage point average to zero but still fluctuate. Tracking
    error measures that fluctuation. Computing the standard deviation of the fund’s
    returns alone would answer a different question about total risk rather than benchmark-relative
    risk.
