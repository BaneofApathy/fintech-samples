- page: 199
  title: Confusion matrix – what happened to each decision?
  text: " Confusion matrix – what happened to each decision?\n\n\n Financial interpretation\n\
    \ The confusion matrix counts the four operational outcomes created by a chosen\
    \ threshold: caught fraud,\n missed fraud, unnecessary customer friction, and\
    \ legitimate transactions passed correctly.\n\n\n Working example: 10,000 transactions\
    \                                 Translate the cells\n       There are 100 actual\
    \ frauds. The model flags 200               ▶ TP: fraud caught\n        transactions.\
    \ Of those flags, 60 are truly fraud.             ▶ FP: good customer interrupted\n\
    \                                   Actual fraud   Actual legitimate   ▶ FN: fraud\
    \ missed\n       Flagged                         TP = 60       FP = 140      \
    \   ▶ TN: legitimate transaction passed\n       Not flagged                  \
    \   FN = 40      TN = 9,760\n                                                \
    \                      Remember\n                                            \
    \                          Every classification measure on the next slides\n \
    \                                                                     is a different\
    \ summary of these four counts."
