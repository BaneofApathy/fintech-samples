  title: Sharpe and Sortino ratios – how much return was earned per unit of risk?
  text: " Sharpe and Sortino ratios – how much return was earned per unit of\n risk?\n\
    \n Financial interpretation\n Sharpe uses total return variability; Sortino uses\
    \ downside variability. Both compare excess return with risk\n taken.\n\n Working\
    \ example\n Annual portfolio return = 9%, risk-free rate = 4%, volatility = 10%,\
    \ downside deviation = 6%.\n\n                                               \
    \       9% − 4%                       9% − 4%\n                              \
    \             Sharpe =           = 0.50,   Sortino =           = 0.83\n      \
    \                                                  10%                       \
    \    6%\n Sortino is higher because upside volatility is not treated as harmful.\n\
    \n What it misses\n Ratios are unstable in small samples, sensitive to annualization,\
    \ and can hide skew, illiquidity, leverage, and\n tail loss."
