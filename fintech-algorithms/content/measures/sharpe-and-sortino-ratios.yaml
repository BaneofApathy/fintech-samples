- page: 484
  title: Sharpe and Sortino
  text: " Sharpe and Sortino\n\n   M31 | Formula explained (3/3)\n\n Read it aloud:\
    \ Total standard deviation measures departures from the average. Downside\n deviation,\
    \ under the stated convention, counts only departures below the target but divides\
    \ by\n all periods, including those above target.\n These equations explain the\
    \ denominators; the original problem supplies the annualized\n estimates. Its\
    \ raw return history is not provided, so those estimates cannot be independently\n\
    \ reconstructed here."
