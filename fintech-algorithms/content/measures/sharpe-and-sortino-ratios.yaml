- page: 491
  title: Sharpe and Sortino
  text: " Sharpe and Sortino\n\n   M31 | Interpretation\n\n What the answer means\n\
    \ B’s higher return came with more risk. It does not win on either risk-adjusted\
    \ ratio here. A\n Sharpe ratio of 0.50 means half a unit of excess return per\
    \ unit of measured volatility—not a\n 50% return or a 50% chance of profit. These\
    \ estimates do not establish future performance or\n tail safety.\n Why these\
    \ steps matter\n The numerator rewards performance above the specified reference.\
    \ The denominator identifies\n the kind of variability being charged against that\
    \ performance. B’s extra return is not enough to\n overcome its larger total volatility\
    \ on Sharpe, while both funds have the same return per unit of\n supplied downside\
    \ deviation."
  paragraphs:
  - Sharpe and Sortino
  - M31 | Interpretation
  - What the answer means B’s higher return came with more risk. It does not win on
    either risk-adjusted ratio here. A Sharpe ratio of 0.50 means half a unit of excess
    return per unit of measured volatility—not a 50% return or a 50% chance of profit.
    These estimates do not establish future performance or tail safety. Why these
    steps matter The numerator rewards performance above the specified reference.
    The denominator identifies the kind of variability being charged against that
    performance. B’s extra return is not enough to overcome its larger total volatility
    on Sharpe, while both funds have the same return per unit of supplied downside
    deviation.
