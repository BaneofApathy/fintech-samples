- page: 320
  title: Brier score – how accurate are the probabilities?
  text: " Brier score – how accurate are the probabilities?\n\n Financial interpretation\n\
    \ Brier score is the mean squared difference between predicted probability and\
    \ the actual 0/1 outcome. Lower\n is better.\n\n Working example\n Four loans\
    \ have probabilities [0.10, 0.80, 0.60, 0.20] and outcomes [0, 1, 0, 0].\n\n \
    \                                                   Squared errors = [0.01, 0.04,\
    \ 0.36, 0.04]\n                                         0.01 + 0.04 + 0.36 + 0.04\n\
    \                                                  Brier =          = 0.1125\n\
    \                                                     4\n The third loan contributes\
    \ most of the error because the model assigned 60% default risk to a loan that\
    \ did\n not default.\n\n What it misses\n Brier score reflects both calibration\
    \ and discrimination and is influenced by event prevalence. Compare\n against\
    \ a simple prevalence baseline."
