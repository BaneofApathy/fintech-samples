- page: 321
  title: Brier Score
  text: " Brier Score\n\n   M15 | Formula explained (1/1)\n\n Question: How far are\
    \ the predicted probabilities from the actual 0/1 outcomes?\n                \
    \                                             N\n                            \
    \                             1 X\n                                          \
    \        BS =         (pi − yi )2 .\n                                        \
    \                 N i=1\n Read it aloud: For each loan, subtract its actual binary\
    \ outcome from its predicted probability,\n square that difference, add the squared\
    \ differences, and divide by the number of loans.\n Squaring removes the sign\
    \ and gives larger deviations more weight. Use probabilities as\n decimals, not\
    \ whole-number percentages.\n This is the binary Brier-score convention with range\
    \ 0 to 1. Lower is better on the same\n evaluated sample; zero requires every\
    \ probability to match its realized label exactly."
  paragraphs:
  - Brier Score
  - M15 | Formula explained (1/1)
