- page: 326
  title: Brier Score
  text: " Brier Score\n\n   M15 | Interpretation\n\n What the answer means\n The model\
    \ has better average probability accuracy on these four loans than the constant\n\
    \ baseline. 0.1125 is not an 11.25% default rate or dollar loss. One non-default\
    \ on a 60%\n prediction does not, by itself, establish miscalibration; probability\
    \ quality is assessed across cases.\n Why these steps matter\n For a non-default,\
    \ the error is the probability assigned to default. For a default, it is one minus\n\
    \ that probability in magnitude. Squaring and averaging produces a unitless scoring\
    \ penalty, not\n money lost on the loans."
