  title: Precision
  text: " Precision\n\n   M04 | Class problem | 6 minutes — How Productive Is the\
    \ Review Queue?\n\n A fraud team compares two queues from the same transaction\
    \ population:\n   Queue                                               Alerts reviewed\
    \               Confirmed frauds\n   A                                       \
    \                           50                          15\n   B, stricter threshold\
    \                                              10                            8\n\
    \n Each review costs $4, including reviews of genuine fraud.\n               \
    \                        Confirmed frauds in the queue\n                     \
    \      Precision =                               .\n                         \
    \                   All alerts in the queue\n Calculate each queue’s precision,\
    \ total review cost, and review cost per confirmed fraud. Which\n queue is more\
    \ efficient per investigation? Does that automatically make it the better\n fraud-control\
    \ policy?"
