- page: 229
  title: Precision
  text: " Precision\n\n   M04 | Interpretation\n\n What the answer means\n B uses\
    \ investigator time more efficiently: 80% of its alerts are genuine fraud, versus\
    \ 30%\n for A. But A finds 7 additional frauds. Their loss amounts and the remaining\
    \ review capacity\n matter before selecting a policy. Precision measures queue\
    \ quality, not total fraud coverage.\n Why these steps matter\n The numerator\
    \ of precision is a count of useful discoveries, while the numerator of cost per\n\
    \ fraud is dollars. Keeping the units visible prevents treating an 80% precision\
    \ result as an 80%\n reduction in fraud losses."
