- page: 362
  title: Fairness Diagnostics
  text: " Fairness Diagnostics\n\n   M19 | Formula explained (2/2)\n\n Question: How\
    \ should the difference between the groups be expressed?\n                   \
    \                               ∆T P R = T P RA − T P RB .\n Read it aloud: Subtract\
    \ the repayer approval rates. This is a rate gap; multiply the decimal\n difference\
    \ by 100 to state it in percentage points.\n The selection-rate ratio is a quotient,\
    \ not a difference. It uses A as the reference group because\n the problem specifies\
    \ B/A.\n The exercise is retrospective with known outcomes for every case. These\
    \ diagnostics describe\n differences; no standalone legal or causal conclusion\
    \ follows from the arithmetic."
