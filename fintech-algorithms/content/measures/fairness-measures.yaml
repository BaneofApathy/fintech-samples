  title: Fairness measures – are outcomes or error rates materially different across
    groups?
  text: " Fairness measures – are outcomes or error rates materially different\n across\
    \ groups?\n\n Financial interpretation\n Fairness diagnostics identify where access,\
    \ approvals, false declines, or missed risk differ across relevant\n groups. They\
    \ are prompts for investigation, not standalone legal conclusions.\n\n Working\
    \ example\n Group A: 600 approvals from 1,000 applicants = 60%. Group B: 420 approvals\
    \ from 1,000 applicants =\n 42%.\n                                           \
    \                 42%\n                                     Selection-rate ratio\
    \ =     = 0.70\n                                                            60%\n\
    \ Among applicants later observed to repay, suppose approval recall is 80% for\
    \ Group A and 72% for Group\n B. The equal-opportunity gap is 8 percentage points.\n\
    \n What it misses\n Group labels, outcome quality, sample size, product mix, and\
    \ legitimate risk differences require careful\n analysis. Also compare calibration\
    \ and error costs by slice."
