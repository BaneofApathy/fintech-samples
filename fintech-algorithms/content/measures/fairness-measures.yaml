- page: 366
  title: Fairness Diagnostics
  text: " Fairness Diagnostics\n\n   M19 | Worked solution — Compare Rates, Not Just\
    \ Counts\n\n1. Approval rates: A = 600/1,000 = 60%; B = 400/1,000 = 40%. B/A ratio\n\
    \   = 40/60 = 0.667.\n2. Repayment TPRs: A = 560/800 = 70%; B = 300/500 = 60%.\
    \ Gap = 10 percentage\n   points.\n3. Non-repayers: A = 1,000 − 800 = 200; B =\
    \ 1,000 − 500 = 500.\n4. Non-repayers approved: A = 600 − 560 = 40; B = 400 −\
    \ 300 = 100.\n5. False-positive rates: A = 40/200 = 20%; B = 100/500 = 20%."
  paragraphs:
  - Fairness Diagnostics
  - M19 | Worked solution — Compare Rates, Not Just Counts
