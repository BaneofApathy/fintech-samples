- page: 365
  title: Fairness Diagnostics
  text: " Fairness Diagnostics\n\n   M19 | Class problem | 10 minutes — Compare Rates,\
    \ Not Just Counts\n\n Use a retrospective benchmark with repayment outcomes known\
    \ for every case. These\n are simulated approval decisions, so rejected-applicant\
    \ outcome gaps are not part of this\n exercise.\n Here, approval is the positive\
    \ prediction and repayment is the positive outcome.\n   Group                \
    \                          Applicants   Approvals    Actual repayers         \
    \        Repayers\n                                                          \
    \                                                  approved\n   A            \
    \                                       1,000        600                     \
    \    800              560\n   B                                              \
    \     1,000        400                         500              300\n\n Calculate\
    \ each group’s approval rate, the B/A selection-rate ratio, repayment true-positive\n\
    \ rate, and false-positive rate among non-repayers. Find the TPR gap. Do equal\
    \ false-positive\n rates settle the fairness question?"
