  title: Silhouette
  text: " Silhouette\n\n   M26 | Worked solution — Does the Customer Belong in This\
    \ Segment?\n\n1. Customer A: (5 − 2)/5 = 0.60.\n2. Customer B: (4 − 4)/4 = 0.\n\
    3. Customer C: (3 − 6)/6 = −0.50.\n4. Mean over these three customers: (0.60 +\
    \ 0 − 0.50)/3 = 0.0333."
