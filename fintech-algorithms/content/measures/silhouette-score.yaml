- page: 428
  title: Silhouette
  text: " Silhouette\n\n   M26 | Interpretation\n\n What the answer means\n A is closer\
    \ to its own segment. B lies near a segment boundary. C is, on average, closer\
    \ to\n another segment than to its assigned one, so its assignment needs inspection.\
    \ The near-zero\n mean suggests weak separation for these customers. None of these\
    \ values demonstrates that the\n segments improve marketing response, retention,\
    \ or profitability.\n Why these steps matter\n Positive, zero, and negative values\
    \ indicate different geometric relationships. Those signs do not\n mean profitable,\
    \ neutral, and unprofitable customers. Geometry is only one part of validating\n\
    \ whether a segmentation is useful."
  paragraphs:
  - Silhouette
  - M26 | Interpretation
