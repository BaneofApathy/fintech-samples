  title: Silhouette score – are customers closer to their own segment than to another?
  text: " Silhouette score – are customers closer to their own segment than to\n another?\n\
    \n Financial interpretation\n Silhouette measures geometric separation of clusters.\
    \ It helps identify whether a segmentation is\n mathematically coherent before\
    \ analysts name or use the groups.\n\n Working example\n For one customer, average\
    \ distance to its own cluster is a = 2 and to the nearest other cluster is b =\
    \ 5.\n                                                                  b−a  \
    \      5−2\n                                                  Silhouette =   \
    \          =     = 0.60\n                                                    \
    \             max(a, b)    5\n A value near 1 is well separated, near 0 lies on\
    \ a boundary, and below 0 may be assigned to the wrong\n cluster.\n\n What it\
    \ misses\n A high silhouette score does not prove the segments are stable, actionable,\
    \ fair, or profitable."
