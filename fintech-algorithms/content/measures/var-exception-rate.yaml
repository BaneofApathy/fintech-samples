- page: 537
  title: VaR Exceptions
  text: " VaR Exceptions\n\n   M35 | Class problem | 7 minutes — Does the Tail Forecast\
    \ Hold Up?\n\n A bank evaluates a 99% one-day VaR forecast over 250 trading days.\
    \ Actual daily losses\n exceed that day’s predicted VaR on 10 days. Six of those\
    \ exceptions occur within one 10-day\n period.\n Calculate:\n1. The observed exception\
    \ rate.\n2. The nominal expected number of exceptions under the 99% target.\n\
    3. The ratio of observed to nominal exception rates.\n Explain why reviewing only\
    \ the annual exception count would miss something important. Does\n the count\
    \ alone identify the cause of the problem?"
