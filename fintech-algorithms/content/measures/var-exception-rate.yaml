slug: var-exception-rate
number: 35
title: VaR Exception Rate
question: act
financialInterpretation: Backtesting counts how often actual loss exceeds the predicted
  VaR threshold. Too many exceptions indicate underestimated tail risk or regime change.
workingExample: A 99% daily VaR model is tested over 250 trading days. Roughly 1%
  exceptions implies about 2–3 breaches in an ordinary year. If 12 days exceed VaR,
  the model is materially underestimating risk or the environment has changed.
whatItMisses: Exception count alone does not show the size of breaches or clustered
  failures. Also review Expected Shortfall, stress tests, and breach timing.
