- page: 533
  title: VaR exception rate – did the tail model hold up in real outcomes?
  text: " VaR exception rate – did the tail model hold up in real outcomes?\n\n\n\
    \ Financial interpretation\n Backtesting counts how often actual loss exceeds\
    \ the predicted VaR threshold. Too many exceptions\n indicate underestimated tail\
    \ risk or regime change.\n\n Working example\n A 99% daily VaR model is tested\
    \ over 250 trading days. Roughly 1% exceptions implies about 2–3 breaches\n in\
    \ an ordinary year. If 12 days exceed VaR, the model is materially underestimating\
    \ risk or the environment\n has changed.\n\n What it misses\n Exception count\
    \ alone does not show the size of breaches or clustered failures. Also review\
    \ Expected\n Shortfall, stress tests, and breach timing."
