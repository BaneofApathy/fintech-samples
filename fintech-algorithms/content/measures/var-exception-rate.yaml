- page: 539
  title: VaR Exceptions
  text: " VaR Exceptions\n\n   M35 | Interpretation\n\n What the answer means\n The\
    \ model’s tail forecast deserves investigation: exceptions are more frequent than\
    \ its nominal\n target, and many are clustered. Frequency tests, dependence checks,\
    \ breach sizes, and market\n or data changes are needed to assess the problem.\
    \ The count alone does not prove a particular\n cause or quantify losses beyond\
    \ VaR.\n Why these steps matter\n Using the daily matching forecast matters: comparing\
    \ every day against one convenient\n annual-average VaR would change the test.\
    \ The nominal 1% rate follows from the 99% target;\n it does not explain why this\
    \ sample’s observed rate is 4% or why six exceptions appeared close\n together."
  paragraphs:
  - VaR Exceptions
  - M35 | Interpretation
  - 'What the answer means The model’s tail forecast deserves investigation: exceptions
    are more frequent than its nominal target, and many are clustered. Frequency tests,
