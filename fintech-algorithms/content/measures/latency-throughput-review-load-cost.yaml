- page: 582
  title: Throughput and Review Load
  text: " Throughput and Review Load\n\n   M39b | Interpretation\n\n What the answer\
    \ means\n There are two separate capacity failures: scoring cannot keep up with\
    \ incoming payments, and\n investigators cannot work the generated queue. Increasing\
    \ API capacity would not fix the review\n backlog. A threshold or staffing change\
    \ must account for the fraud that would remain\n unreviewed.\n Why these steps\
    \ matter\n A rate difference has units of requests per second or alerts per day.\
    \ Multiplying by matching\n elapsed time produces a count. Keeping the units explicit\
    \ prevents confusing 12,000 requests\n per minute with 12,000 per second, or interpreting\
    \ a queue count as a response time."
  paragraphs:
  - Throughput and Review Load
  - M39b | Interpretation
  - 'What the answer means There are two separate capacity failures: scoring cannot
    keep up with incoming payments, and investigators cannot work the generated queue.
    Increasing API capacity would not fix the review backlog. A threshold or staffing
    change must account for the fraud that would remain unreviewed. Why these steps
    matter A rate difference has units of requests per second or alerts per day. Multiplying
    by matching elapsed time produces a count. Keeping the units explicit prevents
    confusing 12,000 requests per minute with 12,000 per second, or interpreting a
    queue count as a response time.'
