- page: 581
  title: Throughput and Review Load
  text: " Throughput and Review Load\n\n   M39b | Worked solution — Calculate Both\
    \ Bottlenecks\n\n1. API capacity: 12,000/60 = 200 requests/second.\n2. API backlog\
    \ growth: 250 − 200 = 50 requests/second.\n3. Ten-minute backlog: 50 × 10 × 60\
    \ = 30, 000 requests.\n4. Daily human capacity: 15 × 20 = 300 cases.\n5. Daily\
    \ unworked alerts: 500 − 300 = 200. After three days: 200(3) = 600 alerts.\n6.\
    \ Required analyst pace: 500/15 = 33.33 cases/day, versus the available 20."
  paragraphs:
  - Throughput and Review Load
  - M39b | Worked solution — Calculate Both Bottlenecks
