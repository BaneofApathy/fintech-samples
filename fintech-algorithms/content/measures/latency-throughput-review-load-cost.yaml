  title: Latency
  text: " Latency\n\n   M39a | Class problem | 9 minutes — The Average Can Pass While\
    \ the Service Fails\n\n A fraud-scoring service handles 100 requests, with eventual\
    \ response times:\n   Requests                                            Latency\
    \ each\n   95                                                  40 ms\n   4   \
    \                                                180 ms\n   1                \
    \                                   1,000 ms\n\n Calculate mean latency, p95,\
    \ and p99. Use the nearest-rank percentile: rank ⌈pN ⌉ in ascending\n order.\n\
    \ The caller treats any response after 100 ms as a deadline failure, even if a\
    \ result later arrives.\n Calculate this timeout/deadline-failure rate. The service\
    \ objective requires 99% of requests\n within 100 ms. Does this sample meet it?"
