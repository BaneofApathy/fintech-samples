    ms against a 100 ms authorization target. It creates 25,000 alerts per day while
    investigators can review 8,000. Inference costs $0.003 per transaction at 50 million
    transactions per month: $150,000 monthly.'
  - What it misses Averages hide tail latency and peak load. Report p95/p99, timeout
    rate, queue size, abstention rate, uptime, and cost at expected volume.
