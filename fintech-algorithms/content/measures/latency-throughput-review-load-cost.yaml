- page: 590
  title: Cost and Abstention
  text: " Cost and Abstention\n\n   M39c | Interpretation\n\n What the answer means\n\
    \ Abstention adds review expense and routes those cases to correct manual resolution\
    \ under the\n exercise’s assumptions. Model spend alone understates operating\
    \ cost. Even the all-in $0.80 per\n request excludes the consequences of the 100\
    \ wrong answers; it is not a complete economic loss\n measure.\n Why these steps\
    \ matter\n The same numerical fraction can represent different concepts: 800/900\
    \ is automatic-answer\n accuracy, while $800 divided by 900 correct resolutions\
    \ is a cost in dollars. The numerator’s\n units and the denominator’s population\
    \ determine the meaning. The scenario does not establish\n what automatic answers\
    \ would have been produced on the abstained cases."
  paragraphs:
  - Cost and Abstention
  - M39c | Interpretation
  - 'What the answer means Abstention adds review expense and routes those cases to
    correct manual resolution under the exercise’s assumptions. Model spend alone
    understates operating cost. Even the all-in $0.80 per request excludes the consequences
    of the 100 wrong answers; it is not a complete economic loss measure. Why these
    steps matter The same numerical fraction can represent different concepts: 800/900
    is automatic-answer accuracy, while $800 divided by 900 correct resolutions is
    a cost in dollars. The numerator’s units and the denominator’s population determine
    the meaning. The scenario does not establish what automatic answers would have
    been produced on the abstained cases.'
