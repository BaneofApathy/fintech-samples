  title: 'Working code: calculate core classification measures'
  text: " Working code: calculate core classification measures\n\n\n  import numpy\
    \ as np\n  from sklearn.metrics import (\n      confusion_matrix, precision_score,\
    \ recall_score,\n      f1_score, roc_auc_score, average_precision_score,\n   \
    \   brier_score_loss, log_loss\n  )\n\n  y_true = np.array([0,0,1,0,1,0,0,1,0,1])\n\
    \  y_score = np.array([.05,.20,.90,.30,.70,.40,.10,.60,.80,.55])\n  y_pred = (y_score\
    \ >= .50).astype(int)\n\n  print(\"confusion matrix\\n\", confusion_matrix(y_true,\
    \ y_pred))\n  print(\"precision\", precision_score(y_true, y_pred))\n  print(\"\
    recall\", recall_score(y_true, y_pred))\n  print(\"F1\", f1_score(y_true, y_pred))\n\
    \  print(\"ROC-AUC\", roc_auc_score(y_true, y_score))\n  print(\"PR-AUC\", average_precision_score(y_true,\
    \ y_score))\n  print(\"Brier\", brier_score_loss(y_true, y_score))\n  print(\"\
    log loss\", log_loss(y_true, y_score))\n\n Change the threshold from 0.50 to 0.70.\
    \ Which measures move, which do not, and which operating decision\n changes?"
