- page: 567
  title: Latency, throughput, review load, and cost – can the system operate at financial
    scale?
  text: " Latency, throughput, review load, and cost – can the system operate at\n\
    \ financial scale?\n\n\n Financial interpretation\n Production quality includes\
    \ speed, capacity, unit economics, and human workload. A statistically strong\n\
    \ model can still fail operationally.\n\n Working example\n A fraud API has mean\
    \ latency of 40 ms but p95 latency of 180 ms against a 100 ms authorization target.\
    \ It\n creates 25,000 alerts per day while investigators can review 8,000. Inference\
    \ costs $0.003 per transaction at\n 50 million transactions per month: $150,000\
    \ monthly.\n\n What it misses\n Averages hide tail latency and peak load. Report\
    \ p95/p99, timeout rate, queue size, abstention rate,\n uptime, and cost at expected\
    \ volume."
  paragraphs:
