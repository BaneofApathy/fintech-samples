    Interval coverage, stress-period errors Are clusters meaningful? Silhouette, inertia
    Stability, business actionability, fairness Did RAG find evidence? Recall@K, context
    precision, MRR / nDCG Faithfulness, citation and numeric checks Is the portfolio
