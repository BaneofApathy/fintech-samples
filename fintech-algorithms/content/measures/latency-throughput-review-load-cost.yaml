  title: Throughput and Review Load
  text: " Throughput and Review Load\n\n   M39b | Class problem | 9 minutes — Calculate\
    \ Both Bottlenecks\n\n A load test establishes a service’s maximum sustained capacity\
    \ at 12,000 requests per\n minute. New requests arrive at 250 per second for ten\
    \ minutes. Start with an empty queue;\n assume no dropped requests or extra capacity.\n\
    \ Separately, the model generates 500 investigation alerts per day. There are\
    \ 15 analysts,\n each able to finish 20 cases per day. Start with no alert backlog.\n\
    \ Calculate API capacity per second and the ten-minute request backlog. Then calculate\
    \ daily\n human capacity, the three-day alert backlog, and required cases per\
    \ analyst per day to keep up."
  paragraphs:
