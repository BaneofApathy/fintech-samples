  - mae = mean_absolute_error(actual, forecast) rmse = mean_squared_error(actual,
    forecast) ** 0.5 mape = np.mean(np.abs((actual - forecast) / actual)) wape = np.abs(actual
    - forecast).sum() / np.abs(actual).sum() r2 = r2_score(actual, forecast) print(mae,
    rmse, mape, wape, r2)
  - '# Precision@K for a ranked fraud queue labels = np.array([1,0,1,1,0,0,1,0,0,0])
    k = 5 print("precision@k", labels[:k].mean()) print("recall@k", labels[:k].sum()
