- page: 599
  title: 'Working code: calculate forecast and ranking measures'
  text: " Working code: calculate forecast and ranking measures\n\n\n\n  import numpy\
    \ as np\n  from sklearn.metrics import mean_absolute_error, mean_squared_error,\
    \ r2_score\n\n  actual   = np.array([100, 120, 80, 150], dtype=float)\n  forecast\
    \ = np.array([ 90, 130,100, 140], dtype=float)\n\n  mae = mean_absolute_error(actual,\
    \ forecast)\n  rmse = mean_squared_error(actual, forecast) ** 0.5\n  mape = np.mean(np.abs((actual\
    \ - forecast) / actual))\n  wape = np.abs(actual - forecast).sum() / np.abs(actual).sum()\n\
    \  r2   = r2_score(actual, forecast)\n  print(mae, rmse, mape, wape, r2)\n\n \
    \ # Precision@K for a ranked fraud queue\n  labels = np.array([1,0,1,1,0,0,1,0,0,0])\n\
    \  k = 5\n  print(\"precision@k\", labels[:k].mean())\n  print(\"recall@k\", labels[:k].sum()\
    \ / labels.sum())\n\n Ask students to explain every output in financial language\
    \ before they tune a model."
  paragraphs:
