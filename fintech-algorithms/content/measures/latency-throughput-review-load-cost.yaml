  title: Which measures belong to which financial question?
  text: " Which measures belong to which financial question?\n\n    Financial question\
    \                       Start with                                        Always\
    \ add\n\n    Can it rank rare risk?                   PR-AUC, precision@K, recall@K,\
    \ lift               Prevalence, capacity, expected cost\n    Can it rank general\
    \ bi-                  ROC-AUC, KS                                       Calibration,\
    \ threshold metrics, slice results\n    nary risk?\n    Are probabilities usable?\
    \                Calibration curve, Brier, log loss                Expected loss,\
    \ score-band stability\n    Is the forecast useful?                  MAE / RMSE,\
    \ MASE                                  Interval coverage, stress-period errors\n\
    \    Are clusters meaningful?                 Silhouette, inertia            \
    \                   Stability, business actionability, fairness\n    Did RAG find\
    \ evidence?                   Recall@K, context precision, MRR / nDCG        \
    \   Faithfulness, citation and numeric checks\n    Is the portfolio accept-  \
    \               Return, volatility, Sharpe / Sortino              Drawdown, turnover,\
    \ costs, constraints\n    able?\n    Is tail risk controlled?                \
    \ VaR, Expected Shortfall, shortfall probability    Backtests, stress tests, sensitivity\n\
    \    Does the agent work                      Task success, verification pass\
    \ rate              Unsafe attempts, cost, p95 latency, traces\n    safely?\n\n\
    \n Minimum reporting standard\n One ranking or error measure, one operating-point\
    \ measure, one financial-cost measure, one slice or stress\n result, and one production-control\
    \ measure."
  paragraphs:
  - Which measures belong to which financial question?
  - Financial question Start with Always add
