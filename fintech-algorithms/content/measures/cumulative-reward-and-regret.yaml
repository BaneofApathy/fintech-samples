- page: 541
  title: Cumulative reward and regret – did a sequential policy outperform a baseline?
  text: " Cumulative reward and regret – did a sequential policy outperform a\n baseline?\n\
    \n Financial interpretation\n Cumulative reward summarizes the policy objective\
    \ over time. Regret measures how much value was lost\n relative to a benchmark\
    \ or best available action.\n\n Working example: trade execution\n TWAP execution\
    \ costs 18 basis points, the learned policy costs 15 basis points, and the best\
    \ hindsight\n schedule costs 11 basis points.\n▶ Improvement versus TWAP: 18 −\
    \ 15 = 3 basis points.\n▶ Regret versus hindsight: 15 − 11 = 4 basis points.\n\
    \ Across 1,000 simulations, also report mean, variance, and worst-tail cost –\
    \ not only the average reward.\n\n What it misses\n A reward can omit market impact,\
    \ inventory limits, conduct obligations, or failed completion. Inspect each\n\
    \ reward term and constraint."
