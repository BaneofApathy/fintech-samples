financialInterpretation: Cumulative reward summarizes the policy objective over time.
  Regret measures how much value was lost relative to a benchmark or best available
  action.
workingExample: ': trade execution TWAP execution costs 18 basis points, the learned
  policy costs 15 basis points, and the best hindsight schedule costs 11 basis points.
  ▶ Improvement versus TWAP: 18 − 15 = 3 basis points. ▶ Regret versus hindsight:
  15 − 11 = 4 basis points. Across 1,000 simulations, also report mean, variance,
  and worst-tail cost – not only the average reward.'
