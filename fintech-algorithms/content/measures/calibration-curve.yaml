  title: Calibration curve – does a predicted probability behave like a probability?
  text: " Calibration curve – does a predicted probability behave like a probability?\n\
    \n\n Financial interpretation\n Calibration matters when scores drive pricing,\
    \ reserves, limits, expected loss, or risk-based authentication. A\n 10% probability\
    \ should correspond to roughly 10 events in 100 similar cases.\n\n Working example\n\
    \    Score band                 Cases              Actual defaults   Interpretation\n\
    \    Around 10%                   100                     9          Close to\
    \ calibrated\n    Around 20%                   100                    31     \
    \     Model materially understates risk\n\n\n What it misses\n A perfectly calibrated\
    \ model can rank poorly, and a high-AUC model can be badly calibrated. Report\n\
    \ discrimination and calibration separately."
