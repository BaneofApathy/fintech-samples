- page: 316
  title: Calibration
  text: " Calibration\n\n   M14 | Class problem | 8 minutes — Do the Probabilities\
    \ Match Outcomes?\n\n A lender groups loans into three score bands. The table\
    \ gives the mean predicted probability\n within each band:\n   Band          \
    \                                 Loans          Mean predicted             Actual\
    \ defaults\n                                                               default\
    \ probability\n   Low                                              100       \
    \                        5%                  3\n   Medium                    \
    \                       100                               10%               10\n\
    \   High                                             100                     \
    \          20%               30\n\n1. Calculate expected defaults and observed\
    \ default rates for each band.\n2. Identify which band understated risk most in\
    \ this sample.\n3. Assume a fixed $4,000 loss per default. Compare the total probability-based\
    \ expected-loss\n   estimate with realized loss.\n4. Which calibration-curve points\
    \ would you plot?"
