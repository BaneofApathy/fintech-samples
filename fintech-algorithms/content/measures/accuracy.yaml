- page: 213
  title: Accuracy
  text: " Accuracy\n\n   M02 | Interpretation\n\n What the answer means\n 98% accuracy\
    \ can describe a system that provides no fraud detection. Accuracy counts\n every\
    \ mistake equally, although a missed fraud and a false alert may have very different\
    \ costs.\n More information is needed to decide whether the detector’s additional\
    \ interruptions are\n worthwhile.\n Why these steps matter\n The 96% result refers\
    \ to all transactions, including the many legitimate cases. The loss of two\n\
    \ percentage points versus the baseline does not tell you whether catching 15\
    \ frauds compensates\n for the 35 false alerts. That requires a cost model."
