    \                                     N\n Read it aloud: Add caught frauds and\
    \ correctly passed legitimate transactions, then divide by\n all transactions.\n\
    \ The always-legitimate baseline passes every transaction. Its correct predictions\
    \ are all legitimate\n cases; its mistakes are all frauds.\n The accuracy fraction\
    \ is between 0 and 1. Multiply by 100 to express it as a percentage. It\n counts\
    \ each mistake once, regardless of financial severity."
