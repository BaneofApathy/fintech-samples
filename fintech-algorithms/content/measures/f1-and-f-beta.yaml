  title: F1 and F-beta
  text: " F1 and F-beta\n\n   M07 | Symbols and terms (1/2)\n\n\n   Symbol or term\
    \                                 Meaning in this example\n   P              \
    \                                Precision: the fraction of alerts that are genuine\
    \ fraud; use 0.30\n                                                  here.\n \
    \  R                                              Recall: the fraction of actual\
    \ frauds caught; use 0.75 here.\n   PR                                       \
    \      Product P × R, not a separate variable and not the PR curve.\n   F1   \
    \                                          Harmonic-mean score using equal precision–recall\
    \ weighting.\n   β (beta)                                       Positive weighting\
    \ parameter; above 1 emphasizes recall, below 1\n                            \
    \                      emphasizes precision.\n   β2                          \
    \                   Beta multiplied by itself; for beta 2 this is 4, not 2."
