- page: 249
  title: F1 and F-beta
  text: " F1 and F-beta\n\n   M07 | Formula explained (1/1)\n\n Question: How can\
    \ precision and recall be summarized in one score?\n                         \
    \                                 2P R            (1 + β 2 )P R\n            \
    \                                      F1 =         ,   Fβ =                 .\n\
    \                                                         P +R              β2P\
    \ + R\n Read it aloud: F1 is twice the product divided by the sum: the harmonic\
    \ mean of precision and\n recall. F-beta changes the weighting of that combination.\n\
    \ For F2, set beta to 2 and beta-squared to 4. This places more emphasis on recall\
    \ than F1 does.\n It does not encode a particular dollar-cost ratio.\n Compare\
    \ with the arithmetic mean, (P + R)/2, which is an ordinary equal-weight average."
