- page: 248
  title: F1 and F-beta – one score that balances precision and recall
  text: " F1 and F-beta – one score that balances precision and recall\n\n\n\n Financial\
    \ interpretation\n F1 is useful when both alert quality and risk capture matter.\
    \ F-beta lets the business state which matters more.\n\n\n Working example\n With\
    \ precision P = 0.30 and recall R = 0.60:\n                                  \
    \                          PR                             PR\n               \
    \                                   F1 = 2        = 0.40,   F2 = (1 + 22 ) 2 \
    \    = 0.50\n                                                           P +R \
    \                        2 P +R\n F2 is higher because it gives more weight to\
    \ recall when missed fraud is especially expensive.\n\n\n What it misses\n F-scores\
    \ do not use dollar costs, calibration, or review capacity. A higher F1 is not\
    \ an automatic deployment decision."
