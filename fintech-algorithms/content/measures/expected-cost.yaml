- page: 337
  title: Expected cost – which threshold creates the lower financial loss?
  text: " Expected cost – which threshold creates the lower financial loss?\n\n Financial\
    \ interpretation\n Expected cost converts model errors into dollars. It is often\
    \ the clearest way to choose an operating\n threshold.\n\n Working example\n Assume\
    \ each missed fraud costs $500 and each false alert costs $4.\n    Threshold \
    \             TP          FP         FN                   Error cost\n    A  \
    \                     60        140         40   40(500) + 140(4) = $20,560  \
    \ Threshold B has lower precision, but it\n    B                       75    \
    \    500         25   25(500) + 500(4) = $14,500\n\n creates lower modeled loss\
    \ because missed fraud is expensive.\n\n What it misses\n Cost estimates can be\
    \ wrong, review capacity may cap volume, and customer harm may not be fully\n\
    \ monetized. Stress the assumptions."
