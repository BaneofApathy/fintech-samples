  title: Threshold Economics
  text: " Threshold Economics\n\n   M17b | Formula explained (1/1)\n\n Question: At\
    \ what fraud probability do the two actions have equal expected cost?\n      \
    \                                                Cpass = cF N p,        Cf lag\
    \ = cF P (1 − p).\n Read it aloud: Passing incurs the missed-fraud loss only when\
    \ the transaction is fraud.\n Flagging incurs the false-alert cost only when it\
    \ is legitimate, under the supplied assumptions.\n Set the costs equal and solve:\n\
    \                                                                            \
    \                  cF P\n                                                  cF\
    \ N p∗ = cF P (1 − p∗ )    ⇒    p∗ =               .\n                       \
    \                                                                   cF N + cF\
    \ P\n Below the crossing choose pass; above it choose flag. At exact equality\
    \ the actions have the\n same modeled cost."
