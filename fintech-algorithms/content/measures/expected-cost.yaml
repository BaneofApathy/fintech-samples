  title: Threshold Economics
  text: " Threshold Economics\n\n   M17b | Class problem | 8 minutes — Why the Cutoff\
    \ Need Not Be 50%\n\n Use a simplified two-action fraud decision with calibrated\
    \ fraud probability p:\n▶ Pass a fraud: loss $500.\n▶ Flag a legitimate transaction:\
    \ cost $4.\n▶ Correct actions: zero incremental cost.\n Assume flagging prevents\
    \ the fraud loss. Ignore capacity constraints and other costs for this\n exercise.\n\
    \                                                  Cpass = 500p,   Cf lag = 4(1\
    \ − p).\n\n1. Solve for the probability where the actions have equal expected\
    \ cost.\n2. Choose the lower-cost action for p = 0.5%, 1%, and 10%.\n3. Why would\
    \ using a 50% threshold be inconsistent with these assumptions?"
