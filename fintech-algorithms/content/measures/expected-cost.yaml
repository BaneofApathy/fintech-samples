- page: 343
  title: Expected Cost
  text: " Expected Cost\n\n   M17a | Interpretation\n\n What the answer means\n B\
    \ has lower modeled error cost but is not feasible under the stated review policy.\
    \ A is the\n feasible choice among these two today. B requires additional capacity\
    \ or a separately tested\n workflow—not an assumption that unreviewed alerts still\
    \ prevent fraud.\n Why these steps matter\n A lower computed cost assumes the\
    \ required interventions can be delivered. Once the review\n queue exceeds capacity,\
    \ the loss calculation is no longer enough to justify that operating point.\n\
    \ Unreviewed alerts must not be credited as prevented fraud."
  paragraphs:
  - Expected Cost
  - M17a | Interpretation
  - What the answer means B has lower modeled error cost but is not feasible under
    the stated review policy. A is the feasible choice among these two today. B requires
    additional capacity or a separately tested workflow—not an assumption that unreviewed
    alerts still prevent fraud. Why these steps matter A lower computed cost assumes
    the required interventions can be delivered. Once the review queue exceeds capacity,
    the loss calculation is no longer enough to justify that operating point. Unreviewed
    alerts must not be credited as prevented fraud.
