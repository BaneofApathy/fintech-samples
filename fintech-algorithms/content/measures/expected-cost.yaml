- page: 342
  title: Expected Cost
  text: " Expected Cost\n\n   M17a | Worked solution — Check Economics and Capacity\n\
    \n1. Threshold A:\n                                                  5(500) +\
    \ 35(4) = 2,500 + 140 = $2,640.\n2. Threshold B:\n                           \
    \                       2(500) + 82(4) = 1,000 + 328 = $1,328.\n3. Modeled savings\
    \ from B: 2,640 − 1,328 = $1,312.\n4. Review volumes: A produces 15 + 35 = 50\
    \ alerts; B produces 18 + 82 = 100.\n5. Apply the capacity limit: A fits within\
    \ 75; B exceeds capacity by 25 alerts."
  paragraphs:
  - Expected Cost
  - M17a | Worked solution — Check Economics and Capacity
  - '1. Threshold A: 5(500) + 35(4) = 2,500 + 140 = $2,640. 2. Threshold B: 2(500)
    + 82(4) = 1,000 + 328 = $1,328. 3. Modeled savings from B: 2,640 − 1,328 = $1,312.
    4. Review volumes: A produces 15 + 35 = 50 alerts; B produces 18 + 82 = 100. 5.
    Apply the capacity limit: A fits within 75; B exceeds capacity by 25 alerts.'
