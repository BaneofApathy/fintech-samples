  title: Threshold Economics
  text: " Threshold Economics\n\n   M17b | Worked solution — Why the Cutoff Need Not\
    \ Be 50%\n\n1. Set costs equal: 500p = 4(1 − p) = 4 − 4p.\n2. Solve: 504p = 4,\
    \ so\n                                                   p∗ = 4/504 = 0.0079365\
    \ = 0.79365%.\n3. Calculate each action’s cost.\n   Fraud probability        \
    \                              Pass cost             Flag cost Lower-cost action\n\
    \   0.5%                                           500(0.005) = $2.50   4(0.995)\
    \ = $3.98 Pass\n   1%                                             500(0.01) =\
    \ $5.00     4(0.99) = $3.96 Flag\n   10%                                     \
    \       500(0.10) = $50.00    4(0.90) = $3.60 Flag"
