- page: 341
  title: Expected Cost
  text: " Expected Cost\n\n   M17a | Class problem | 8 minutes — Check Economics and\
    \ Capacity\n\n Two thresholds are evaluated on the same 20 frauds:\n   Threshold\
    \                                                  TP                        \
    \    FP          FN\n   A                                                    \
    \       15                            35           5\n   B                   \
    \                                        18                            82    \
    \       2\n\n Each missed fraud costs $500. Each false alert costs $4. For this\
    \ simplified cost model, other\n outcomes have zero incremental cost.\n      \
    \                                            Error cost = 500(F N ) + 4(F P ).\n\
    \ The team can review 75 alerts per day; every flag requires review.\n Calculate\
    \ each threshold’s cost and review volume. Which has the lower modeled cost? Which\n\
    \ is feasible with the existing team? State what must change before selecting\
    \ the other operating\n point."
  paragraphs:
  - Expected Cost
  - M17a | Class problem | 8 minutes — Check Economics and Capacity
