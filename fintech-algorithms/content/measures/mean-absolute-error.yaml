- page: 369
  title: MAE – on average, how far was the forecast from reality?
  text: " MAE – on average, how far was the forecast from reality?\n\n Financial interpretation\n\
    \ Mean absolute error is the average size of the forecast miss in the original\
    \ financial unit. Every dollar of\n error receives equal weight.\n\n Working example:\
    \ daily settlement outflow in $ millions\n Actual values: [100, 120, 80, 150];\
    \ forecasts: [90, 130, 100, 140].\n\n                                        \
    \              Absolute errors = [10, 10, 20, 10]\n                          \
    \                 10 + 10 + 20 + 10\n                                        \
    \          M AE =     = $12.5 million\n                                      \
    \              4\n Treasury is off by $12.5 million per day on average.\n\n What\
    \ it misses\n MAE treats a $20 million miss as exactly twice a $10 million miss.\
    \ It does not emphasize extreme errors or\n direction."
