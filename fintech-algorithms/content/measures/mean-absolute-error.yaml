- page: 374
  title: MAE
  text: " MAE\n\n   M20 | Worked solution — How Many Dollars Was the Forecast Off?\n\
    \n1. Model absolute errors: |100 − 90| = 10, |120 − 130| = 10, |80 − 100| = 20,\n\
    \   |150 − 140| = 10.\n2. Model MAE: (10 + 10 + 20 + 10)/4 = 12.5 thousand dollars.\n\
    3. Baseline absolute errors: 0, 20, 20, 50.\n4. Baseline MAE: (0 + 20 + 20 + 50)/4\
    \ = 22.5 thousand dollars.\n5. Improvement: 22.5 − 12.5 = 10 thousand dollars;\
    \ relative reduction = 10/22.5 = 44.44%."
  paragraphs:
  - MAE
  - M20 | Worked solution — How Many Dollars Was the Forecast Off?
