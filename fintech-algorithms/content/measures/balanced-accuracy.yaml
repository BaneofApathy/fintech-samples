- page: 215
  title: Balanced accuracy – did the model perform on both classes?
  text: " Balanced accuracy – did the model perform on both classes?\n\n\n Financial\
    \ interpretation\n Balanced accuracy gives equal weight to catching the positive\
    \ class and correctly passing the negative class.\n It is useful when one class\
    \ is much smaller than the other.\n\n Working example\n                      \
    \                                    60                            9,760\n   \
    \                                           Recall =       = 60.0%,   Specificity\
    \ =         = 98.6%\n                                                        \
    \ 100                            9,900\n                                     \
    \             60.0% + 98.6%\n                                                \
    \  Balanced accuracy =\n                                                     \
    \              = 79.3%\n                                                     \
    \    2\n The ordinary accuracy was 98.2%; balanced accuracy exposes that the model\
    \ catches only 60% of fraud.\n\n What it misses\n It still treats fraud misses\
    \ and customer friction as equally important. A cost-sensitive decision may require\n\
    \ a different threshold."
