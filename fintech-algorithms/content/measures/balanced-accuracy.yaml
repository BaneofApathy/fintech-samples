- page: 221
  title: Balanced Accuracy
  text: " Balanced Accuracy\n\n   M03 | Interpretation\n\n What the answer means\n\
    \ The detector performs substantially better when fraud and legitimate transactions\
    \ receive equal\n class-level weight: 85.71% versus 50%. This still does not price\
    \ errors in dollars. Balanced\n accuracy is not a claim that 85.71% of all individual\
    \ transactions were classified correctly.\n Why these steps matter\n Balanced\
    \ accuracy first normalizes within each class. The rare fraud class therefore\
    \ contributes\n as much as the much larger legitimate class. It is still a statistical\
    \ weighting convention, not a\n financial cost weighting."
  paragraphs:
  - Balanced Accuracy
  - M03 | Interpretation
  - 'What the answer means The detector performs substantially better when fraud and
    legitimate transactions receive equal class-level weight: 85.71% versus 50%. This
    still does not price errors in dollars. Balanced accuracy is not a claim that
    85.71% of all individual transactions were classified correctly. Why these steps
    matter Balanced accuracy first normalizes within each class. The rare fraud class
    therefore contributes as much as the much larger legitimate class. It is still
    a statistical weighting convention, not a financial cost weighting.'
