  title: nDCG
  text: " nDCG\n\n   M29b | Formula explained (1/2)\n\n Question: How much useful\
    \ evidence is delivered near the top of the ranking?\n                       \
    \                                                     K\n                    \
    \                                                        X      gaini\n      \
    \                                       gaini = 2reli − 1,   DCG@K =         \
    \            .\n                                                             \
    \               i=1\n                                                        \
    \                        log 2 (i + 1)\n\n Read it aloud: Turn each relevance\
    \ grade into a gain, then reduce its contribution according to\n its rank. Add\
    \ the discounted gains across the top K results.\n This exercise explicitly uses\
    \ exponential gain. Higher grades are rewarded disproportionately.\n Rank 1 has\
    \ divisor 1, so its gain is undiscounted."
