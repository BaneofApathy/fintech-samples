- page: 463
  title: nDCG
  text: " nDCG\n\n   M29b | Formula explained (2/2)\n\n Question: How close is the\
    \ ordering to the best possible ordering of this candidate set?\n            \
    \                                      DCG@K\n                               \
    \    nDCG@K =                  .\n                                           \
    \      IDCG@K\n Read it aloud: Divide the observed discounted gain by the gain\
    \ obtained by putting the same\n candidates in descending relevance order.\n The\
    \ ideal order uses the same cutoff, gain function, and discount rule. A score\
    \ of 1 indicates\n the ideal score has been reached, not that the generated answer\
    \ is correct.\n Calculation convention: The reported detailed totals use the unrounded\
    \ value of log2 (3). The\n supplied 1.585 approximation can change the last printed\
    \ decimal."
