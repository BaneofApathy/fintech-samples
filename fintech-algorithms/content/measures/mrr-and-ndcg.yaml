- page: 460
  title: MRR
  text: " MRR\n\n   M29a | Worked solution — How Soon Does the First Useful Source\
    \ Appear?\n\n1. Reciprocal ranks: Q1 = 1; Q2 = 1/2 = 0.5; Q3 = 1/4 = 0.25; Q4\
    \ = 0.\n2. Original MRR:\n                                                  (1\
    \ + 0.5 + 0.25 + 0)/4 = 1.75/4 = 0.4375.\n3. Updated Q4 contribution: 1/2 = 0.5.\n\
    4. Updated MRR:\n                                                  (1 + 0.5 +\
    \ 0.25 + 0.5)/4 = 2.25/4 = 0.5625.\n5. Improvement: 0.5625 − 0.4375 = 0.125 score\
    \ units."
  paragraphs:
  - MRR
  - M29a | Worked solution — How Soon Does the First Useful Source Appear?
  - '1. Reciprocal ranks: Q1 = 1; Q2 = 1/2 = 0.5; Q3 = 1/4 = 0.25; Q4 = 0. 2. Original
    MRR: (1 + 0.5 + 0.25 + 0)/4 = 1.75/4 = 0.4375. 3. Updated Q4 contribution: 1/2
    = 0.5. 4. Updated MRR: (1 + 0.5 + 0.25 + 0.5)/4 = 2.25/4 = 0.5625. 5. Improvement:
    0.5625 − 0.4375 = 0.125 score units.'
