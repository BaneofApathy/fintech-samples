  title: MRR
  text: " MRR\n\n   M29a | Class problem | 6 minutes — How Soon Does the First Useful\
    \ Source Appear?\n\n Four analyst questions produce their first relevant filing\
    \ passage at these ranks:\n   Question                                       First\
    \ relevant rank\n   Q1                                             1\n   Q2  \
    \                                           2\n   Q3                         \
    \                    4\n   Q4                                             Not\
    \ found in the evaluated results\n\n                                         \
    \                         1 X 1\n                                            \
    \           M RR =               .\n                                         \
    \                         Q q rankq\n Use zero for a question with no relevant\
    \ result. Calculate MRR. Then assume a revised retriever\n brings Q4’s first relevant\
    \ passage to rank 2, with the other ranks unchanged. Calculate the new\n MRR and\
    \ improvement."
