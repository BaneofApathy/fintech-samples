  title: nDCG
  text: " nDCG\n\n   M29b | Worked solution — Put the Best Evidence First\n\n1. Convert\
    \ relevance to gain: 21 − 1 = 1, 23 − 1 = 7, 20 − 1 = 0.\n2. Actual order:\n \
    \                                                 DCG = 1/1 + 7/1.585 + 0/2 ≈\
    \ 5.4165.\n3. Ideal order: grades [3, 1, 0], gains [7, 1, 0].\n              \
    \               IDCG = 7/1 + 1/1.585 + 0/2 ≈ 7.6309.\n4. Normalize:\n        \
    \                                          nDCG@3 = 5.4165/7.6309 ≈ 0.7098."
