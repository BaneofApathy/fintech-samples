- page: 469
  title: nDCG
  text: " nDCG\n\n   M29b | Interpretation\n\n What the answer means\n The retriever\
    \ found the strongest passage but put it behind weaker evidence. Its discounted\n\
    \ relevance score is about 71% of the ideal ordering’s score. Moving the grade-3\
    \ passage first\n gives nDCG of 1 here. Neither score establishes that the generated\
    \ answer uses the passage\n correctly.\n Why these steps matter\n The normalized\
    \ result is a fraction of ideal discounted relevance, not the fraction of sources\n\
    \ that are relevant. Ranking the strongest source second loses more credit under\
    \ exponential gain\n than a simple relevant-versus-irrelevant count would reveal."
  paragraphs:
  - nDCG
  - M29b | Interpretation
  - What the answer means The retriever found the strongest passage but put it behind
    weaker evidence. Its discounted relevance score is about 71% of the ideal ordering’s
    score. Moving the grade-3 passage first gives nDCG of 1 here. Neither score establishes
