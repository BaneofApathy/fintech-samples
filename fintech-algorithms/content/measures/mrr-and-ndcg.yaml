- page: 454
  title: MRR and nDCG – how early and how well ordered are the useful sources?
  text: " MRR and nDCG – how early and how well ordered are the useful sources?\n\n\
    \ Financial interpretation\n Mean reciprocal rank rewards finding the first useful\
    \ source early. nDCG rewards placing highly relevant\n sources above partially\
    \ relevant ones.\n\n Working example\n First relevant passages for four questions\
    \ appear at ranks [1, 2, 5, not found]:\n\n                                  \
    \                         1 + 1/2 + 1/5 + 0\n                                \
    \                  M RR =                     = 0.425\n                      \
    \                                             4\n For graded relevance, ranking\
    \ [1, 3, 0] instead of the ideal [3, 1, 0] gives approximately nDCG@3 = 0.71\n\
    \ because the most useful source was placed second.\n\n What it misses\n MRR focuses\
    \ on the first relevant item. nDCG requires trustworthy relevance grades. Neither\
    \ measures\n answer faithfulness."
