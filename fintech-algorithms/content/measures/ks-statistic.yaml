- page: 278
  title: KS
  text: " KS\n\n   M10 | Interpretation\n\n What the answer means\n At B, the model\
    \ has captured 60% of defaults but only 15% of non-defaults. That separation is\n\
    \ a ranking diagnostic. Choosing a lending action still requires loss severity,\
    \ approval value,\n capacity, and policy constraints.\n Why these steps matter\n\
    \ Dividing both counts by all 100 applicants would answer a different question.\
    \ KS compares\n within-class capture rates, so each class needs its own denominator.\
    \ The biggest statistical\n gap does not include lending margins or loss severity."
  paragraphs:
  - KS
  - M10 | Interpretation
  - What the answer means At B, the model has captured 60% of defaults but only 15%
    of non-defaults. That separation is a ranking diagnostic. Choosing a lending action
    still requires loss severity, approval value, capacity, and policy constraints.
    Why these steps matter Dividing both counts by all 100 applicants would answer
    a different question. KS compares within-class capture rates, so each class needs
    its own denominator. The biggest statistical gap does not include lending margins
    or loss severity.
