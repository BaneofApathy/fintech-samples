- page: 272
  title: KS statistic – where are good and bad score distributions farthest apart?
  text: " KS statistic – where are good and bad score distributions farthest apart?\n\
    \n\n Financial interpretation\n The Kolmogorov-Smirnov statistic summarizes the\
    \ maximum separation between the cumulative score\n distributions of risky and\
    \ non-risky cases. It is widely used in scorecard validation.\n\n Working example\n\
    \ At one score cutoff, suppose the model has captured 72% of all defaults and\
    \ 18% of non-defaults:\n\n                                                  KS\
    \ = 72% − 18% = 54%\n\n That cutoff is where the two cumulative distributions\
    \ are farthest apart.\n\n What it misses\n KS is a ranking diagnostic, not a business\
    \ threshold. It does not include approval economics, loss severity,\n calibration,\
    \ or fairness."
