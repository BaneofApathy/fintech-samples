  text: " KS\n\n   M10 | Class problem | 6 minutes — Find the Largest Separation\n\
    \n A validation sample contains 20 defaults and 80 non-defaults. Flagging everyone\
    \ at or above\n each available cutoff gives:\n                               \
    \    KS = max |Default capture rate − Non-default capture rate| .\n\n        \
    \                                                                At each cutoff,\
    \ calculate the fraction of\n   Cutoff                                     Defaults\
    \   Non-defaults\n                                               flagged     \
    \   flagged\n                                                                \
    \        defaults flagged and the fraction of\n                              \
    \                                          non-defaults flagged.\n   A       \
    \                                         5              2    Find KS across these\
    \ cutoffs. Is the\n   B                                               12     \
    \        12    cutoff with the largest gap automatically\n   C               \
    \                                18             40    the best lending threshold?\n\
    \   D                                               20             80"
