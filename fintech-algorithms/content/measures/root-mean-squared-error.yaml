- page: 377
  title: RMSE – how large are the errors when big misses matter more?
  text: " RMSE – how large are the errors when big misses matter more?\n\n\n Financial\
    \ interpretation\n Root mean squared error gives extra weight to large misses.\
    \ It remains in the original unit, making it\n interpretable to treasury or risk\
    \ teams.\n\n Working example\n Using errors [−10, 10, 20, −10] in $ millions:\n\
    \                                                    r\n                     \
    \                                   102 + 102 + 202 + 102  √\n               \
    \                           RM SE =                             = 175 = $13.2\
    \ million\n                                                                  4\n\
    \n RMSE exceeds MAE because the $20 million miss receives a larger penalty.\n\n\
    \ What it misses\n A single shock can dominate RMSE. Report MAE beside it and\
    \ show performance during holidays, crises,\n and structural breaks."
