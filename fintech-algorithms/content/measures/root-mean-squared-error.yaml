- page: 382
  title: RMSE
  text: " RMSE\n\n   M21 | Worked solution — Which Forecast Has the More Dangerous\
    \ Miss?\n\n1. Forecast A MAE: (10 + 10 + 10 + 10)/4 = 10.\n2. Forecast B MAE:\
    \ (0 + 0 + 0 + 30)/4 = 7.5.\n3. Forecast A RMSE:                             \
    \  q                                     √\n                                 \
    \                     (100 + 100 + 100 + 100)/4 =           100 = 10.\n4. Forecast\
    \ B RMSE:                                    q                           √\n \
    \                                                          (0 + 0 + 0 + 900)/4\
    \ =       225 = 15."
  paragraphs:
  - RMSE
  - M21 | Worked solution — Which Forecast Has the More Dangerous Miss?
  - '1. Forecast A MAE: (10 + 10 + 10 + 10)/4 = 10. 2. Forecast B MAE: (0 + 0 + 0
    + 30)/4 = 7.5. 3. Forecast A RMSE: q √ (100 + 100 + 100 + 100)/4 = 100 = 10. 4.
    Forecast B RMSE: q √ (0 + 0 + 0 + 900)/4 = 225 = 15.'
