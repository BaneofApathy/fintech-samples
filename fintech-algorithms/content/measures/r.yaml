slug: r
number: 23
title: R²
question: forecast
financialInterpretation: R2 compares a regression model with a simple baseline that
  predicts the sample mean for everyone. It is not a percentage-accuracy score.
workingExample: For the settlement example, the model’s squared-error sum is 700.
  Predicting the mean produces a squared-error sum of 2,675. 700 R2 = 1 − = 0.738
  2,675 The model removes about 73.8% of the squared error relative to the mean baseline
  on this sample.
whatItMisses: R2 can be negative out of sample and can look high on trending time
  series. Use time-aware baselines and report error in financial units.
