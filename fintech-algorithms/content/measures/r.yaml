- page: 402
  title: R2
  text: " R2\n\n   M23 | Interpretation\n\n What the answer means\n The model removes\
    \ 73.83% of squared error relative to the sample-mean reference. It does\n not\
    \ mean 73.83% of forecasts are correct. The test-set mean is an evaluation reference—not\
    \ a\n forecast treasury could know before those outcomes occurred.\n Why these\
    \ steps matter\n The 73.83% interpretation refers to a reduction in squared-error\
    \ total, not a share of exactly\n correct forecasts. A forecast can receive a\
    \ positive R-squared without matching any daily actual\n exactly."
  paragraphs:
  - R2
