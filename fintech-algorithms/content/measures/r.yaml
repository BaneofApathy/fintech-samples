  title: R2
  text: " R2\n\n   M23 | Worked solution — Improvement Over Predicting the Mean\n\n\
    1. Actual mean: ȳ = (100 + 120 + 80 + 150)/4 = 112.5.\n2. Model squared errors:\
    \ 100, 100, 400, 100; total SSE = 700.\n3. Mean-baseline squared errors:\n   \
    \                 (100 − 112.5)2 = 156.25,                            (120 − 112.5)2\
    \ = 56.25,\n                                           (80 − 112.5)2 = 1,056.25,\
    \   (150 − 112.5)2 = 1,406.25.\n4. Total baseline error: SST = 156.25 + 56.25\
    \ + 1,056.25 + 1,406.25 = 2,675.\n5. Score: R2 = 1 − 700/2,675 = 0.7383."
  paragraphs:
  - R2
