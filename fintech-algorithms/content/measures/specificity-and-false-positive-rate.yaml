  title: Specificity and FPR
  text: " Specificity and FPR\n\n   M06 | Class problem | 6 minutes — Count Customer\
    \ Interruptions\n\n Among 980 legitimate transactions, a fraud detector incorrectly\
    \ flags 35 and correctly passes\n 945.\n                                    TN\
    \                         FP\n                    Specificity =           ,  \
    \   FPR =                .\n                                  TN + FP        \
    \          TN + FP\n1. Calculate specificity and false-positive rate.\n2. Verify\
