- page: 264
  title: ROC-AUC and Gini – how well does the model rank risk?
  text: " ROC-AUC and Gini – how well does the model rank risk?\n\n\n Financial interpretation\n\
    \ ROC-AUC measures discrimination: whether risky cases tend to receive higher\
    \ scores than safe cases,\n independent of one chosen threshold.\n\n Working example\n\
    \ An ROC-AUC of 0.88 means that, for a randomly selected fraud and legitimate\
    \ transaction, the fraud\n receives the higher score about 88% of the time.\n\n\
    \                                                  Gini = 2 × AUC − 1 = 2(0.88)\
    \ − 1 = 0.76\n\n Gini is a rescaled form of AUC commonly seen in credit-risk reporting.\n\
    \n What it misses\n AUC does not show whether probabilities are honest, whether\
    \ the chosen threshold is profitable, or whether\n the top 200 alerts fit investigator\
    \ capacity."
  paragraphs:
  - ROC-AUC and Gini – how well does the model rank risk?
  - 'Financial interpretation ROC-AUC measures discrimination: whether risky cases
