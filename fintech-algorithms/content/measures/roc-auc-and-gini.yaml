slug: roc-auc-and-gini
number: 9
title: ROC-AUC and Gini
question: rank
financialInterpretation: 'ROC-AUC measures discrimination: whether risky cases tend
  to receive higher scores than safe cases, independent of one chosen threshold.'
workingExample: An ROC-AUC of 0.88 means that, for a randomly selected fraud and legitimate
  transaction, the fraud receives the higher score about 88% of the time. Gini = 2
  × AUC − 1 = 2(0.88) − 1 = 0.76 Gini is a rescaled form of AUC commonly seen in credit-risk
  reporting.
whatItMisses: AUC does not show whether probabilities are honest, whether the chosen
  threshold is profitable, or whether the top 200 alerts fit investigator capacity.
