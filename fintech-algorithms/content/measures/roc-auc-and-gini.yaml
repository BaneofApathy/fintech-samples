  title: ROC-AUC and Gini
  text: " ROC-AUC and Gini\n\n   M09 | Class problem | 7 minutes — Count Correct Rankings\n\
    \n Three frauds have scores 0.90, 0.70, and 0.30. Three legitimate transactions\
    \ have scores\n 0.80, 0.40, and 0.10.\n There are 3 × 3 = 9 fraud–legitimate pairs.\
    \ Give one point when the fraud has the higher score,\n zero when it has the lower\
    \ score, and half a point for a tie.\n                               Pair-ranking\
    \ points\n                      AU C =                       ,     Gini = 2AU\
    \ C − 1.\n                                 Number of pairs\n Calculate AUC and\
    \ Gini. Does the AUC value tell you what fraction of transactions will be\n classified\
    \ correctly at a 0.50 threshold?"
