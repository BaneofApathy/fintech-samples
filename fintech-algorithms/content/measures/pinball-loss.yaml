- page: 418
  title: Pinball Loss
  text: " Pinball Loss\n\n   M25 | Worked solution — Penalize a Cash Shortage More\
    \ Heavily\n\n1. Actual 150: forecast is short by 150 − 130 = 20; loss = 0.95(20)\
    \ = 19.\n2. Actual 120: forecast is high by 130 − 120 = 10; loss = 0.05(10) =\
    \ 0.5.\n3. Actual 130: no error; loss = 0.\n4. Average: (19 + 0.5 + 0)/3 = 6.5,\
    \ in weighted $ million error units.\n5. Equal-sized misses: a 10-unit shortage\
    \ costs 0.95(10) = 9.5 score units; a 10-unit excess\n   costs 0.05(10) = 0.5.\
    \ Ratio = 9.5/0.5 = 19."
  paragraphs:
  - Pinball Loss
  - M25 | Worked solution — Penalize a Cash Shortage More Heavily
