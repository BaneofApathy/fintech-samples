- page: 417
  title: Pinball Loss
  text: " Pinball Loss\n\n   M25 | Class problem | 7 minutes — Penalize a Cash Shortage\
    \ More Heavily\n\n A model forecasts the 95th percentile of daily liquidity need\
    \ at $130 million on each of three\n days. Actual needs are 150, 120, and 130.\n\
    \ For quantile τ = 0.95, use:\n                                              \
    \         (\n                                                        τ (y − q̂),\
    \        y ≥ q̂,\n                                                  L=\n     \
    \                                                    (1 − τ )(q̂ − y), y < q̂.\n\
    \ Calculate each day’s pinball loss and their average. Then compare a $10 million\
    \ underforecast\n with a $10 million overforecast. Why is one penalized more heavily?"
  paragraphs:
  - Pinball Loss
