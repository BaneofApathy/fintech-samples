- page: 412
  title: Pinball loss – is the quantile forecast wrong in the expensive direction?
  text: " Pinball loss – is the quantile forecast wrong in the expensive direction?\n\
    \n\n Financial interpretation\n Quantile or pinball loss is useful when underforecasting\
    \ and overforecasting have different costs, such as\n liquidity buffers or loss\
    \ reserves.\n\n Working example: 95th-percentile liquidity need\n The model forecasts\
    \ the 95th percentile at $130 million.\n▶ Actual = $150 million: underforecast\
    \ by 20; loss = 0.95 × 20 = 19.\n▶ Actual = $120 million: overforecast by 10;\
    \ loss = 0.05 × 10 = 0.5.\n The measure strongly penalizes the dangerous shortage\
    \ while lightly penalizing excess buffer.\n\n What it misses\n The chosen quantile\
    \ must reflect the real risk appetite and cost asymmetry. Validate coverage after\n\
    \ deployment."
