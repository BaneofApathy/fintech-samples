- page: 477
  title: Answer Quality
  text: " Answer Quality\n\n   M30 | Class problem — Three Checks, Three Denominators\
    \ (2/2)\n\n The generated answer makes five claims:\n1. “2025 revenue was $120\
    \ million.” [A]\n2. “Revenue grew 20%.” [A]\n3. “2025 net profit was $12 million.”\
    \ [C]\n4. “2025 debt was $30 million.” [C]\n5. “Debt will fall next year.” No\
    \ citation.\n Calculate faithfulness over five claims, citation correctness over\
    \ four claim–citation pairs, and\n numerical accuracy over the four financial\
    \ figures: 120, 20%, 12, and 30. Faithfulness permits\n support from any retrieved\
    \ passage; citation correctness requires the attached source to support\n that\
    \ claim."
  paragraphs:
  - Answer Quality
  - M30 | Class problem — Three Checks, Three Denominators (2/2)
  - 'The generated answer makes five claims: 1. “2025 revenue was $120 million.” [A]
    2. “Revenue grew 20%.” [A] 3. “2025 net profit was $12 million.” [C] 4. “2025
    debt was $30 million.” [C] 5. “Debt will fall next year.” No citation. Calculate
    faithfulness over five claims, citation correctness over four claim–citation pairs,
    and numerical accuracy over the four financial figures: 120, 20%, 12, and 30.
    Faithfulness permits support from any retrieved passage; citation correctness
    requires the attached source to support that claim.'
