  title: Faithfulness, citation correctness, and numerical accuracy – did the an-
    swer stay inside the evidence?
  text: " Faithfulness, citation correctness, and numerical accuracy – did the an-\n\
    \ swer stay inside the evidence?\n\n\n Financial interpretation\n These measures\
    \ test whether a financial answer is supported, whether citations actually prove\
    \ the claim, and\n whether figures were copied or calculated correctly.\n\n Working\
    \ example\n An answer contains 5 factual claims; 4 are supported by retrieved\
    \ evidence: faithfulness = 80%. It provides\n 4 citations; 3 directly support\
    \ the attached claim: citation correctness = 75%. It reports 8 figures; 7 exactly\n\
    \ match source or verified calculation: numerical accuracy = 87.5%.\n\n What it\
    \ misses\n Automated LLM judges are approximate. Use gold questions, deterministic\
    \ numeric checks, source\n inspection, and human review for material decisions."
