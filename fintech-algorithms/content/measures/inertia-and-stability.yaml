- page: 444
  title: Adjusted Rand Index
  text: " Adjusted Rand Index\n\n   M27b | Interpretation\n\n What the answer means\n\
    \ These two runs disagree substantially on who belongs together; agreement is\
    \ below the\n chance-adjusted reference for these cluster sizes. The value is\
    \ not “negative accuracy.” Cluster\n names are arbitrary: exchanging X and Y would\
    \ leave ARI unchanged. This small exercise does\n not establish stability for\
    \ the bank’s full customer population.\n Why these steps matter\n Compute pair\
    \ counts, not percentages of matching letters. A relabeling can change every\n\
    \ displayed group name without moving any customer. ARI therefore ignores names\
    \ and compares\n the underlying grouping structure."
  paragraphs:
  - Adjusted Rand Index
  - M27b | Interpretation
  - 'What the answer means These two runs disagree substantially on who belongs together;
    agreement is below the chance-adjusted reference for these cluster sizes. The
    value is not “negative accuracy.” Cluster names are arbitrary: exchanging X and
    Y would leave ARI unchanged. This small exercise does not establish stability
    for the bank’s full customer population. Why these steps matter Compute pair counts,
    not percentages of matching letters. A relabeling can change every displayed group
    name without moving any customer. ARI therefore ignores names and compares the
    underlying grouping structure.'
