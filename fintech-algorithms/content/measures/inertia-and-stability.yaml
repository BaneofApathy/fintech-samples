- page: 436
  title: Inertia
  text: " Inertia\n\n   M27a | Interpretation\n\n What the answer means\n Two groups\
    \ explain most of the variation here: lower and higher savings. A third adds little\n\
    \ compactness. Inertia uses squared feature units, not dollars of business value;\
    \ it also cannot\n establish stability or usefulness. Giving every customer a\
    \ separate cluster would produce zero\n inertia but no meaningful segmentation.\n\
    \ Why these steps matter\n The squared distances quantify compactness on the chosen\
    \ scale. Dividing a group into smaller\n groups can reduce the total even if no\
    \ useful business distinction is added, so the minimum\n inertia alone is not\
    \ a defensible stopping rule."
  paragraphs:
  - Inertia
