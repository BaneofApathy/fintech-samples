  title: Inertia and stability – does the segmentation improve and survive resampling?
  text: " Inertia and stability – does the segmentation improve and survive\n resampling?\n\
    \n Financial interpretation\n Inertia measures compactness; stability measures\
    \ whether similar clusters reappear when the data or seed\n changes.\n\n Working\
    \ example\n    Clusters k                    3           4    5\n            \
    \                                            The large improvement from 3 to 4\
    \ and smaller improvement from 4 to\n    Inertia                1,200        \
    \  800     700\n 5 suggests an elbow near 4. Across bootstrap samples, adjusted\
    \ Rand index of 0.92 indicates very similar\n assignments; 0.35 would indicate\
    \ instability.\n\n What it misses\n Inertia always falls as k increases. Do not\
    \ pick the largest k merely because the number is lower."
  paragraphs:
