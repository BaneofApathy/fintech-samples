  title: Adjusted Rand Index
  text: " Adjusted Rand Index\n\n   M27b | Formula explained (1/2)\n\n Question: Do\
    \ two clustering runs keep the same customer pairs together?\n               \
    \                           !\n                                        n     n(n\
    \ − 1)\n                                            =          .\n           \
    \                             2        2\n Read it aloud: Count the number of\
    \ distinct unordered pairs among n customers. Choosing\n customers 1 and 2 is\
    \ the same pair as choosing 2 and 1, so divide by two.\n Build an overlap table:\
    \ each cell counts customers belonging to one original cluster and one\n rerun\
    \ cluster. Its row and column totals recover the group sizes in the two runs.\n\
    \ Clusters are compared by membership, not by their arbitrary names."
