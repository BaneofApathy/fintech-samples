  title: Adjusted Rand Index
  text: " Adjusted Rand Index\n\n   M27b | Formula explained (2/2)\n\n Question: How\
    \ much membership agreement remains after adjusting for chance?\n            \
    \                                                  S − RC/T\n                \
    \                                  ARI =                    .\n              \
    \                                            (R + C)/2 − RC/T\n Read it aloud:\
    \ Subtract the chance-reference count from observed common-group pair count;\n\
    \ divide by the corresponding maximum-reference gap.\n Calculate S from overlap-cell\
    \ pair counts; R and C from row-total and column-total pair\n counts; T from all\
    \ possible customer pairs.\n The chance reference holds the two sets of cluster\
    \ sizes fixed. A negative result is below that\n reference, not a negative fraction\
    \ of correctly classified customers."
