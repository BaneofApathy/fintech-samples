- page: 262
  title: ROC
  text: " ROC\n\n   M08 | Interpretation\n\n What the answer means\n Each ROC point\
    \ represents a different capture-versus-interruption tradeoff. These are selected\n\
    \ points, not the full curve. The ROC curve itself does not choose the economically\
    \ appropriate\n threshold.\n Why these steps matter\n The curve shows possible\
    \ operating choices, not one mandatory threshold. Moving toward\n higher capture\
    \ may also interrupt more legitimate activity. In this small set, the denominators\n\
    \ stay fixed, so changes in rates come entirely from changes in the flagged cases."
  paragraphs:
  - ROC
  - M08 | Interpretation
  - What the answer means Each ROC point represents a different capture-versus-interruption
    tradeoff. These are selected points, not the full curve. The ROC curve itself
    does not choose the economically appropriate threshold. Why these steps matter
    The curve shows possible operating choices, not one mandatory threshold. Moving
    toward higher capture may also interrupt more legitimate activity. In this small
    set, the denominators stay fixed, so changes in rates come entirely from changes
    in the flagged cases.
