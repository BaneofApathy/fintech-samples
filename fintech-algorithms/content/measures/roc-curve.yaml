    \ legitimate transactions correctly passed.\n   si , i                       \
    \                  Fraud-risk score for transaction i; higher scores indicate\
    \ higher\n                                                  modeled risk.\n  \
    \ t                                              Decision threshold, not a time\
    \ index in this exercise."
