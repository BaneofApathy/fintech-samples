    \               ,      FPR =            .\n                                  \
    \             TP + FN                 FP + TN\n Read it aloud: Flag a transaction\
    \ if its score reaches the cutoff. Count the resulting true and\n false positives,\
    \ then divide each by its own actual-class total.\n A receiver operating characteristic\
    \ (ROC) curve places FPR on the horizontal axis and TPR\n on the vertical axis.\
    \ Each threshold supplies one operating point.\n The denominator remains three\
    \ frauds or three legitimate cases while the cutoff changes."
