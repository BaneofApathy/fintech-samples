  title: Log Loss
  text: " Log Loss\n\n   M16 | Worked solution — Penalize a Confident Mistake\n\n\
    1. Select the probability assigned to the actual outcome. For transaction 1, use\
    \ p; for\n   transactions 2 and 3, use 1 − p.\n2. Model A’s losses: [0.2231, 0.1054,\
    \ 4.6052].\n                        LLA = (0.2231 + 0.1054 + 4.6052)/3 ≈ 1.6446.\n\
    3. Model B’s losses: [0.2231, 0.1054, 0.9163].\n                        LLB =\
    \ (0.2231 + 0.1054 + 0.9163)/3 ≈ 0.4149.\n4. Threshold classifications: Both predict\
    \ [1, 0, 1] at 0.50. Each makes the same one\n   classification error."
