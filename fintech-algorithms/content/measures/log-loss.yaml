title: Log Loss
question: probability
financialInterpretation: Log loss rewards accurate probabilities and sharply penalizes
  confident errors. It is useful when extreme confidence creates financial or operational
  risk.
workingExample: 'For a legitimate transaction, y = 0: Loss(p = 0.60) = − ln(1 − 0.60)
  = 0.92 Loss(p = 0.99) = − ln(1 − 0.99) = 4.61 The 99% fraud prediction is punished
  about five times more because it was confidently wrong.'
whatItMisses: Log loss does not encode the bank’s actual dollar cost. Clip or regularize
  extreme probabilities and still evaluate threshold economics.
