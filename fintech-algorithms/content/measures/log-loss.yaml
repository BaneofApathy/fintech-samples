- page: 328
  title: Log loss – how severely should we punish confident mistakes?
  text: " Log loss – how severely should we punish confident mistakes?\n\n\n Financial\
    \ interpretation\n Log loss rewards accurate probabilities and sharply penalizes\
    \ confident errors. It is useful when extreme\n confidence creates financial or\
    \ operational risk.\n\n Working example\n For a legitimate transaction, y = 0:\n\
    \n                                                  Loss(p = 0.60) = − ln(1 −\
    \ 0.60) = 0.92\n\n                                                  Loss(p = 0.99)\
    \ = − ln(1 − 0.99) = 4.61\n The 99% fraud prediction is punished about five times\
    \ more because it was confidently wrong.\n\n What it misses\n Log loss does not\
    \ encode the bank’s actual dollar cost. Clip or regularize extreme probabilities\
    \ and still\n evaluate threshold economics."
