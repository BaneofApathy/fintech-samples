- page: 304
  title: Lift and cumulative gain – how much better is the ranking than random selection?
  text: " Lift and cumulative gain – how much better is the ranking than random\n\
    \ selection?\n\n Financial interpretation\n Lift measures investigator productivity\
    \ relative to random review. Cumulative gain measures how much total\n risk is\
    \ captured in the top fraction of the population.\n\n Working example\n Base fraud\
    \ prevalence is 1%. The top 100 of 10,000 transactions contain 45 frauds, so precision@100\
    \ is 45%.\n\n                                                               45%\n\
    \                                                  Lift@100 =       = 45×\n  \
    \                                                              1%\n The top 1%\
    \ of transactions captures 45 of 100 frauds, so cumulative gain at 1% is 45%.\n\
    \n What it misses\n Lift depends on prevalence and does not express dollar value.\
    \ A 45x lift can still be uneconomic if reviews\n are expensive or fraud losses\
    \ are small."
