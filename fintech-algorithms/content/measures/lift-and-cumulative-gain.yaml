- page: 308
  title: Lift and Gain
  text: " Lift and Gain\n\n   M13 | Class problem | 6 minutes — Compare With Random\
    \ Review\n\n A batch contains 1,000 transactions and 20 frauds. The top 50 model-ranked\
    \ transactions\n contain 15 frauds.\n Calculate:\n1. Fraud prevalence and precision@50.\n\
    2. Lift@50: precision@50 divided by fraud prevalence.\n3. Cumulative gain: the\
    \ share of all frauds found in the top 50.\n4. The expected number of frauds in\
    \ a randomly selected set of 50 transactions.\n What percentage of the transaction\
    \ population is reviewed? Explain what “15 times better”\n would mean here—and\
    \ what it would not mean."
  paragraphs:
  - Lift and Gain
  - M13 | Class problem | 6 minutes — Compare With Random Review
