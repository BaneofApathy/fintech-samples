- page: 310
  title: Lift and Gain
  text: " Lift and Gain\n\n   M13 | Interpretation\n\n What the answer means\n Reviewing\
    \ the top 5% captures 75% of frauds, with 15 times the fraud concentration of\n\
    \ random review. This is not a 15-fold profit increase; fraud value, review cost,\
    \ and the ability to\n prevent or recover losses remain separate questions.\n\
    \ Why these steps matter\n A random sample will not necessarily contain exactly\
    \ the expected fraud count. The lift\n comparison uses its expected concentration,\
    \ not a claim that every random sample produces\n the same result."
  paragraphs:
  - Lift and Gain
  - M13 | Interpretation
