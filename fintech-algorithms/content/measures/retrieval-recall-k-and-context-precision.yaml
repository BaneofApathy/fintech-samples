- page: 452
  title: Retrieval Recall and Context Precision
  text: " Retrieval Recall and Context Precision\n\n   M28 | Interpretation\n\n What\
    \ the answer means\n Both questions have an evidence “hit,” but Q1 is missing\
    \ half its required source material. A\n 100% question-level hit rate is not 100%\
    \ relevant-chunk recall. Two-thirds of the\n supplied context is irrelevant in\
    \ both cases. Generation still needs separate evaluation.\n Why these steps matter\n\
    \ The missing B chunk in Q1 matters even though A was retrieved. Counting Q1 as\
    \ a binary\n “hit” discards information about completeness. Mean recall across\
    \ questions also differs from\n pooling all retrieved chunks into one global numerator\
    \ and denominator."
  paragraphs:
  - Retrieval Recall and Context Precision
  - M28 | Interpretation
  - What the answer means Both questions have an evidence “hit,” but Q1 is missing
    half its required source material. A 100% question-level hit rate is not 100%
    relevant-chunk recall. Two-thirds of the supplied context is irrelevant in both
    cases. Generation still needs separate evaluation. Why these steps matter The
    missing B chunk in Q1 matters even though A was retrieved. Counting Q1 as a binary
    “hit” discards information about completeness. Mean recall across questions also
    differs from pooling all retrieved chunks into one global numerator and denominator.
