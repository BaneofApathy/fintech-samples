slug: retrieval-recall-k-and-context-precision
number: 28
title: Retrieval Recall@K and Context Precision
question: retrieve
financialInterpretation: Retrieval recall protects against missing the decisive filing
  passage. Context precision limits irrelevant chunks that can distract generation.
workingExample: For 20 analyst questions, the correct passage appears in the top 5
  for 16 questions. For one question, 2 of 5 retrieved chunks are relevant. Recall@5
  = 16/20 = 80%, Context precision@5 = 2/5 = 40% The system often finds the evidence
  but still sends substantial noise to the language model.
whatItMisses: Good retrieval does not guarantee a faithful answer. Evaluate retrieval
  and generation separately.
