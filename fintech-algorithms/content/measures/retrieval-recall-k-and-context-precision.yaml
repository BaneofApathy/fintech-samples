  title: Retrieval Recall@K and Context Precision – did RAG retrieve the right evidence?
  text: " Retrieval Recall@K and Context Precision – did RAG retrieve the right\n\
    \ evidence?\n\n\n Financial interpretation\n Retrieval recall protects against\
    \ missing the decisive filing passage. Context precision limits irrelevant chunks\
    \ that can\n distract generation.\n\n\n Working example\n For 20 analyst questions,\
    \ the correct passage appears in the top 5 for 16 questions. For one question,\
    \ 2 of 5 retrieved\n chunks are relevant.\n                           Recall@5\
    \ = 16/20 = 80%,         Context precision@5 = 2/5 = 40%\n The system often finds\
    \ the evidence but still sends substantial noise to the language model.\n\n\n\
    \ What it misses\n Good retrieval does not guarantee a faithful answer. Evaluate\
    \ retrieval and generation separately."
