  title: Retrieval Recall and Context Precision
  text: " Retrieval Recall and Context Precision\n\n   M28 | Formula explained (1/1)\n\
    \n Question: How much required evidence was found, and how much of the retrieved\
    \ context is\n useful?\n                      |Relq ∩ Retq |                 \
    \             |Relq ∩ Retq |\n         Recall@Kq =                 ,   Context\
    \ precision@Kq =                  .\n                          |Relq |       \
    \                                K\n Read it aloud: Count retrieved chunks that\
    \ are relevant. Divide by all relevant chunks for\n recall; divide by the retrieved\
    \ queue size for context precision.\n Compute each question separately, then take\
    \ an unweighted average across questions. Here\n each query retrieves exactly\
    \ three distinct chunks.\n Context precision uses simple relevant-chunk share\
    \ in this exercise, not a rank-weighted\n evaluator’s definition."
