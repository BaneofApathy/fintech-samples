  title: Multi-Class F1
  text: " Multi-Class F1\n\n   M18 | Formula explained (1/2)\n\n Question: How well\
    \ does the classifier recognize each sentiment class?\n                      \
    \                           2T Pc\n                                F 1c =    \
    \                    .\n                                          2T Pc + F Pc\
    \ + F Nc\n Read it aloud: Pick one class. Count records correctly assigned to\
    \ it, records incorrectly\n assigned to it, and records from it missed by the\
    \ classifier. Apply the binary F1 formula to those\n counts.\n In the original\
    \ confusion matrix, rows are actual labels and columns are predicted labels. A\n\
    \ diagonal cell is that class’s true-positive count. Its other column entries\
    \ are false positives; its\n other row entries are false negatives."
