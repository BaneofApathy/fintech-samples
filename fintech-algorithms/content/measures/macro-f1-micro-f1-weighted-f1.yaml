- page: 351
  title: Macro-F1, micro-F1, and weighted-F1 – are minority classes being hidden?
  text: " Macro-F1, micro-F1, and weighted-F1 – are minority classes being\n hidden?\n\
    \n Financial interpretation\n Multi-class models should not let a dominant class\
    \ hide poor performance on rare but important classes\n such as negative guidance\
    \ or high-risk complaints.\n\n Working example: financial sentiment\n Class mix:\
    \ 70 neutral, 20 positive, 10 negative. Per-class F1 scores are 0.95, 0.80, and\
    \ 0.20.\n                                                                 0.95\
    \ + 0.80 + 0.20\n                                                    Macro-F1\
    \ =                      = 0.65\n                                            \
    \                              3\n                                          Weighted-F1\
    \ = 0.70(0.95) + 0.20(0.80) + 0.10(0.20) = 0.845\n Weighted-F1 looks strong; macro-F1\
    \ exposes the weak negative class.\n\n What it misses\n Always report per-class\
    \ precision and recall. One aggregate cannot explain which financial category\
    \ fails."
