  text: " Multi-Class F1\n\n   M18 | Worked solution — Expose the Weak Class\n\n1.\
    \ Calculate per-class counts and scores.\n   Class                           \
    \               TP   FP     FN                  Actual              F1\n     \
    \                                                                            support\n\
    \   Neutral                                         8    3        2          \
    \         10          16/21 =\n                                              \
    \                                                     0.7619\n   Positive    \
    \                                    3    1        1                    4    \
    \  6/8 = 0.7500\n   Negative                                        0    1   \
    \     2                    2          0/3 = 0\n\n2. Macro-F1: (0.7619 + 0.7500\
    \ + 0)/3 = 0.5040.\n3. Weighted-F1: [10(0.7619) + 4(0.75) + 2(0)]/16 = 0.6637.\n\
    4. Micro totals: T P = 11, F P = 5, F N = 5.\n                             F 1micro\
    \ = 22/(22 + 5 + 5) = 0.6875."
