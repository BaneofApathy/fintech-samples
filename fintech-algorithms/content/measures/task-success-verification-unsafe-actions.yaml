- page: 550
  title: Task success, verification pass rate, and unsafe-action rate – does an agent
    finish correctly and safely?
  text: " Task success, verification pass rate, and unsafe-action rate – does an\n\
    \ agent finish correctly and safely?\n\n Financial interpretation\n Agent evaluation\
    \ must measure end-to-end completion, deterministic checks, tool-use errors, cost,\
    \ latency,\n and attempted unsafe actions.\n\n Working example: 500 invoice-processing\
    \ tasks\n▶ 460 complete and pass deterministic verification: task success = 92%.\n\
    ▶ 475 pass all required field checks: verification pass rate = 95%.\n▶ 5 attempt\
    \ an action outside authority but are blocked: unsafe-attempt rate = 1%.\n▶ Average\
    \ cost = $0.42 per task; p95 latency = 11 seconds.\n\n What it misses\n A blocked\
    \ unsafe action is still a serious signal. Review traces, failure categories,\
    \ iteration counts, and tail\n cost."
  paragraphs:
  - Task success, verification pass rate, and unsafe-action rate – does an agent finish
    correctly and safely?
