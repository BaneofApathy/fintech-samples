    10 return an error. Define success as correct completion plus all required checks.
    Calculate task success, field-verification pass rate, task-level unsafe-attempt
    rate, task-level unsafe-execution rate, and tool-call error rate. Does blocking
    all unsafe attempts make those attempts irrelevant?'
