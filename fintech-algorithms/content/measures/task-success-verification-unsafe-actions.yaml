- page: 556
  title: Agent Measures
  text: " Agent Measures\n\n   M37 | Worked solution — Completed, Checked, and Within\
    \ Authority?\n\n1. Task success: 90/100 = 90%.\n2. Field-verification pass rate:\
    \ 95/100 = 95%.\n3. Tasks with unsafe attempts: 4/100 = 4%.\n4. Tasks with executed\
    \ unauthorized actions: 0/100 = 0%.\n5. Tool-call error rate: 10/200 = 5%."
  paragraphs:
  - Agent Measures
  - M37 | Worked solution — Completed, Checked, and Within Authority?
  - '1. Task success: 90/100 = 90%. 2. Field-verification pass rate: 95/100 = 95%.
    3. Tasks with unsafe attempts: 4/100 = 4%. 4. Tasks with executed unauthorized
    actions: 0/100 = 0%. 5. Tool-call error rate: 10/200 = 5%.'
