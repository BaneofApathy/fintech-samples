  economics:
  - page: 665
    title: The real risk is input sensitivity
    text: " The real risk is input sensitivity\n\n\n\n▶ Expected returns are estimated\
      \ with large error.\n▶ Correlations change during stress, often when diversification\
      \ is needed most.\n▶ Small input changes can create large allocation changes.\n\
      ▶ Unconstrained solutions may concentrate in assets with optimistic estimates.\n\
      \n Required sensitivity test\n Perturb each expected return by ±1% and each\
      \ correlation by ±0.10. Report whether the\n recommended portfolio remains recognizable.\n\
      \ Required artifact: Equal-weight comparison, sensitivity analysis, turnover\
      \ estimate, and\n documented constraints."
    paragraphs:
    - The real risk is input sensitivity
    - ▶ Expected returns are estimated with large error. ▶ Correlations change during
      stress, often when diversification is needed most. ▶ Small input changes can
      create large allocation changes. ▶ Unconstrained solutions may concentrate in
      assets with optimistic estimates.
    - 'Required sensitivity test Perturb each expected return by ±1% and each correlation
