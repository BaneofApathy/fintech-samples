definition: Constrained optimization selects decision variables to maximize or minimize
  an explicit objective while satisfying equality, inequality, capacity, policy, and
  regulatory constraints. It is decision mathematics, not inherently machine learning.
intuition: Prediction estimates what may happen. Optimization chooses what to do,
  subject to what is allowed.   Anchor idea minw f (w) subject to gi (w) ≤ 0 and hj
  (w) = 0.
useWhen:
- The action variables and objective are explicit.
- Constraints are known and auditable.
- Choosing among feasible actions is the real problem.
- Sensitivity and scenario analysis can be performed.
- The organization can separate hard policy constraints from preferences.
avoidWhen:
- The question is prediction rather than allocation.
- Key constraints are political, ethical, or operational but remain unstated.
- Input estimates are too unstable for a point optimum.
- The objective rewards the wrong proxy.
- A simple rule already achieves the business need with less model risk.
