    title: 'Method: mean-variance optimization'
    text: " Method: mean-variance optimization\n\n\n Let w be portfolio weights, µ\
      \ expected returns, and Σ the covariance matrix.\n\n                       \
      \                                              min    w⊤ Σw\n              \
      \                                                        w\n\n subject to:\n\
      \                                                       1⊤ w = 1,   µ⊤ w ≥ rtarget\
      \ ,   0 ≤ wi ≤ ui\n\n\n\n Objective                                        \
      \                           Practical constraints\n Minimize estimated variance\
      \ for a required         No shorting, position limits, turnover limits,\n return.\
      \                                            sector caps, liquidity limits,\
      \ and transaction\n                                                    costs.\n\
      \ Baseline: Equal-weight portfolio or an existing policy allocation."
