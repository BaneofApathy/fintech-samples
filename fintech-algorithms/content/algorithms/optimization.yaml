    text: " Working example: constrained minimum variance\n\n\n\n  import numpy as\
      \ np\n  from scipy.optimize import minimize                                \
      \          Modify\n  mu = np.array([.06, .08, .10, .04])\n  Sigma = np.array([\
      \                                                          ▶ Raise target return.\n\
      \   [.040,.012,.018,.006], [.012,.055,.020,.008],\n   [.018,.020,.090,.010],\
      \ [.006,.008,.010,.025]])                             ▶ Add a 20% asset cap.\n\
      \  def variance(w): return w @ Sigma @ w\n  constraints = [                \
