  - page: 659
    title: Evaluate the retriever and generator separately
    text: " Evaluate the retriever and generator separately\n\n   Layer          \
      \                              Question                                  Measures\n\
      \   Parsing                                      Did we preserve usable content?\
      \           Table integrity, section coverage, ex-\n                       \
      \                                                                   traction\
      \ errors\n   Retrieval                                    Did the evidence enter\
      \ the context?       Recall@k, MRR, context precision, hu-\n               \
      \                                                                          \
      \ man relevance\n   Generation                                   Did the answer\
      \ stay faithful to evi-      Faithfulness, citation correctness, nu-\n     \
      \                                           dence?                         \
      \           merical accuracy\n   End-to-end                                \
      \   Did the system answer the business        Exactness, completeness, abstention\n\
      \                                                question?                 \
      \                behavior, latency, cost\n\n\n Critical failure test\n Remove\
      \ the passage containing the answer. The correct behavior is to state that the\
      \ provided evidence is\n insufficient, not to improvise.\n\n Required artifact:\
      \ Evaluation table plus one documented retrieval failure and one generation\
      \ failure."
