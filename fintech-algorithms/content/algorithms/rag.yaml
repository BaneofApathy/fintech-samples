definition: Embeddings convert text into vectors that preserve semantic similarity.
  Retrieval-augmented generation retrieves relevant passages and gives them to a language
  model so the answer can be grounded in evidence.
intuition: Search first, answer second. Retrieval determines what evidence is visible;
  generation should synthesize only what that evidence supports.  Anchor idea
useWhen:
- The knowledge lives in changing or private documents.
- Users need provenance and inspectable evidence.
- Questions are semantic rather than exact key lookups.
- The corpus can be curated, permissioned, and evaluated.
- The system can abstain when retrieval is weak.
avoidWhen:
- An exact SQL query or deterministic API is the right tool.
- The corpus is incomplete, untrusted, or badly permissioned.
- The task requires reliable arithmetic across many rows.
- The answer will directly execute a payment or approval.
- No gold questions or retrieval evaluation can be created.
