  economics:
  - page: 656
    title: RAG is a system, not one algorithm
    text: " RAG is a system, not one algorithm\n\n\n\n\n      Filings / policies \
      \          Parse and chunk    Embed chunks     Vector index\n\n\n\n\n      \
      \                               User question   Embed query     Retrieve + rerank\
      \       Generate from context   Answer + citations\n\n\n\n▶ Embeddings place\
      \ semantically related text near each other.\n▶ Retrieval chooses evidence;\
      \ the generator turns evidence into an answer.\n▶ Retrieval and generation must\
      \ be evaluated separately."
    paragraphs:
    - RAG is a system, not one algorithm
    - Filings / policies Parse and chunk Embed chunks Vector index
    - User question Embed query Retrieve + rerank Generate from context Answer + citations
    - ▶ Embeddings place semantically related text near each other. ▶ Retrieval chooses
      evidence; the generator turns evidence into an answer. ▶ Retrieval and generation
      must be evaluated separately.
    source:
      pages:
      - 656
      verbatim: true
  - page: 657
    title: 'Similarity and chunking: the two design levers'
    text: " Similarity and chunking: the two design levers\n\n Cosine similarity compares\
      \ directions in embedding space:\n                                         \
      \                   q·d\n                                                cos(θ)\
      \ =\n                                                           ∥q∥∥d∥\n\n\n\
      \ Chunk too small                                           Chunk too large\n\
      \ The relevant sentence is retrieved without                The retriever returns\
      \ noisy context, consumes\n definitions, table headers, or surrounding     \
      \           tokens, and buries the answer.\n conditions.\n\n Financial-document\
      \ rule\n Preserve section boundaries and table semantics. Never split a row\
      \ from its header or separate a\n footnote from the number it qualifies.\n Baseline:\
      \ Keyword search plus manual reading."
    paragraphs:
    - 'Similarity and chunking: the two design levers'
    - 'Cosine similarity compares directions in embedding space: q·d cos(θ) = ∥q∥∥d∥'
    - Chunk too small Chunk too large The relevant sentence is retrieved without The
