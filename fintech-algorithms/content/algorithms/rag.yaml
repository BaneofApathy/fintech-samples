  title: 'Primer 9A: Embeddings and RAG – definition and intuition'
  text: " Primer 9A: Embeddings and RAG – definition and intuition\n\n\n   Financial\
    \ problem: How can an analyst or compliance professional ask natural-language\
    \ questions and receive\n   answers grounded in the institution’s own current\
    \ documents?\n\n\n\n Definition                                              \
    \                                               Plain-English intuition\n Embeddings\
    \ convert text into vectors that preserve semantic                           \
    \                 Search first, answer second. Retrieval determines\n similarity.\
    \ Retrieval-augmented generation retrieves relevant                          \
    \                what evidence is visible; generation should synthesize\n passages\
    \ and gives them to a language model so the answer                           \
    \                   only what that evidence supports.\n can be grounded in evidence.\n\
    \                                                                            \
    \                            Anchor idea\n Input → output                    \
    \                                                                           Query\
    \ → embedding → top-k retrieval →\n Input: A curated corpus, chunking strategy,\
    \ embedding model, query,                                                rerank\
    \ → grounded answer.\n retrieval and reranking configuration, and an answer-generation\
    \ policy.\n Output: Ranked evidence plus a cited answer, or an explicit refusal\n\
    \ when adequate evidence is not retrieved.\n What it learns: Semantic proximity\
    \ and language synthesis. It does not guarantee that the right passage was indexed,\
    \ retrieved, or interpreted correctly."
