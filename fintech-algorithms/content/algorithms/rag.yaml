    title: 'Working example: semantic retrieval'
    text: " Working example: semantic retrieval\n\n\n\n\n  # Colab: pip install -q\
      \ sentence-transformers\n  from sentence_transformers import SentenceTransformer\n\
      \  from sklearn.metrics.pairwise import cosine_similarity\n                \
      \                                                                          \
      \    Then generate\n  chunks = [                                           \
      \                                       Pass only retrieved passages\n   \"\
      No customer accounted for more than 10 percent of revenue.\",\n   \"Interest\
      \ expense increased because average debt was higher.\",                    \
      \         to the approved model with\n   \"A small number of distributors represent\
      \ a material share of sales.\",\n   \"The company maintains a revolving credit\
      \ facility.\"                                       instructions to:\n  ]\n\
      \  question = \"What customer concentration risk does the company disclose?\"\
      \                   ▶ cite each claim,\n  encoder = SentenceTransformer(\"all-MiniLM-L6-v2\"\
      )\n  D = encoder.encode(chunks, normalize_embeddings=True)                 \
      \                     ▶ preserve figures,\n  q = encoder.encode([question],\
      \ normalize_embeddings=True)\n  scores = cosine_similarity(q, D)[0]\n  for i\
      \ in scores.argsort()[::-1][:2]:\n                                         \
