    title: 'Financial problem: answer a 10-K question with evidence'
    text: " Financial problem: answer a 10-K question with evidence\n\n\n\n    Financial\
      \ problem\n    An analyst asks, “What does the issuer say about customer concentration\
      \ risk?” The answer\n    must come from the correct filing, quote no invented\
      \ figures, and cite the supporting passage.\n\n\n Why a plain LLM is insufficient\n\
      \ The model may not know the filing, may use stale information, and may produce\
      \ a fluent answer\n without the right evidence.\n\n   Decision to make: Retrieve\
      \ the relevant passages first, then generate only from that context\n   and\
      \ attach citations."
