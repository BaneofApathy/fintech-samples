  code:
  - page: 605
    title: 'Working example: probability of default'
    text: " Working example: probability of default\n\n\n\n  from sklearn.datasets\
      \ import make_classification\n  from sklearn.model_selection import train_test_split\n\
      \  from sklearn.pipeline import make_pipeline\n                            \
      \                                              Modify in class\n  from sklearn.preprocessing\
      \ import StandardScaler\n  from sklearn.linear_model import LogisticRegression\
      \                     ▶ Change class imbalance.\n  from sklearn.metrics import\
      \ roc_auc_score, brier_score_loss\n\n  X, y = make_classification(n_samples=5000,\
      \ n_features=8,\n                                                          \
      \                ▶ Change regularization C.\n      weights=[0.90, 0.10], class_sep=1.1,\
      \ random_state=7)\n  Xtr, Xte, ytr, yte = train_test_split(                \
      \                  ▶ Add a noisy feature.\n      X, y, test_size=.30, stratify=y,\
      \ random_state=7)\n\n  model = make_pipeline(StandardScaler(),\n           \
      \                                                               ▶ Compare unscaled\
      \ data.\n      LogisticRegression(C=1.0, max_iter=2000))\n  model.fit(Xtr, ytr)\n\
      \  pd_hat = model.predict_proba(Xte)[:, 1]                                 Primary\
      \ metric: ROC-AUC\n  print(\"ROC-AUC:\", roc_auc_score(yte, pd_hat))       \
      \                    plus calibration. Required\n  print(\"Brier:\", brier_score_loss(yte,\
      \ pd_hat))\n  print(\"First five PDs:\", pd_hat[:5].round(3))              \
      \             artifact: Coefficient table and\n                            \
      \                                              calibration plot."
