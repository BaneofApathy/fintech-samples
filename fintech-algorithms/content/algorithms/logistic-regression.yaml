      \ − 0.03(income in $000s)\n For an applicant with DTI = 35, one prior delinquency,\
      \ and income = 60:\n                                                 z = −3.0\
      \ + 0.04(35) + 1.2 − 0.03(60) = −2.2\n                                     \
      \                                       1\n                                \
      \                        P (def ault) =            ≈ 0.10\n                \
      \                                                         1 + e2.2\n\n Interpretation\n\
      \ The model estimates about a 10% default probability under the training distribution.\
      \ It does not\n determine approval by itself.\n\n   Student defense question:\
