definition: A supervised linear classifier that converts a weighted sum of features
  into a probability through the logistic, or sigmoid, function. Its coefficients
  show whether a feature raises or lowers the log-odds of the outcome.
intuition: Each feature adds or subtracts evidence. The sigmoid compresses the combined
  evidence into a probability. The model estimates risk; a separate policy chooses
  the action threshold.
useWhen:
- The target is binary and the data are mostly tabular.
- Interpretability and stable reason codes matter.
- You need a strong, fast baseline before adding complexity.
- The relationship is approximately linear after sensible transformations.
- You need low-latency scoring and inexpensive retraining.
avoidWhen:
- High-order nonlinear interactions dominate performance.
- The main signal is raw text, images, graphs, or long sequences.
- 'The question is causal: What will this intervention change?'
- The outcome is time-to-event rather than a fixed-window label.
- The population or product definition changes too quickly for stable coefficients.
