    title: 'Financial problem: how much reserve is enough?'
    text: " Financial problem: how much reserve is enough?\n\n\n\n    Financial problem\n\
      \    A lender holds a portfolio of 1,000 loans. It knows average default probability\
      \ and loss given\n    default, but management needs the full loss distribution–especially\
      \ the tail.\n\n\n A point estimate is not enough\n Expected loss supports pricing\
      \ and provisioning. Capital and contingency planning require plausible\n severe\
      \ outcomes and their probability.\n\n   Decision to make: Simulate many coherent\
      \ scenarios, then inspect the distribution of losses\n   rather than one “most\
      \ likely” number."
