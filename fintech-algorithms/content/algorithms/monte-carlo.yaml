  - page: 679
    title: How to validate a simulation
    text: " How to validate a simulation\n\n\n1. Verify the code on a case with a\
      \ known analytical answer.\n2. Check convergence: do key quantiles stabilize\
      \ as runs increase?\n3. Stress assumptions one at a time and together.\n4. Backtest\
      \ distributions where enough history exists.\n5. Separate parameter uncertainty\
      \ from random scenario variation.\n6. Report assumptions beside every result.\n\
      \n False precision\n “The 99th percentile loss is $327,418” is misleading if\
      \ PD, LGD, and correlation are rough\n estimates. Report sensible ranges and\
      \ sensitivity.\n Required artifact: Assumption register, convergence plot, sensitivity\
      \ table, and tail-loss summary."
    paragraphs:
    - How to validate a simulation
    - '1. Verify the code on a case with a known analytical answer. 2. Check convergence:
      do key quantiles stabilize as runs increase? 3. Stress assumptions one at a
      time and together. 4. Backtest distributions where enough history exists. 5.
      Separate parameter uncertainty from random scenario variation. 6. Report assumptions
