definition: Monte Carlo simulation repeatedly samples uncertain inputs and runs a
  financial model to approximate the distribution of outcomes. It is a numerical uncertainty
  method, not inherently an AI or ML algorithm.
intuition: Instead of one best guess, run many plausible worlds. The result is only
  as credible as the assumptions that generate those worlds.  Anchor idea
useWhen:
- Multiple uncertain inputs propagate through a known model.
- Tail risk or probability of breach matters.
- Path dependence makes a single closed form inadequate.
- Scenario and sensitivity analysis are decision-relevant.
- Assumptions can be documented and challenged.
avoidWhen:
- The underlying model is not credible.
- Input distributions are invented without evidence.
- A simple closed-form result answers the question.
- Rare tail behavior is under-sampled or structurally missing.
- Simulation is used to hide rather than expose assumptions.
