  code:
  - page: 678
    title: 'Working example: correlated loan losses'
    text: " Working example: correlated loan losses\n\n\n\n  import numpy as np\n\
      \  from scipy.stats import norm\n  rng = np.random.default_rng(17)\n       \
      \                                                                          \
      \    Modify\n  n_sims, n_loans = 5000, 1000                                \
      \                       ▶ Set ρ = 0.\n  pd = np.full(n_loans, .025)\n  ead =\
      \ np.full(n_loans, 10000.0)\n  lgd = np.full(n_loans, .45)\n               \
      \                                                                      ▶ Double\
      \ PD.\n  rho = .12\n                                                       \
      \                              ▶ Make LGD random.\n  common = rng.normal(size=(n_sims,\
      \ 1))\n  idiosyncratic = rng.normal(size=(n_sims, n_loans))\n  latent = np.sqrt(rho)*common\
      \ + np.sqrt(1-rho)*idiosyncratic\n                                         \
      \                                            ▶ Add sector factors.\n  defaults\
      \ = latent < norm.ppf(pd)\n  loss = (defaults * ead * lgd).sum(axis=1)     \
      \                                     Primary metric: Tail\n  print(\"Expected\
      \ loss:\", loss.mean())\n  print(\"95th percentile:\", np.quantile(loss, .95))\n\
      \                                                                          \
      \           quantiles and probability\n  print(\"99th percentile:\", np.quantile(loss,\
      \ .99))\n  print(\"P(loss > $200k):\", (loss > 200000).mean())\n           \
      \                                                                          of\
      \ breaching a reserve."
