definition: A decision tree recursively splits the feature space into if/then regions.
  A random forest averages many trees trained on resampled rows and randomized feature
  subsets to reduce the instability of one tree.
intuition: A tree asks a sequence of questions. A forest asks many different trees
  and combines their votes, trading compact rules for greater robustness.  Anchor
  idea
