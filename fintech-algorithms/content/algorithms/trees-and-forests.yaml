  code:
  - page: 611
    title: 'Working example: tree versus random forest'
    text: " Working example: tree versus random forest\n\n\n\n  from sklearn.datasets\
      \ import make_classification\n  from sklearn.model_selection import train_test_split\n\
      \  from sklearn.tree import DecisionTreeClassifier\n                       \
      \                                                         Change one thing\n\
      \  from sklearn.ensemble import RandomForestClassifier\n  from sklearn.metrics\
      \ import average_precision_score                          ▶ Tree depth\n  X,\
      \ y = make_classification(n_samples=8000, n_features=12,\n      n_informative=7,\
      \ weights=[.97, .03], random_state=11)\n                                   \
      \                                            ▶ Number of trees\n  Xtr, Xte,\
      \ ytr, yte = train_test_split(\n      X, y, stratify=y, test_size=.30, random_state=11)\
      \                        ▶ Minimum leaf size\n  models = {\n    \"tree\": DecisionTreeClassifier(max_depth=5,\
      \ random_state=11),\n                                                      \
      \                         ▶ Class weights\n    \"forest\": RandomForestClassifier(n_estimators=300,\n\
      \        max_depth=10, class_weight=\"balanced\", n_jobs=-1,\n        random_state=11)\
      \                                                        Primary metric: PR-AUC\
      \ and\n  }\n  for name, model in models.items():                           \
      \                 precision@review-capacity.\n      model.fit(Xtr, ytr)\n  \
      \    p = model.predict_proba(Xte)[:, 1]\n      print(name, average_precision_score(yte,\
      \ p))"
