  economics:
  - page: 612
    title: How to evaluate tree models honestly
    text: " How to evaluate tree models honestly\n\n\n1. Compare against the rule\
      \ baseline and logistic regression.\n2. Tune depth and minimum leaf size on\
      \ validation data.\n3. Measure performance at the actual review capacity: precision@500,\
      \ not only global AUC.\n4. Check probability calibration; tree ensembles can\
      \ rank well while overstating confidence.\n5. Test slices: new customers, high-value\
      \ transactions, device changes, and rare merchants.\n\n Feature importance is\
      \ not causality\n Impurity-based importance can favor continuous or high-cardinality\
      \ features. Use permutation tests,\n stability checks, and domain review before\
      \ drawing conclusions.\n\n\n   Student defense question: A device identifier\
      \ dominates feature importance. Is that useful\n   signal, leakage, or a fragile\
      \ proxy? What evidence would distinguish the three?"
    paragraphs:
    - How to evaluate tree models honestly
    - '1. Compare against the rule baseline and logistic regression. 2. Tune depth
      and minimum leaf size on validation data. 3. Measure performance at the actual
      review capacity: precision@500, not only global AUC. 4. Check probability calibration;
      tree ensembles can rank well while overstating confidence. 5. Test slices: new
      customers, high-value transactions, device changes, and rare merchants.'
    - Feature importance is not causality Impurity-based importance can favor continuous
      or high-cardinality features. Use permutation tests, stability checks, and domain
      review before drawing conclusions.
    - 'Student defense question: A device identifier dominates feature importance.
      Is that useful signal, leakage, or a fragile proxy? What evidence would distinguish
