definition: Gradient boosting builds a sequence of usually shallow trees. Each new
  tree is trained to reduce the errors left by the current ensemble, producing a weighted
  sum of corrective models.
intuition: The first tree makes a rough estimate. Later trees focus on the cases the
  current model handles poorly. Small corrections accumulate into a strong predictor.  Anchor
  idea
useWhen:
- Tabular data contain nonlinearities and interactions.
- Predictive lift over a linear baseline has business value.
- You can support disciplined validation and explanation.
- Missing values and mixed feature behavior are common.
- Inference must remain fast enough for operational decisions.
avoidWhen:
- The sample is too small for reliable tuning.
- Policy demands a simple monotonic scorecard and no challenger process exists.
- The main input is raw language, images, or graph structure.
- The task requires extrapolation far outside observed data.
- The team cannot monitor calibration, drift, and reason-code stability.
