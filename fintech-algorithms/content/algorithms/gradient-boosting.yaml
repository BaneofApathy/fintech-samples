  method:
  - page: 616
    title: 'Method: many weak trees correct one another'
    text: " Method: many weak trees correct one another\n\n\n\n\n                \
      \                                        Tree 1            Tree 2          \
      \   Tree 3          Weighted sum\n             Initial prediction\n        \
      \                                            fits residuals    corrects errors\
      \    corrects again       final score\n\n\n\n                              \
      \                                Fm (x) = Fm−1 (x) + η hm (x)\n\n▶ Each new\
      \ tree focuses on remaining errors.\n▶ Learning rate η controls how much each\
      \ tree contributes.\n▶ Shallow trees capture interactions without creating one\
      \ enormous tree.\n Baseline: Logistic regression on the same pre-decision features."
