    title: 'Financial problem: can we improve default prediction without losing control?'
    text: " Financial problem: can we improve default prediction without losing\n\
      \ control?\n\n    Financial problem\n    A lender has hundreds of structured\
      \ variables and suspects that combinations of utilization,\n    recent inquiries,\
      \ income volatility, and loan purpose contain nonlinear risk signals.\n\n Business\
      \ question\n Can a more expressive model reduce credit loss enough to justify\
      \ additional tuning, explanation,\n calibration, and monitoring work?\n\n  \
      \ Decision to make: Compare gradient boosting against logistic regression using\
      \ the same split,\n   features, cost function, and governance requirements.\n\
      \n   Student defense question: What minimum improvement would justify the added\
      \ complexity in\n   your institution?"
