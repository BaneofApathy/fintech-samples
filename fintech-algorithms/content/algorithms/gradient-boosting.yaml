    title: 'Working example: gradient boosting versus logistic regression'
    text: " Working example: gradient boosting versus logistic regression\n\n\n  from\
      \ sklearn.datasets import make_classification\n  from sklearn.model_selection\
      \ import train_test_split\n  from sklearn.ensemble import HistGradientBoostingClassifier\n\
      \                                                                          \
      \             Ask students\n  from sklearn.linear_model import LogisticRegression\n\
      \  from sklearn.pipeline import make_pipeline                              \
      \            ▶ Which model ranks\n  from sklearn.preprocessing import StandardScaler\n\
      \  from sklearn.metrics import roc_auc_score, brier_score_loss             \
      \              better?\n  X, y = make_classification(n_samples=12000, n_features=20,\n\
      \      n_informative=10, weights=[.92, .08], flip_y=.01,\n                 \
      \                                                                     ▶ Which\
      \ calibrates better?\n      random_state=21)\n  Xtr, Xte, ytr, yte = train_test_split(\
      \                                              ▶ What changes after\n      X,\
      \ y, test_size=.30, stratify=y, random_state=21)\n                         \
      \                                                               probability\
      \ calibration?\n  models = {\n   \"logit\": make_pipeline(StandardScaler(),\n\
      \             LogisticRegression(max_iter=2000)),\n                        \
      \                                                              ▶ Is the gain\
      \ operationally\n   \"boost\": HistGradientBoostingClassifier(max_iter=250,\n\
      \             learning_rate=.05, max_leaf_nodes=15, random_state=21)\n     \
      \                                                                          \
      \         meaningful?\n  }\n  for name, m in models.items():\n      m.fit(Xtr,\
      \ ytr); p = m.predict_proba(Xte)[:, 1]\n      print(name, \"AUC\", roc_auc_score(yte,p),\n\
      \             \"Brier\", brier_score_loss(yte,p))"
