  code:
  - page: 630
    title: 'Working example: rank suspicious transactions'
    text: " Working example: rank suspicious transactions\n\n\n\n  import numpy as\
      \ np\n  from sklearn.ensemble import IsolationForest                       \
      \                          In class\n  rng = np.random.default_rng(12)\n  normal\
      \ = np.c_[                                                                 \
      \            ▶ Change contamination.\n      rng.lognormal(3.2, .5, 2000),  \
      \         # amount\n      rng.normal(14, 3, 2000),\n      rng.poisson(2, 2000),\n\
      \                                              # hour\n                    \
      \                          # tx count in hour\n                            \
      \                                                                  ▶ Remove\
      \ scaling-sensitive\n      rng.normal(0, 1, 2000)]                  # distance\
      \ from usual location                   fields.\n  anomaly = np.array([\n  \
      \    [4500, 3, 18, 8], [2800, 2, 22, 11], [15, 4, 35, 9],                  \
      \                  ▶ Add customer-relative\n      [9000, 13, 1, 0], [3200, 23,\
      \ 16, 7]])\n  X = np.vstack([normal, anomaly])                             \
      \                                 features.\n  iso = IsolationForest(n_estimators=300,\
      \ contamination=.01,\n                        random_state=12)\n           \
      \                                                                          \
      \         ▶ Inspect top 10 cases.\n  iso.fit(X)\n  score = -iso.score_samples(X)\
      \   # larger = more anomalous\n  print(np.argsort(score)[-10:][::-1])\n    \
      \                                                                          \
      \                 Primary metric: Analyst\n                                \
      \                                                               yield in the\
      \ top k alerts."
