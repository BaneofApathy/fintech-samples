  economics:
  - page: 631
    title: Evaluation without pretending labels do not matter
    text: " Evaluation without pretending labels do not matter\n\n\n\n1. Use later-confirmed\
      \ outcomes or analyst adjudication to estimate precision@k.\n2. Track how many\
      \ novel cases were found beyond existing rules.\n3. Measure review burden: alerts\
      \ per analyst, time per case, and repeat false positives.\n4. Evaluate by customer\
      \ and merchant slices, not only overall.\n5. Backtest chronologically; anomaly\
      \ definitions drift as products and behavior change.\n\n Common failure\n The\
      \ model rediscovers “large transaction” and floods analysts with wealthy customers,\
      \ travel,\n payroll events, or seasonal activity.\n Required artifact: Top-alert\
      \ review table with reason codes and analyst disposition."
    paragraphs:
    - Evaluation without pretending labels do not matter
