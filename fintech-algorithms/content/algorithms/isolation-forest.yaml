definition: Isolation Forest is an unsupervised anomaly detector. It repeatedly makes
  random feature splits; observations isolated in unusually short paths receive higher
  anomaly scores.
intuition: Common observations need many random cuts before they stand alone. Unusual
  observations are easier to isolate.
useWhen:
- Rare-event labels are missing, delayed, or incomplete.
- The objective is screening or prioritization.
- Normal behavior can be represented with meaningful features.
- Investigator capacity creates a natural top-k evaluation.
- You need a fast challenger for emerging patterns.
avoidWhen:
- A well-labeled supervised dataset already captures the target.
- Every unusual event will be treated as wrongdoing.
- Normal behavior changes faster than the retraining cycle.
- Relationships among accounts are more informative than row-level features.
- A calibrated event probability is required.
deepDive:
  problem:
  - page: 628
    title: 'Financial problem: how do we find a fraud pattern we have never labeled?'
    text: " Financial problem: how do we find a fraud pattern we have never\n labeled?\n\
      \n\n    Financial problem\n    A payments platform launches in a new market.\
      \ Confirmed fraud labels are sparse, but analysts\n    need a ranked list of\
      \ transactions that look unusual relative to normal behavior.\n\n\n The key\
      \ distinction\n Supervised fraud models learn known patterns from labeled outcomes.\
      \ Anomaly detection searches\n for observations that are rare or structurally\
      \ different.\n\n   Decision to make: Rank unusual activity for investigation\
      \ without pretending that unusual\n   means fraudulent.\n\n   Student defense\
      \ question: Name three legitimate transactions that could look anomalous."
    paragraphs:
    - 'Financial problem: how do we find a fraud pattern we have never labeled?'
