  method:
  - page: 629
    title: 'Method: anomalies are easier to isolate'
    text: " Method: anomalies are easier to isolate\n\n\n\n Isolation Forest repeatedly:\n\
      1. Selects a feature at random.\n                                          \
      \                                      isolated quickly\n2. Selects a split\
      \ value at random.\n3. Measures how many splits are needed to isolate a\n  \
      \ point.\n Points with short average path lengths receive higher\n anomaly scores.\n\
      \n Baseline: Simple amount and velocity rules."
