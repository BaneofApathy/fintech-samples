  economics:
  - page: 650
    title: Classification is not generation
    text: " Classification is not generation\n\n\n\n\n Classifier                \
      \                           Generative model\n▶ Fixed label set            \
      \                         ▶ Open-ended output\n▶ Compact output            \
      \                          ▶ Can synthesize and explain\n▶ Straightforward confusion\
      \ matrix                    ▶ Requires factuality and completeness checks\n\
      ▶ Easier thresholding and monitoring                  ▶ More ways to fail silently\n\
      \n   Decision to make: Choose the narrowest task that solves the financial problem.\
      \ Do not use\n   generation when a tested classifier is enough."
    paragraphs:
    - Classification is not generation
    - Classifier Generative model ▶ Fixed label set ▶ Open-ended output ▶ Compact
      output ▶ Can synthesize and explain ▶ Straightforward confusion matrix ▶ Requires
      factuality and completeness checks ▶ Easier thresholding and monitoring ▶ More
      ways to fail silently
    - 'Decision to make: Choose the narrowest task that solves the financial problem.
      Do not use generation when a tested classifier is enough.'
    source:
      pages:
      - 650
      verbatim: true
  - page: 652
    title: How to evaluate a financial language classifier
    text: " How to evaluate a financial language classifier\n\n\n\n1. Use an in-domain\
      \ labeled test set, not generic movie reviews or social media.\n2. Report per-class\
      \ precision and recall; neutral often dominates.\n3. Review disagreement cases\
      \ where experts themselves differ.\n4. Test slices: sectors, document types,\
      \ sentence length, negation, and dates.\n5. Monitor label distribution and confidence\
      \ drift after deployment.\n\n A high confidence score is not a guarantee\n Neural\
      \ classifiers can be confidently wrong under domain shift. Calibrate or threshold\
      \ confidence\n only after testing on representative data.\n Required artifact:\
      \ Confusion matrix, challenge set, and documented abstention threshold."
    paragraphs:
    - How to evaluate a financial language classifier
    - '1. Use an in-domain labeled test set, not generic movie reviews or social media.
      2. Report per-class precision and recall; neutral often dominates. 3. Review
      disagreement cases where experts themselves differ. 4. Test slices: sectors,
      document types, sentence length, negation, and dates. 5. Monitor label distribution
      and confidence drift after deployment.'
    - 'A high confidence score is not a guarantee Neural classifiers can be confidently
      wrong under domain shift. Calibrate or threshold confidence only after testing
      on representative data. Required artifact: Confusion matrix, challenge set,
      and documented abstention threshold.'
    source:
      pages:
      - 652
      verbatim: true
  code:
  - page: 651
    title: 'Working example: FinBERT sentiment classification'
    text: " Working example: FinBERT sentiment classification\n\n\n\n  # Colab: pip\
      \ install -q transformers torch\n  from transformers import pipeline       \
      \                                Challenge cases\n  clf = pipeline(\"text-classification\"\
      ,\n                 model=\"ProsusAI/finbert\",                            \
      \   ▶ Negation\n                 truncation=True)\n\n  sentences = [\n     \
      \                                                                    ▶ Mixed\
      \ sentiment\n   \"Operating margin expanded by 240 basis points.\",\n   \"Management\
      \ withdrew full-year revenue guidance.\",                    ▶ Forward-looking\
      \ language\n   \"The company completed its scheduled debt repayment.\"\n  ]\n\
      \  for text, result in zip(sentences, clf(sentences)):\n                   \
      \                                                      ▶ Numerical contradiction\n\
      \      print(text)\n      print(result)   # label and confidence score     \
      \                  ▶ Very long passages\n                                  \
      \                                        Primary metric: Macro-F1\n        \
      \                                                                  and per-class\
      \ recall."
    paragraphs:
    - 'Working example: FinBERT sentiment classification'
    - '# Colab: pip install -q transformers torch from transformers import pipeline
