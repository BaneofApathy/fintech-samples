definition: A transformer is a neural architecture that uses attention to model relationships
  among tokens. FinBERT is a finance-adapted transformer commonly used for tasks such
  as sentiment classification.
intuition: Attention lets each token weigh other relevant tokens in context, so the
  meaning of a phrase can depend on words far away in the sentence or document.  Anchor
  idea
