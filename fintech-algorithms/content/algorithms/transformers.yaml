    text: " Financial problem: how do we triage thousands of financial statements?\n\
      \n\n\n    Financial problem\n    An analyst team receives earnings-call sentences,\
      \ filings, and news faster than humans can read\n    them. It needs to classify\
      \ sentiment, detect guidance changes, and route material passages for\n    review.\n\
      \n\n A narrow, testable task\n Given one sentence, classify it as positive,\
      \ negative, or neutral in financial context.\n\n   Decision to make: Use a domain-adapted\
      \ transformer for classification before asking a\n   generative model to summarize\
      \ everything."
