  economics:
  - page: 625
    title: How to evaluate clustering when there is no target label
    text: " How to evaluate clustering when there is no target label\n\n\n\n1. Internal\
      \ quality: silhouette, within-cluster dispersion, separation.\n2. Stability:\
      \ rerun with new samples, seeds, and time windows. Do the same segments reappear?\n\
      3. Interpretability: can analysts describe each group with observed behavior\
      \ rather than\n   stereotypes?\n4. Actionability: does the segment support a\
      \ different offer, service path, or risk treatment?\n5. Outcome validation:\
      \ after deployment, do interventions produce different measurable results by\n\
      \   segment?\n\n A common failure\n Teams select k from a chart, name clusters\
      \ with marketing language, and never test whether the\n segments improve a decision."
    paragraphs:
    - How to evaluate clustering when there is no target label
    - '1. Internal quality: silhouette, within-cluster dispersion, separation. 2.
      Stability: rerun with new samples, seeds, and time windows. Do the same segments
      reappear? 3. Interpretability: can analysts describe each group with observed
      behavior rather than stereotypes? 4. Actionability: does the segment support
      a different offer, service path, or risk treatment? 5. Outcome validation: after
      deployment, do interventions produce different measurable results by segment?'
    - A common failure Teams select k from a chart, name clusters with marketing language,
      and never test whether the segments improve a decision.
