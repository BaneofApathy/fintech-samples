    title: When clustering fits
    text: " When clustering fits\n\n\n\n Use it when                             \
      \           Avoid or reconsider when\n▶ Reliable labels do not exist.      \
      \               ▶ You already have a clear supervised target.\n▶ Exploration\
      \ and segmentation are the goal.        ▶ Distance has no meaningful interpretation.\n\
      ▶ Features represent comparable behavior.           ▶ Groups are unstable across\
      \ time or seeds.\n▶ A downstream action can test usefulness.            ▶ Clusters\
      \ may be treated as immutable\n                                            \
