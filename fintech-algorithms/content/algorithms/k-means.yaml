    title: 'Financial problem: how should we segment customers without labels?'
    text: " Financial problem: how should we segment customers without labels?\n\n\
      \n    Financial problem\n    A digital bank has transaction histories for 250,000\
      \ customers but no reliable labels such as\n    “high value,” “cash-flow stressed,”\
      \ or “travel heavy.” It wants useful behavioral segments.\n\n\n\n Candidate\
      \ features                                   The trap\n Monthly inflow, spend\
      \ volatility, savings rate,      A clean mathematical cluster is not\n cash\
      \ withdrawals, merchant diversity, overdraft      automatically a useful business\
      \ segment. Labels\n frequency, and recurring-payment share.              must\
      \ be interpreted after clustering, not\n                                   \
      \                   invented beforehand.\n\n   Decision to make: Discover recurring\
      \ behavioral patterns, then test whether they support a\n   concrete product\
      \ or risk decision."
