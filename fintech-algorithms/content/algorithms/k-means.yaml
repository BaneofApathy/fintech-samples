definition: Clustering is unsupervised learning that groups observations by similarity.
  K-means forms centroid-based groups; DBSCAN finds dense regions and can leave isolated
  points unassigned as noise.
intuition: Clustering organizes the data so analysts can discover patterns. The algorithm
  creates mathematical groups; people must determine whether the groups are stable
  and useful.
