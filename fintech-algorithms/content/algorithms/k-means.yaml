  code:
  - page: 624
    title: 'Working example: behavioral customer segments'
    text: " Working example: behavioral customer segments\n\n\n  from sklearn.datasets\
      \ import make_blobs\n  from sklearn.preprocessing import StandardScaler\n  from\
      \ sklearn.cluster import KMeans\n                                          \
      \                                         Next step\n  from sklearn.metrics\
      \ import silhouette_score\n                                                \
      \                                   Profile each cluster using the\n  # Four\
      \ synthetic behavior profiles\n  X, _ = make_blobs(n_samples=1200, centers=4,\
      \                                     original units:\n      n_features=5, cluster_std=[.7,\
      \ 1.0, .8, 1.2], random_state=9)\n  Z = StandardScaler().fit_transform(X)  \
      \                                          ▶ Median inflow\n  for k in range(2,\
      \ 7):\n      km = KMeans(n_clusters=k, n_init=20, random_state=9)          \
      \               ▶ Savings rate\n      labels = km.fit_predict(Z)\n      print(k,\
      \ round(silhouette_score(Z, labels), 3))                              ▶ Volatility\n\
      \  final = KMeans(n_clusters=4, n_init=20, random_state=9)\n  segment = final.fit_predict(Z)\
      \                                                   ▶ Overdrafts\n  print(\"\
      Segment counts:\", __import__(’numpy’).bincount(segment))\n                \
      \                                                                   ▶ Merchant\
      \ mix\n                                                                    \
      \               Primary metric: Stability\n                                \
      \                                                   plus business usefulness,\
      \ not\n                                                                    \
      \               silhouette alone."
    paragraphs:
    - 'Working example: behavioral customer segments'
    - 'from sklearn.datasets import make_blobs from sklearn.preprocessing import StandardScaler
      from sklearn.cluster import KMeans Next step from sklearn.metrics import silhouette_score
      Profile each cluster using the # Four synthetic behavior profiles X, _ = make_blobs(n_samples=1200,
      centers=4, original units: n_features=5, cluster_std=[.7, 1.0, .8, 1.2], random_state=9)
      Z = StandardScaler().fit_transform(X) ▶ Median inflow for k in range(2, 7):
      km = KMeans(n_clusters=k, n_init=20, random_state=9) ▶ Savings rate labels =
      km.fit_predict(Z) print(k, round(silhouette_score(Z, labels), 3)) ▶ Volatility
      final = KMeans(n_clusters=4, n_init=20, random_state=9) segment = final.fit_predict(Z)
      ▶ Overdrafts print("Segment counts:", __import__(’numpy’).bincount(segment))
      ▶ Merchant mix Primary metric: Stability plus business usefulness, not silhouette
      alone.'
