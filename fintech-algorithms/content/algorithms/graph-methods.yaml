  choice:
  - page: 646
    title: When graph methods fit
    text: " When graph methods fit\n\n\n\n Use them when                         \
      \                    Avoid or constrain them when\n▶ Relationships carry predictive\
      \ signal.                   ▶ Links are sparse, stale, or ambiguous.\n▶ Coordinated\
      \ behavior matters.                            ▶ Guilt by association could\
      \ drive decisions.\n▶ Entity resolution is sufficiently reliable.          \
      \    ▶ Historical graphs leak future relationships.\n▶ Graph features can be\
      \ refreshed in time.       ▶ A tabular baseline already solves the problem.\n\
      Required artifact: Graph schema, entity-resolution assumptions, temporal split,\
      \ and\ncomponent-level error analysis.\n\n\n   Student defense question: How\
      \ would you explain a high risk score caused mainly by shared\n   neighbors\
      \ without claiming that association proves wrongdoing?"
