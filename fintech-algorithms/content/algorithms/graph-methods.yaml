definition: Graph methods represent entities as nodes and relationships as edges.
  Classical methods use components, centrality, paths, and communities; graph neural
  networks learn node representations by aggregating information from neighbors.
intuition: A transaction can look normal in isolation but suspicious in context. The
  network exposes shared infrastructure and coordinated behavior.  Anchor idea
useWhen:
- Risk emerges from relationships or coordinated behavior.
- Entity links can be resolved with defensible confidence.
- Investigators need paths and subgraphs, not only scores.
- Tabular features plateau because they ignore shared infrastructure.
- The organization can maintain a time-aware graph.
avoidWhen:
- Edges are sparse, noisy, or defined only after the outcome.
- Entity resolution creates many false links.
- A row-level model already captures the needed signal.
- Latency or infrastructure cannot support graph queries.
- The score will be treated as legal proof rather than investigative evidence.
