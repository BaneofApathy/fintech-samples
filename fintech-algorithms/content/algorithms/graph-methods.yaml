    title: 'Financial problem: can we detect a coordinated fraud ring?'
    text: " Financial problem: can we detect a coordinated fraud ring?\n\n\n\n   \
      \ Financial problem\n    Each transaction looks only mildly suspicious, but\
      \ several accounts share devices, addresses,\n    merchants, and counterparties.\
      \ The risk exists in the relationships, not in any one row.\n\n\n Relational\
      \ question\n Which accounts belong to the same connected structure, which entities\
      \ act as hubs, and which new\n links change the risk picture?\n\n   Decision\
      \ to make: Represent entities as nodes and interactions as edges, then score\
      \ patterns\n   across the network."
