    title: 'Working example: a tiny execution agent'
    text: " Working example: a tiny execution agent\n\n\n  import numpy as np\n  rng\
      \ = np.random.default_rng(5)\n  T, inventory0, actions = 10, 10, np.array([0,1,2])\n\
      \                                                                          \
      \                                             Important\n  Q = np.zeros((T+1,\
      \ inventory0+1, len(actions)))\n  alpha, gamma, eps = .15, .95, .20        \
      \                                                                          \
      \  This is a teaching\n  for episode in range(8000):                       \
      \                                                                   environment,\
      \ not a\n      inv = inventory0\n      for t in range(T):                  \
      \                                                                          \
      \   market model. Students\n          valid = np.where(actions <= inv)[0]\n\
      \          a_idx = rng.choice(valid) if rng.random() < eps else valid[np.argmax(Q[t,inv,valid])]\
      \                        should inspect how the\n          qty = actions[a_idx]\n\
      \          impact = .08 * qty**2                                           \
      \                                             policy changes when:\n       \
      \   price_risk = rng.normal(0, .10) * inv\n          next_inv = inv - qty\n\
      \          reward = -(impact + price_risk)\n                               \
      \                                                                          \
      \              ▶ impact rises,\n          if t == T-1: reward -= 5.0 * next_inv\
      \ # incomplete penalty\n          next_valid = np.where(actions <= next_inv)[0]\
      \                                                                ▶ penalty rises,\n\
      \          future = 0 if t == T-1 else Q[t+1,next_inv,next_valid].max()\n  \
      \        Q[t,inv,a_idx] += alpha * (reward + gamma*future - Q[t,inv,a_idx])\n\
      \          inv = next_inv\n                                                \
      \                                                                       ▶ volatility\
      \ rises.\n  policy, inv = [], inventory0\n  for t in range(T):\n      valid\
      \ = np.where(actions <= inv)[0]\n      qty = actions[valid[np.argmax(Q[t,inv,valid])]]\n\
      \      policy.append(qty); inv -= qty\n  print(\"illustrative actions:\", policy,\
      \ \"remaining:\", inv)"
