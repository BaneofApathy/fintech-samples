  - page: 672
    title: How to evaluate reinforcement learning
    text: " How to evaluate reinforcement learning\n\n\n\n1. Compare against TWAP,\
      \ VWAP, and simple adaptive policies.\n2. Run many random seeds; report distributions,\
      \ not one lucky trajectory.\n3. Evaluate out of sample across volatility and\
      \ liquidity regimes.\n4. Check constraint violations and incomplete orders explicitly.\n\
      5. Stress the simulator and test for reward hacking.\n6. Use shadow mode before\
      \ any live action.\n Primary metric: Implementation shortfall, tail slippage,\
      \ completion rate, and constraint violations.\n Required artifact: Baseline\
      \ comparison, reward specification, stress scenarios, and trace of\n decisions."
    paragraphs:
    - How to evaluate reinforcement learning
    - '1. Compare against TWAP, VWAP, and simple adaptive policies. 2. Run many random
      seeds; report distributions, not one lucky trajectory. 3. Evaluate out of sample
      across volatility and liquidity regimes. 4. Check constraint violations and
      incomplete orders explicitly. 5. Stress the simulator and test for reward hacking.
      6. Use shadow mode before any live action. Primary metric: Implementation shortfall,
      tail slippage, completion rate, and constraint violations. Required artifact:
      Baseline comparison, reward specification, stress scenarios, and trace of decisions.'
    source:
      pages:
      - 672
      verbatim: true
