    text: " Financial problem: how should a large order be executed over time?\n\n\
      \n\n    Financial problem\n    A trading desk must buy 10,000 shares over ten\
      \ intervals. Trading too quickly can move the\n    market; trading too slowly\
      \ risks adverse price movement and an incomplete order.\n\n\n Sequential decision\n\
      \ The best action now depends on time remaining, inventory remaining, current\
      \ liquidity, price\n movement, and prior actions.\n\n   Decision to make: Learn\
      \ a policy for a sequence of actions, then compare it against\n   deterministic\
      \ execution baselines."
