definition: Reinforcement learning trains an agent to choose actions from states in
  order to maximize cumulative reward. Q-learning estimates action values; deep RL
  uses neural networks for larger state spaces.
intuition: The agent learns from consequences over time. The hard part is defining
  a reward and evaluation environment that match the real objective without enabling
  unsafe exploration.
useWhen:
- Decisions are sequential and affect future options.
- The decision is
- Feedback is delayed and cumulative. suffices.
- A credible simulator or rich logged policy data exist.
- Safe offline evaluation and hard constraints are possible.
- The value over a simple policy is material and testable.
avoidWhen:
- There is no defensible reward function.
- Exploration can harm customers or markets.
- The environment changes faster than the policy can be validated.
- Logged data do not support off-policy evaluation.
