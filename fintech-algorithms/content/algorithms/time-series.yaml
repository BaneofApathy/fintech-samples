    title: 'Working example: a weekly seasonal forecast'
    text: " Working example: a weekly seasonal forecast\n\n\n\n  import numpy as np,\
      \ pandas as pd\n  from statsmodels.tsa.statespace.sarimax import SARIMAX\n \
      \ from sklearn.metrics import mean_absolute_error\n                        \
      \                                                             Compare with\n\
      \  rng = np.random.default_rng(4)                                          \
      \          ▶ Last value\n  t = np.arange(365)\n  y = 1000 + 1.1*t + 130*np.sin(2*np.pi*t/7)\
      \ + rng.normal(0,45,365)\n  y = pd.Series(y, index=pd.date_range(\"2025-01-01\"\
      , periods=365))\n                                                          \
      \                          ▶ Last week\n  train, test = y.iloc[:-28], y.iloc[-28:]\
      \                                          ▶ 7-day moving average\n  model =\
      \ SARIMAX(train, order=(1,1,1),\n                  seasonal_order=(1,0,1,7),\n\
      \                  enforce_stationarity=False).fit(disp=False)\n           \
      \                                                                         ▶\
      \ Forecast with a holiday\n  forecast = model.get_forecast(steps=28)\n  pred\
      \ = forecast.predicted_mean\n                                              \
      \                                        feature\n  print(\"MAE:\", mean_absolute_error(test,\
      \ pred))\n  print(forecast.conf_int().tail())                              \
      \                    Primary metric: MAE and\n                             \
      \                                                        interval coverage at\
      \ the\n                                                                    \
      \                 actual horizon."
