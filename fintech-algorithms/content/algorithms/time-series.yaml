  method:
  - page: 636
    title: 'Method: ARIMA models dependence through time'
    text: " Method: ARIMA models dependence through time\n\n\n\n ARIMA(p, d, q) combines:\n\
      ▶ AR(p): dependence on prior values.\n▶ I(d): differencing to remove nonstationary\
      \ level or trend.\n▶ MA(q): dependence on prior forecast errors.\n         \
      \                                            ϕ(B)(1 − B)d yt = c + θ(B)εt\n\
      \ SARIMA adds seasonal terms such as weekly or monthly cycles.\n\n Separate\
      \ question: GARCH\n ARIMA forecasts the conditional mean. GARCH models changing\
      \ conditional variance and is useful when\n volatility itself clusters over\
      \ time."
    paragraphs:
    - 'Method: ARIMA models dependence through time'
    - 'ARIMA(p, d, q) combines: ▶ AR(p): dependence on prior values. ▶ I(d): differencing
      to remove nonstationary level or trend. ▶ MA(q): dependence on prior forecast
      errors. ϕ(B)(1 − B)d yt = c + θ(B)εt SARIMA adds seasonal terms such as weekly
      or monthly cycles.'
    - 'Separate question: GARCH ARIMA forecasts the conditional mean. GARCH models
