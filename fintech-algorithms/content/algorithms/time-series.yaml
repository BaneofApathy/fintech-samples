definition: ARIMA models a time series through autoregressive lags, differencing,
  and lagged forecast errors. SARIMA adds seasonal structure; GARCH models changing
  volatility rather than the level itself.
intuition: Recent values, recurring seasonal patterns, and recent forecast errors
  contain information about the next value – until the process changes.  Anchor idea
useWhen:
- The series has enough history at a consistent frequency.
- Lag and seasonal patterns are plausible and inspectable.
- An explainable statistical benchmark is valuable.
- The forecast horizon is explicit and operationally meaningful.
- Intervals and backtesting can be maintained.
avoidWhen:
- A structural break makes the historical regime irrelevant.
- Demand is highly intermittent or mostly zeros.
- External drivers dominate but are not included.
- The question is causal or policy counterfactual.
- A long-range scenario is presented as a precise forecast.
