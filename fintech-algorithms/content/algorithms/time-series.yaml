  title: 'Primer 6A: Time-series forecasting – definition and intuition'
  text: " Primer 6A: Time-series forecasting – definition and intuition\n\n\n   Financial\
    \ problem: How much cash, payment volume, staffing, or liquidity will be needed\
    \ over the next day,\n   week, or quarter?\n\n\n\n Definition                \
    \                                                                            \
    \  Plain-English intuition\n ARIMA models a time series through autoregressive\
    \ lags,                                                 Recent values, recurring\
    \ seasonal patterns, and\n differencing, and lagged forecast errors. SARIMA adds\
    \                                                   recent forecast errors contain\
    \ information about the\n seasonal structure; GARCH models changing volatility\
    \ rather                                             next value – until the process\
    \ changes.\n than the level itself.\n                                        \
    \                                                                 Anchor idea\n\
    \ Input → output\n                                                           \
    \                                                   ARMA(1,1): yt = c + ϕyt−1\
    \ + ϵt + θϵt−1 .\n Input: Ordered observations with a clear time index, frequency,\
    \ and\n forecast horizon; optional external drivers require extended models.\n\
    \ Output: A point forecast and, critically, an interval that widens with\n uncertainty\
    \ and horizon.\n What it learns: Serial dependence in the historical process.\
    \ It does not learn why a policy or external event caused the change."
