    text: " Financial problem: how much liquidity will we need next week?\n\n\n\n\
      \    Financial problem\n    A payments company must forecast daily settlement\
      \ outflows so treasury can hold enough\n    liquidity without leaving excessive\
      \ cash idle. Demand has trend, weekly seasonality, holidays, and\n    shocks.\n\
      \n\n Decision consequences\n Underforecasting can create funding stress or emergency\
      \ borrowing. Overforecasting increases idle\n cash and opportunity cost.\n\n\
      \   Decision to make: Produce a point forecast and an honest interval for the\
      \ decision horizon."
