solutionPages:
- page: 538
  title: VaR Exceptions
  text: " VaR Exceptions\n\n   M35 | Worked solution — Does the Tail Forecast Hold\
    \ Up?\n\n1. Observed exception rate: 10/250 = 4%.\n2. Nominal exception probability:\
    \ 1 − 0.99 = 1%.\n3. Expected count: 250(0.01) = 2.5 exceptions—not a guaranteed\
    \ count or an acceptance\n   band.\n4. Rate ratio: 4%/1% = 4× the nominal rate.\n\
    5. Timing: six exceptions concentrated in ten days can reveal a stress-period\
    \ weakness hidden\n   by an annual average."
  paragraphs:
