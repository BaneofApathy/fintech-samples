id: M35
title: Does the Tail Forecast Hold Up?
minutes: 7
kind: measure
parent: var-exception-rate
question: "A bank evaluates a 99% one-day VaR forecast over 250 trading days. Actual\
  \ daily losses\n exceed that day’s predicted VaR on 10 days. Six of those exceptions\
  \ occur within one 10-day\n period.\n Calculate:\n1. The observed exception rate.\n\
  2. The nominal expected number of exceptions under the 99% target.\n3. The ratio\
  \ of observed to nominal exception rates.\n Explain why reviewing only the annual\
  \ exception count would miss something important. Does\n the count alone identify\
  \ the cause of the problem?"
