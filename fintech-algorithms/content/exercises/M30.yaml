  readAloud:
  - Count support against all retrieved evidence, then support from each attached
    citation, then correctness of the selected numeric statements. Keep the three
    denominators separate. For derived growth, use (new − old)/old. This arithmetic
    must be checked against the cited revenue figures.
  workedExplanation:
  - 'A true statement can carry the wrong citation, and a well-cited answer can still
    contain false statements. Different denominators are intentional. These scores
    should not be averaged into a single “accuracy” number; one material debt error
    may be sufficient to reject the answer. '
  - Claim 3 is numerically correct and supported somewhere in the supplied corpus,
    but its own citation is wrong. A single answer can therefore pass one check and
    fail another. The exact counting rubric is part of the definition, not a formatting
    detail.
  workedDetails:
  - Evidence A gives 2024 revenue of $100 million and 2025 revenue of $120 million.
    Evidence B gives 2025 net profit of $12 million. Evidence C gives 2025 debt of
    $40 million.
  - 'The answer claims: revenue was $120 million [A]; revenue grew 20% [A]; net profit
    was $12 million [C]; debt was $30 million [C]; and debt will fall next year [no
    citation].'
  - The net-profit claim is true but cites the wrong evidence. The debt amount is
    false; the future-debt claim is unsupported.
  workedArithmetic:
  - Revenue growth = (120 − 100) / 100 = 20%.
  - 'Claims 1 and 2 are supported by A, and claim 3 by B: faithfulness = 3/5 = 60%.'
  - 'Only claims 1 and 2 have correct attached citations: citation correctness = 2/4
    = 50%.'
  - Figures 120, 20% and 12 are correct; the debt figure 30 should be 40. Numeric
    accuracy = 3/4 = 75%.
