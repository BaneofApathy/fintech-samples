interpretationPages:
- page: 479
  title: Answer Quality
  text: " Answer Quality\n\n   M30 | Interpretation\n\n What the answer means\n A\
    \ true statement can carry the wrong citation, and a well-cited answer can still\
    \ contain false\n statements. Different denominators are intentional. These scores\
    \ should not be averaged into a\n single “accuracy” number; one material debt\
    \ error may be sufficient to reject the answer.\n Why these steps matter\n Claim\
    \ 3 is numerically correct and supported somewhere in the supplied corpus, but\
    \ its own\n citation is wrong. A single answer can therefore pass one check and\
    \ fail another. The exact\n counting rubric is part of the definition, not a formatting\
    \ detail."
  paragraphs:
  - Answer Quality
  - M30 | Interpretation
  - What the answer means A true statement can carry the wrong citation, and a well-cited
    answer can still contain false statements. Different denominators are intentional.
