solutionPages:
- page: 478
  title: Answer Quality
  text: " Answer Quality\n\n   M30 | Worked solution — Three Checks, Three Denominators\n\
    \n1. Verify the derived number: revenue growth = (120 − 100)/100 = 20%.\n2. Supported\
    \ claims: 1 and 2 are supported by A; 3 is supported by B. Claims 4 and 5 are\n\
    \   unsupported.\n                                F aithf ulness = 3/5 = 60%.\n\
    3. Correct attached citations: claims 1 and 2 cite supporting evidence. Claim\
    \ 3 cites debt,\n   not profit; claim 4 contradicts its source.\n            \
    \                    Citation correctness = 2/4 = 50%.\n4. Correct financial figures:\
    \ 120, 20%, and 12 are correct; 30 should be 40.\n                           \
    \   N umerical accuracy = 3/4 = 75%."
  paragraphs:
  - Answer Quality
  - M30 | Worked solution — Three Checks, Three Denominators
  - '1. Verify the derived number: revenue growth = (120 − 100)/100 = 20%. 2. Supported
    claims: 1 and 2 are supported by A; 3 is supported by B. Claims 4 and 5 are unsupported.
    F aithf ulness = 3/5 = 60%. 3. Correct attached citations: claims 1 and 2 cite
    supporting evidence. Claim 3 cites debt, not profit; claim 4 contradicts its source.
    Citation correctness = 2/4 = 50%. 4. Correct financial figures: 120, 20%, and
    12 are correct; 30 should be 40. N umerical accuracy = 3/4 = 75%.'
