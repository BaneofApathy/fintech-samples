id: M30
title: Three Checks, Three Denominators
minutes: 10
kind: measure
parent: faithfulness-citation-correctness-numerical-accuracy
question: "The retrieved evidence says:\n▶ A: Revenue was $100 million in 2024 and\
  \ $120 million in 2025.\n▶ B: 2025 net profit was $12 million.\n▶ C: 2025 debt was\
  \ $40 million.\n\nThe generated answer makes five claims:\n1. “2025 revenue was\
  \ $120 million.” [A]\n2. “Revenue grew 20%.” [A]\n3. “2025 net profit was $12 million.”\
  \ [C]\n4. “2025 debt was $30 million.” [C]\n5. “Debt will fall next year.” No citation.\n\
  \ Calculate faithfulness over five claims, citation correctness over four claim–citation\
  \ pairs, and\n numerical accuracy over the four financial figures: 120, 20%, 12,\
  \ and 30. Faithfulness permits\n support from any retrieved passage; citation correctness\
  \ requires the attached source to support\n that claim."
