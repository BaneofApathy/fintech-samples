steps:
- id: growth
  title: Revenue growth
  expects: number
  unit: proportion
  tolerance:
    rel: 0.005
    abs: 5.0e-05
  hints: &id005
  - Subtract old revenue from new revenue and divide by old revenue.
  mistakes:
  - pattern: recompute
    message: Subtract old revenue from new revenue and divide by old revenue.
- id: faithfulness
  title: Claim faithfulness
  expects: number
  unit: proportion
  tolerance:
    rel: 0.005
    abs: 5.0e-05
  hints: &id006
  - Divide supported claims by all claims.
  mistakes:
  - pattern: recompute
    message: Divide supported claims by all claims.
- id: citation
  title: Citation correctness
  expects: number
  unit: proportion
  tolerance:
    rel: 0.005
    abs: 5.0e-05
  hints: &id007
  - Divide correctly supported claim–citation pairs by all cited pairs.
  mistakes:
  - pattern: recompute
    message: Divide correctly supported claim–citation pairs by all cited pairs.
- id: numerical
  title: Numeric accuracy
  expects: number
  unit: proportion
  tolerance:
    rel: 0.005
    abs: 5.0e-05
  hints: &id008
  - Divide correct financial figures by all evaluated figures.
  mistakes:
  - pattern: recompute
    message: Divide correct financial figures by all evaluated figures.
learning:
  title: Three Checks, Three Denominators
  scenario: 'A financial answer is audited for three separate properties: support
    anywhere in retrieved evidence, correctness of its attached citations, and correctness
    of numeric figures. Revenue figures use the same units and period basis.'
  task: Calculate revenue growth and the three audit rates from their separate counts.
    A true statement can still have the wrong attached citation.
  interpretation: 'Use the denominator belonging to each check: all claims, claim–citation
    pairs, or financial figures. Averaging these rates into one accuracy number would
    hide the type of failure.'
  summary: 'Revenue growth: {growth}. Faithfulness: {faithfulness}; citation correctness:
    {citation}; numeric accuracy: {numerical}.'
