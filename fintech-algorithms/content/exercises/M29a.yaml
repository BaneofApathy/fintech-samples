learning:
  title: How Soon Does the First Useful Source Appear?
  scenario: An analyst records the rank of the first relevant passage for each query.
    Rank 0 means no relevant result in the evaluated list.
  task: Assign reciprocal rank 1/rank when found and 0 otherwise. Calculate mean reciprocal
    rank, then replace the last query’s missing result with the supplied new rank
    and calculate improvement.
  interpretation: Include unsuccessful queries in the mean. MRR measures how early
    the first relevant passage appears; it ignores additional relevant passages and
    does not measure answer correctness.
  summary: 'Original MRR: {MRR}; revised MRR: {newMRR}; improvement: {improvement}.'
  labels: *id005
  steps:
    RR:
      title: Reciprocal rank for each query
      hints: *id006
      unit: ''
    MRR:
      title: Mean reciprocal rank
      hints: *id007
      unit: ''
    newMRR:
      title: MRR after improving the last query
      hints: *id008
      unit: ''
    improvement:
      title: MRR improvement
      hints: *id009
      unit: ''
  readAloud:
  - Take one divided by the position of the first relevant result. Give zero to a
    query with none in the evaluated results. Average across all questions, including
    the zero cases. Ranks start at 1, not zero. Bringing a source from rank 4 to rank
    2 raises its contribution from one-quarter to one-half.
  workedExplanation:
  - 'The first useful passage now appears earlier for more questions, reducing how
    far an analyst or downstream system must search. MRR is not the percentage of
    correct answers and ignores the ordering of additional relevant passages after
    the first. '
  - The unresolved question belongs in the denominator of the original MRR. Dropping
    it would inflate the reported retrieval quality by evaluating only successful
    searches.
  workedArithmetic:
  - Reciprocal ranks are [1, 1/2, 1/4, 0] = [1, 0.5, 0.25, 0]. Original MRR = 1.75/4
    = 0.4375.
  - Moving the last query’s first relevant passage to rank 2 changes its contribution
    to 1/2. New MRR = (1 + 0.5 + 0.25 + 0.5) / 4 = 0.5625.
  - Improvement = 0.5625 − 0.4375 = 0.125.
