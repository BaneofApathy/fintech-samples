interpretationPages:
- page: 461
  title: MRR
  text: " MRR\n\n   M29a | Interpretation\n\n What the answer means\n The first useful\
    \ passage now appears earlier for more questions, reducing how far an analyst\
    \ or\n downstream system must search. MRR is not the percentage of correct answers\
    \ and ignores\n the ordering of additional relevant passages after the first.\n\
    \ Why these steps matter\n The unresolved question belongs in the denominator\
    \ of the original MRR. Dropping it would\n inflate the reported retrieval quality\
    \ by evaluating only successful searches."
  paragraphs:
  - MRR
  - M29a | Interpretation
  - What the answer means The first useful passage now appears earlier for more questions,
    reducing how far an analyst or downstream system must search. MRR is not the percentage
    of correct answers and ignores the ordering of additional relevant passages after
