interpretationPages:
- page: 410
  title: Prediction Intervals
  text: " Prediction Intervals\n\n   M24 | Interpretation\n\n What the answer means\n\
    \ Wider ranges cover more outcomes but give less precise funding guidance. Neither\
    \ result alone\n determines the better system: treasury needs sufficiently reliable\
    \ coverage and useful width.\n Five observations are too few to conclude that\
    \ the original 90% intervals are systematically\n miscalibrated.\n Why these steps\
    \ matter\n Making every interval very wide can raise coverage without giving treasury\
    \ a useful forecast.\n Coverage and width must be read together, and the five-day\
    \ count alone is too small to\n establish long-run calibration."
  paragraphs:
  - Prediction Intervals
  - M24 | Interpretation
  - 'What the answer means Wider ranges cover more outcomes but give less precise
    funding guidance. Neither result alone determines the better system: treasury
    needs sufficiently reliable coverage and useful width. Five observations are too
    few to conclude that the original 90% intervals are systematically miscalibrated.
    Why these steps matter Making every interval very wide can raise coverage without
    giving treasury a useful forecast. Coverage and width must be read together, and
    the five-day count alone is too small to establish long-run calibration.'
