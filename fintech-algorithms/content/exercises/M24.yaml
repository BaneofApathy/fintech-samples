question: "Treasury receives these purported 90% prediction intervals, in $ millions.\n\
  \   Day                                            Lower bound   Upper bound   \
  \       Actual outflow\n   1                                                   \
  \    90                 120              110\n   2                             \
  \                         100                 120              125\n   3       \
  \                                                85                 105        \
  \       95\n   4                                                      130      \
  \           160              150\n   5                                         \
  \             100                 110              105\n Count an actual on either\
  \ boundary as covered. Calculate observed coverage and average width.\n Then lower\
  \ every lower bound by 10 and raise every upper bound by 10. Recalculate both\n\
  \ measures. Which result is more useful for treasury?"
