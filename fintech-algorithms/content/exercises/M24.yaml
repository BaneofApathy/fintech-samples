  - Mark each actual as inside or outside its range, then average those 0/1 marks.
    Separately subtract each lower bound from its upper bound and average the widths.
    The endpoints count as covered. Lowering the lower bound by 10 and raising the
    upper bound by 10 widens each interval by 20, not 10.
  workedExplanation:
  - 'Wider ranges cover more outcomes but give less precise funding guidance. Neither
    result alone determines the better system: treasury needs sufficiently reliable
    coverage and useful width. Five observations are too few to conclude that the
    original 90% intervals are systematically miscalibrated. '
  - Making every interval very wide can raise coverage without giving treasury a useful
    forecast. Coverage and width must be read together, and the five-day count alone
    is too small to establish long-run calibration.
  workedArithmetic:
  - Days 1, 3, 4 and 5 are covered; day 2 is not. Original coverage = 4/5 = 80%.
  - Widths are [30, 20, 20, 30, 10], so mean width = 110/5 = $22 million.
  - 'Widened intervals are [80, 130], [90, 130], [75, 115], [120, 170], [90, 120].
    All five actuals are covered: 5/5 = 100%.'
  - Adding 10 to both sides increases each width by 20; mean width = 22 + 20 = $42
    million.
