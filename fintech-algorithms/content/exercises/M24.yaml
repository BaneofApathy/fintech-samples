steps:
- id: coverage
  title: Observed interval coverage
  expects: number
  unit: proportion
  tolerance:
    rel: 0.005
    abs: 5.0e-05
  hints: &id004
  - Count actuals between their bounds, including endpoints, and divide by observation
    count.
  mistakes:
  - pattern: recompute
    message: Count actuals between their bounds, including endpoints, and divide by
      observation count.
- id: width
  title: Mean interval width
  expects: number
  unit: $ millions
  tolerance:
    rel: 0.005
    abs: 5.0e-05
  hints: &id005
  - Subtract lower from upper for each interval, then average.
  mistakes:
  - pattern: recompute
    message: Subtract lower from upper for each interval, then average.
- id: wideCoverage
  title: Coverage after widening
  expects: number
  unit: proportion
  tolerance:
    rel: 0.005
    abs: 5.0e-05
  hints: &id006
  - Check each actual against lower − widen and upper + widen.
  mistakes:
  - pattern: recompute
    message: Check each actual against lower − widen and upper + widen.
- id: wideWidth
  title: Mean width after widening
  expects: number
  unit: $ millions
  tolerance:
    rel: 0.005
    abs: 5.0e-05
  hints: &id007
  - Each interval gains twice the widening amount.
  mistakes:
  - pattern: recompute
    message: Each interval gains twice the widening amount.
learning:
  title: Covered, but Useful?
  scenario: Treasury receives nominal 90% prediction intervals for outflows in $ millions.
    An actual on either boundary counts as covered.
  task: Calculate coverage and average interval width. Then subtract the widening
    amount from every lower bound and add it to every upper bound; calculate both
    measures again.
  interpretation: Wider intervals may cover more outcomes but give less precise guidance.
    Coverage and width should be read together, and a small sample cannot establish
    long-run calibration.
  summary: 'Original coverage/width: {coverage}, {width}. Wider coverage/width: {wideCoverage},
    {wideWidth}.'
