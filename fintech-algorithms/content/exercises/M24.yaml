    \                  Coverage =     Coveredi ,    M ean width =      (Ui − Li ).\n\
    \                                        n i                              n i\n\
    \ Read it aloud: Mark each actual as inside or outside its range, then average\
    \ those 0/1 marks.\n Separately subtract each lower bound from its upper bound\
    \ and average the widths.\n The endpoints count as covered. Lowering the lower\
    \ bound by 10 and raising the upper bound\n by 10 widens each interval by 20,\
    \ not 10."
