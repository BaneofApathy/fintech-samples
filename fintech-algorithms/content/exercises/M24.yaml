  text: " Prediction Intervals\n\n   M24 | Formula explained (1/1)\n\n Question: How\
    \ often do the ranges contain the outcome, and how wide are they?\n          \
    \                                  Coveredi = 1(Li ≤ yi ≤ Ui ),\n            \
