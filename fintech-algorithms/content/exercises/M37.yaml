  readAloud:
  - Divide each task-level outcome count by assigned tasks. Divide tool-call errors
    by tool calls. Do not substitute one denominator for the other. The unsafe-attempt
    count is the number of tasks containing at least one unauthorized attempt, not
    the total number of such attempts.
  workedExplanation:
  - 'Passing field checks does not guarantee that an invoice workflow finished. Zero
    executed unauthorized actions shows that the blocking control worked in this sample—not
    that the agent never tried to exceed its authority. Tool errors use a different
    denominator from task outcomes and may be recoverable. Inspect the four unsafe-attempt
    traces even when final task results look acceptable. '
  - A recovered tool error can occur during a task that ultimately succeeds. An unsafe
    attempt can also be blocked before causing an unauthorized action. These counts
    therefore need not be mutually exclusive or add to 100%; each rate measures a
    distinct failure or control outcome.
  workedArithmetic:
  - Task success = 90/100 = 90%; field-verification pass rate = 95/100 = 95%.
  - Unauthorized-attempt rate = 4/100 = 4%; unauthorized-execution rate = 0/100 =
    0%.
  - Tool-call error rate = 10/200 = 5%. Its denominator is tool calls, not assigned
    tasks.
