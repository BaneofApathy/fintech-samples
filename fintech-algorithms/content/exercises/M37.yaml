id: M37
title: Completed, Checked, and Within Authority?
minutes: 8
kind: measure
parent: task-success-verification-unsafe-actions
question: "An invoice agent processes 100 assigned tasks:\n▶ 90 complete correctly\
  \ and pass every required verification check.\n▶ 95 pass the required field checks;\
  \ five of these do not finish the workflow.\n▶ Four tasks contain an attempted action\
  \ outside the agent’s authority. Every such attempt is\n  blocked.\n▶ Across 200\
  \ tool calls, 10 return an error.\n Define success as correct completion plus all\
  \ required checks. Calculate task success,\n field-verification pass rate, task-level\
  \ unsafe-attempt rate, task-level unsafe-execution rate,\n and tool-call error rate.\
  \ Does blocking all unsafe attempts make those attempts irrelevant?"
