solutionPages:
- page: 556
  title: Agent Measures
  text: " Agent Measures\n\n   M37 | Worked solution — Completed, Checked, and Within\
    \ Authority?\n\n1. Task success: 90/100 = 90%.\n2. Field-verification pass rate:\
    \ 95/100 = 95%.\n3. Tasks with unsafe attempts: 4/100 = 4%.\n4. Tasks with executed\
    \ unauthorized actions: 0/100 = 0%.\n5. Tool-call error rate: 10/200 = 5%."
  paragraphs:
  - Agent Measures
  - M37 | Worked solution — Completed, Checked, and Within Authority?
  - '1. Task success: 90/100 = 90%. 2. Field-verification pass rate: 95/100 = 95%.
    3. Tasks with unsafe attempts: 4/100 = 4%. 4. Tasks with executed unauthorized
    actions: 0/100 = 0%. 5. Tool-call error rate: 10/200 = 5%.'
  source:
    pages:
    - 556
    verbatim: true
interpretationPages:
- page: 557
  title: Agent Measures
  text: " Agent Measures\n\n   M37 | Interpretation\n\n What the answer means\n Passing\
    \ field checks does not guarantee that an invoice workflow finished. Zero executed\n\
    \ unauthorized actions shows that the blocking control worked in this sample—not\
    \ that the agent\n never tried to exceed its authority. Tool errors use a different\
    \ denominator from task outcomes\n and may be recoverable. Inspect the four unsafe-attempt\
    \ traces even when final task results\n look acceptable.\n Why these steps matter\n\
    \ A recovered tool error can occur during a task that ultimately succeeds. An\
    \ unsafe attempt can\n also be blocked before causing an unauthorized action.\
    \ These counts therefore need not be\n mutually exclusive or add to 100%; each\
    \ rate measures a distinct failure or control outcome."
  paragraphs:
  - Agent Measures
  - M37 | Interpretation
  - What the answer means Passing field checks does not guarantee that an invoice
    workflow finished. Zero executed unauthorized actions shows that the blocking
    control worked in this sample—not that the agent never tried to exceed its authority.
    Tool errors use a different denominator from task outcomes and may be recoverable.
    Inspect the four unsafe-attempt traces even when final task results look acceptable.
    Why these steps matter A recovered tool error can occur during a task that ultimately
    succeeds. An unsafe attempt can also be blocked before causing an unauthorized
    action. These counts therefore need not be mutually exclusive or add to 100%;
    each rate measures a distinct failure or control outcome.
  source:
    pages:
    - 557
    verbatim: true
