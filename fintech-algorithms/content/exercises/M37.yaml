learning:
  title: Completed, Checked, and Within Authority?
  scenario: An invoice agent is audited at task and tool-call levels. Success means
    correct completion plus all required checks. Unsafe-attempt count is the number
    of tasks with at least one unauthorized attempt.
  task: Calculate task success, verification pass rate, unsafe-attempt rate, unsafe-execution
    rate and tool-call error rate.
  interpretation: A task may recover from a tool error and still succeed. A blocked
    unauthorized attempt remains worth inspecting even when no unauthorized action
    occurred. These categories overlap and need not sum to 100%.
  summary: 'Task success: {success}; verification: {verification}. Unsafe attempts:
    {unsafeAttempt}; unsafe executions: {unsafeExecution}; tool errors: {toolError}.'
