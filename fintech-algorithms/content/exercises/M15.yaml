solutionPages:
- page: 325
  title: Brier Score
  text: " Brier Score\n\n   M15 | Worked solution — Check Probability Error\n\n1.\
    \ Model squared errors:\n                      [(0.10 − 0)2 , (0.80 − 1)2 , (0.60\
    \ − 0)2 , (0.20 − 0)2 ]\n                                                  = [0.01,\
    \ 0.04, 0.36, 0.04].\n2. Average: (0.01 + 0.04 + 0.36 + 0.04)/4 = 0.45/4 = 0.1125.\n\
    3. Baseline squared errors: [0.0625, 0.5625, 0.0625, 0.0625].\n4. Baseline average:\
    \ 0.75/4 = 0.1875.\n5. Compare: The model’s Brier score is lower. Loan C contributes\
    \ the largest individual term,\n   0.36."
  paragraphs:
  - Brier Score
