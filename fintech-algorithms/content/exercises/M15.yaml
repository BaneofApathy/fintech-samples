question: "A default model produces:\n   Loan                                    \
  \       Predicted default probability p                  Outcome y: default = 1\n\
  \   A                                                                          \
  \  0.10                                    0\n   B                             \
  \                                               0.80                           \
  \         1\n   C                                                              \
  \              0.60                                    0\n   D                 \
  \                                                           0.20               \
  \                     0\n\n                                                    \
  \              1 X\n                                                  Brier score\
  \ =       (pi − yi )2 .\n                                                      \
  \            N i\n Calculate the model’s Brier score. Then calculate the score for\
  \ a supplied historical baseline that\n predicts 0.25 for every loan. Which is lower?\
  \ Which loan contributes most to the model’s\n error?"
