learning:
  title: Check Probability Error
  scenario: A model predicts default probabilities for loans whose outcomes are now
    known. A historical baseline assigns the same supplied probability to every loan.
  task: Calculate each squared probability error and the mean Brier score. Compare
    with the baseline and identify the largest contribution.
  interpretation: A lower Brier score means better probability accuracy on this evaluated
    sample. One non-default with a high predicted probability does not by itself establish
    miscalibration.
  summary: 'Model Brier score: {brier}; constant baseline: {baseline}. Largest individual
    squared error: {largest}.'
