  workedArithmetic:
  - Model squared errors are [(0.10 − 0)², (0.80 − 1)², (0.60 − 0)², (0.20 − 0)²]
    = [0.01, 0.04, 0.36, 0.04].
  - Model Brier score = (0.01 + 0.04 + 0.36 + 0.04) / 4 = 0.1125.
  - The constant 0.25 baseline gives squared errors [0.0625, 0.5625, 0.0625, 0.0625],
    so Brier = 0.75/4 = 0.1875. Loan C contributes the largest model error, 0.36.
