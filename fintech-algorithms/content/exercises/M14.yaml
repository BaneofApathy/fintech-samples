learning:
  title: Do the Probabilities Match Outcomes?
  scenario: Loans are grouped into risk bands. Each band has a loan count, mean predicted
    default probability and observed defaults. All loans share the supplied loss per
    default.
  task: Calculate expected defaults and observed rates by band, observed-minus-predicted
    gaps, totals and expected versus realized loss. Plot predicted probability against
    observed rate.
  interpretation: Mean probability × group size equals the sum of its individual probabilities.
    A single loan’s binary outcome cannot establish calibration; assess frequencies,
    uncertainty and stability across cases.
  summary: 'Expected loss: {EL}; realized loss: {realized}. Realized minus expected
    loss: {difference}.'
  labels: *id005
  steps:
