solutionPages:
- page: 317
  title: Calibration
  text: " Calibration\n\n   M14 | Worked solution — Do the Probabilities Match Outcomes?\n\
    \n1. Expected defaults: 100(0.05) = 5; 100(0.10) = 10; 100(0.20) = 20. Total 35.\n\
    2. Observed rates: 3/100 = 3%, 10/100 = 10%, and 30/100 = 30%. Total actual defaults\
    \ 43.\n3. Largest understatement: The high band predicts 20% but observes 30%:\
    \ 10 percentage\n   points, or 10 additional defaults.\n4. Loss comparison:\n\
    \                                                  Expected loss = 35(4,000) =\
    \ $140,000.\n                                                  Realized loss =\
    \ 43(4,000) = $172,000.\n      Difference: $32,000.\n5. Plot (predicted, observed):\
    \ (5%, 3%), (10%, 10%), (20%, 30%)."
  paragraphs:
  - Calibration
  - M14 | Worked solution — Do the Probabilities Match Outcomes?
  - '1. Expected defaults: 100(0.05) = 5; 100(0.10) = 10; 100(0.20) = 20. Total 35.
    2. Observed rates: 3/100 = 3%, 10/100 = 10%, and 30/100 = 30%. Total actual defaults
    43. 3. Largest understatement: The high band predicts 20% but observes 30%: 10
    percentage points, or 10 additional defaults. 4. Loss comparison: Expected loss
    = 35(4,000) = $140,000. Realized loss = 43(4,000) = $172,000. Difference: $32,000.
    5. Plot (predicted, observed): (5%, 3%), (10%, 10%), (20%, 30%).'
