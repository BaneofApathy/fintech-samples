  readAloud:
  - For each band, multiply loan count by mean predicted probability for expected
    defaults. Divide observed defaults by loan count for observed default rate. Multiply
    total default counts by the fixed loss amount to compare losses. Plot mean predicted
    probability on the horizontal axis and observed frequency on the vertical axis.
    Perfect sample agreement would lie on the diagonal where the two are equal.
  workedExplanation:
  - 'The highest band understates observed risk in this sample, affecting the expected-loss
    calculation. The sample does not establish a permanent calibration error; uncertainty,
    time stability, and larger validation samples still matter. '
  - Mean probability times group size equals the sum of individual probabilities,
    so it is appropriate for the expected count. Individual loans still default or
    do not default; a probability is evaluated by frequencies across cases, not by
    demanding that every single outcome match it exactly.
  workedArithmetic:
  - Expected defaults = [100 × 0.05, 100 × 0.10, 100 × 0.20] = [5, 10, 20]; total
    = 35.
  - Observed rates = [3/100, 10/100, 30/100] = [3%, 10%, 30%]; actual defaults = 3
    + 10 + 30 = 43.
  - Observed-minus-predicted gaps are [−2, 0, 10] percentage points. Calibration points
    are (5%, 3%), (10%, 10%), (20%, 30%).
  - Expected loss = 35 × $4,000 = $140,000; realized loss = 43 × $4,000 = $172,000;
    difference = $32,000.
