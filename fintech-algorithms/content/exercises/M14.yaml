    verbatim: true
interpretationPages:
- page: 318
  title: Calibration
  text: " Calibration\n\n   M14 | Interpretation\n\n What the answer means\n The highest\
    \ band understates observed risk in this sample, affecting the expected-loss\n\
    \ calculation. The sample does not establish a permanent calibration error; uncertainty,\
    \ time\n stability, and larger validation samples still matter.\n Why these steps\
    \ matter\n Mean probability times group size equals the sum of individual probabilities,\
    \ so it is appropriate\n for the expected count. Individual loans still default\
    \ or do not default; a probability is evaluated\n by frequencies across cases,\
    \ not by demanding that every single outcome match it exactly."
  paragraphs:
  - Calibration
  - M14 | Interpretation
  - What the answer means The highest band understates observed risk in this sample,
    affecting the expected-loss calculation. The sample does not establish a permanent
    calibration error; uncertainty, time stability, and larger validation samples
    still matter. Why these steps matter Mean probability times group size equals
    the sum of individual probabilities, so it is appropriate for the expected count.
    Individual loans still default or do not default; a probability is evaluated by
    frequencies across cases, not by demanding that every single outcome match it
    exactly.
