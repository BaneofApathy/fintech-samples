      hints: *id009
      unit: ''
    actualTotal:
      title: Total actual defaults
      hints: *id010
      unit: ''
    EL:
      title: Probability-based expected loss
      hints: *id011
      unit: $
    realized:
      title: Realized default loss
      hints: *id012
      unit: $
    difference:
