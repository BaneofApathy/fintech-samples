    divide by run count, and take the square root. Add and subtract 1.96 standard
    errors for the stated normal approximation. Runs are independent, equally weighted,
    and generated under one fixed simulation model. This approximation is not suitable
    for every very small or near-zero/near-one breach sample.
  workedExplanation:
  - 'Quadrupling independent runs halves simulation noise. It does not validate assumed
    default probabilities, recoveries, or correlations. This interval describes uncertainty
    in the estimated probability conditional on the specified simulation model, not
    uncertainty about whether that model is realistic. '
  - A single run says breach or no breach. More runs make the average of those binary
    outcomes more stable. With the probability held fixed, multiplying run count by
    four divides its standard error by two because the denominator enters under a
    square root. It does not halve uncertainty about whether the financial assumptions
    are correct.
  workedArithmetic:
  - Estimated breach probability = 250/2,500 = 0.10 = 10%.
  - SE = √(0.10 × 0.90 / 2,500) = √0.000036 = 0.006, or 0.6 percentage points.
  - Approximate 95% bounds = 0.10 ± 1.96 × 0.006 = 0.10 ± 0.01176, giving [8.824%,
    11.176%].
  - At 10,000 runs, SE = √(0.09/10,000) = 0.003, or 0.3 percentage points.
