interpretationPages:
- page: 531
  title: Monte Carlo Error
  text: " Monte Carlo Error\n\n   M34 | Interpretation\n\n What the answer means\n\
    \ Quadrupling independent runs halves simulation noise. It does not validate assumed\
    \ default\n probabilities, recoveries, or correlations. This interval describes\
    \ uncertainty in the estimated\n probability conditional on the specified simulation\
    \ model, not uncertainty about whether\n that model is realistic.\n Why these\
    \ steps matter\n A single run says breach or no breach. More runs make the average\
    \ of those binary outcomes\n more stable. With the probability held fixed, multiplying\
    \ run count by four divides its standard\n error by two because the denominator\
    \ enters under a square root. It does not halve uncertainty\n about whether the\
    \ financial assumptions are correct."
  paragraphs:
  - Monte Carlo Error
  - M34 | Interpretation
  - What the answer means Quadrupling independent runs halves simulation noise. It
    does not validate assumed default probabilities, recoveries, or correlations.
    This interval describes uncertainty in the estimated probability conditional on
    the specified simulation model, not uncertainty about whether that model is realistic.
    Why these steps matter A single run says breach or no breach. More runs make the
    average of those binary outcomes more stable. With the probability held fixed,
    multiplying run count by four divides its standard error by two because the denominator
    enters under a square root. It does not halve uncertainty about whether the financial
    assumptions are correct.
  source:
    pages:
    - 531
    verbatim: true
