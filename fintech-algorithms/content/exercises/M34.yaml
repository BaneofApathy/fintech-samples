solutionPages:
- page: 530
  title: Monte Carlo Error
  text: " Monte Carlo Error\n\n   M34 | Worked solution — How Much of the Estimate\
    \ Is Simulation Noise?\n\n1. Shortfall estimate: p̂ = 250/2,500 = 0.10 = 10%.\n\
    2. Standard error:                                       q                  √\n\
    \                                                  SE =    0.10(0.90)/2,500 =\
    \ 0.000036 = 0.006.\n      This is 0.6 percentage points, not 0.006 percentage\
    \ points.\n3. Approximate interval: 0.10 ± 1.96(0.006) = 0.10 ± 0.01176. Result:\
    \ 8.824%–11.176%.\n                         p\n4. At 10,000 runs: SE =     0.09/10,000\
    \ = 0.003, or 0.3 percentage points."
  paragraphs:
  - Monte Carlo Error
  - M34 | Worked solution — How Much of the Estimate Is Simulation Noise?
  - '1. Shortfall estimate: p̂ = 250/2,500 = 0.10 = 10%. 2. Standard error: q √ SE
    = 0.10(0.90)/2,500 = 0.000036 = 0.006. This is 0.6 percentage points, not 0.006
    percentage points. 3. Approximate interval: 0.10 ± 1.96(0.006) = 0.10 ± 0.01176.
    Result: 8.824%–11.176%. p 4. At 10,000 runs: SE = 0.09/10,000 = 0.003, or 0.3
    percentage points.'
