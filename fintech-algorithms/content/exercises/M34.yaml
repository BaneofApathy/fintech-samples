learning:
  title: How Much of the Estimate Is Simulation Noise?
  scenario: Independent, equally weighted simulation runs estimate the probability
    of losses exceeding a reserve under one fixed model.
  task: Divide breaches by runs, calculate SE = sqrt(p × (1 − p) / N), and form the
    approximate 95% interval p ± 1.96 × SE. Recalculate SE for the new run count with
    p held fixed.
  interpretation: More independent runs reduce Monte Carlo error. The interval is
    conditional on the simulation model; it does not include uncertainty about default
    probabilities, recoveries or correlations. The normal approximation is unsuitable
    for some small or extreme-probability samples.
  summary: 'Breach estimate: {p}. Approximate interval: {lower} to {upper}. Standard
    error changes from {SE} to {newSE}.'
