learning:
  title: How Far Does the Fund Wander from Its Benchmark?
  scenario: A fund and benchmark have matching periodic returns. Active return is
    fund return minus benchmark return. Use sample standard deviation with denominator
    n − 1.
  task: Calculate active returns, their mean, squared deviations, periodic tracking
    error and annualized tracking error. Assume stable, uncorrelated periods for square-root-of-periods
    annualization.
  interpretation: Tracking error measures variability around mean active return. It
    does not tell whether the fund outperformed. A short sample and the annualization
    assumptions limit its use as a risk estimate.
  summary: 'Periodic tracking error: {monthly}; annualized tracking error: {annual}.
    Mean active return: {mean}.'
