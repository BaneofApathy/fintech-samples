solutionPages:
- page: 512
  title: Tracking Error
  text: " Tracking Error\n\n   M32c | Worked solution — How Far Does the Fund Wander\
    \ from Its Benchmark?\n\n1. Active returns: [1, −1, 1, −1] percentage points.\n\
    2. Mean active return: (1 − 1 + 1 − 1)/4 = 0.\n3. Squared deviations: 1, 1, 1,\
    \ 1; sum = 4 squared percentage points.\n4. Monthly sample tracking error:\n \
    \                           q             q\n                               4/(4\
    \ − 1) = 4/3 = 1.1547%.\n5. Annualized estimate under the stated assumptions:\n\
    \                                           √\n                              \
    \  1.1547% × 12 = 4.00%."
  paragraphs:
  - Tracking Error
  - M32c | Worked solution — How Far Does the Fund Wander from Its Benchmark?
