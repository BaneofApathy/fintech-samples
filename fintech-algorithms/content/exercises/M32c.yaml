  workedExplanation:
  - 'Tracking error describes the variability of benchmark-relative returns—not a
    4% loss or 4% underperformance. Mean monthly active return is zero here, yet active
    risk is positive. Annualization and this four-observation estimate should not
    be treated as reliable without more data. '
  - Active returns of +1 and −1 percentage point average to zero but still fluctuate.
    Tracking error measures that fluctuation. Computing the standard deviation of
    the fund’s returns alone would answer a different question about total risk rather
    than benchmark-relative risk.
  workedArithmetic:
  - Active returns = [0.03 − 0.02, 0.01 − 0.02, 0.04 − 0.03, 0 − 0.01] = [0.01, −0.01,
    0.01, −0.01]. Mean = 0.
  - Squared-deviation sum = 0.01² + (−0.01)² + 0.01² + (−0.01)² = 0.0004.
  - Monthly tracking error = √(0.0004 / (4 − 1)) ≈ 0.011547 = 1.1547%.
  - Annualized tracking error = 0.011547 × √12 ≈ 0.04 = 4%, under the stated uncorrelated-period
    assumption.
