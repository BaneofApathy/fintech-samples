interpretationPages:
- page: 205
  title: Confusion Matrix
  text: " Confusion Matrix\n\n   M01 | Interpretation\n\n What the answer means\n\
    \ The detector finds 15 frauds, misses 5, interrupts 35 legitimate transactions,\
    \ and correctly\n passes 945. These are counts at one chosen threshold, not probabilities.\n\
    \ Why these steps matter\n The total number of flags includes false alarms. The\
    \ total number of actual frauds includes\n missed fraud. Those two totals are\
    \ usually different, which is why precision and recall require\n different denominators."
  paragraphs:
