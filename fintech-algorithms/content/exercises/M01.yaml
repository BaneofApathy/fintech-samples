id: M01
title: Count the Four Outcomes
minutes: 5
kind: measure
parent: confusion-matrix
question: "A fraud detector processes 1,000 transactions. Later investigation establishes\
  \ that 20 were\n fraud.\n The detector flagged 50 transactions. Of the flagged transactions,\
  \ 15 were fraud.\n Treat fraud as the positive class and a flag as a positive prediction.\n\
  1. Fill in all four cells: true positives, false positives, false negatives, and\
  \ true negatives.\n2. Verify that the four counts add to 1,000.\n3. How many legitimate\
  \ customers were interrupted, and how many frauds were missed?\n   Decision    \
  \                                    Actually fraud                    Actually\
  \ legitimate\n   Flagged                                                       ?\
  \                                     ?\n   Not flagged                        \
  \                           ?                                     ?"
