solutionPages:
- page: 204
  title: Confusion Matrix
  text: " Confusion Matrix\n\n   M01 | Worked solution — Count the Four Outcomes\n\
    \n1. True positives: The 15 confirmed frauds among the flags give T P = 15.\n\
    2. False positives: F P = 50 − 15 = 35.\n3. False negatives: F N = 20 − 15 = 5.\n\
    4. True negatives: There are 1,000 − 20 = 980 legitimate transactions, so\n  \
    \ T N = 980 − 35 = 945.\n   Decision                                       Actually\
    \ fraud                   Actually legitimate\n   Flagged                    \
    \                               15                                    35\n   Not\
    \ flagged                                                 5                  \
    \                945\n Check: 15 + 35 + 5 + 945 = 1,000."
  paragraphs:
  - Confusion Matrix
  - M01 | Worked solution — Count the Four Outcomes
  - '1. True positives: The 15 confirmed frauds among the flags give T P = 15. 2.
    False positives: F P = 50 − 15 = 35. 3. False negatives: F N = 20 − 15 = 5. 4.
    True negatives: There are 1,000 − 20 = 980 legitimate transactions, so T N = 980
    − 35 = 945. Decision Actually fraud Actually legitimate Flagged 15 35 Not flagged
    5 945 Check: 15 + 35 + 5 + 945 = 1,000.'
