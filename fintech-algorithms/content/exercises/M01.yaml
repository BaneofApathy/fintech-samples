formulaPages:
- page: 200
  title: Confusion Matrix
  text: " Confusion Matrix\n\n   M01 | Formula explained (1/1)\n\n Question: How many\
    \ decisions fall into each of the four possible outcomes?\n                  \
    \                     T P + F N = all actual frauds,     T P + F P = all flags,\n\
    \                            T N + F P = all legitimate cases,           N = T\
    \ P + F P + F N + T N.\n Read it aloud: Actual frauds are caught or missed. Flags\
    \ are correct alerts or false alerts.\n Every transaction belongs to exactly one\
    \ cell.\n From the supplied totals, calculate the known caught frauds first, then\
    \ subtract to obtain the\n other three cells.\n A confusion matrix is a table\
    \ of counts, not a prediction formula. Always identify which\n outcome is called\
    \ positive before filling it in."
