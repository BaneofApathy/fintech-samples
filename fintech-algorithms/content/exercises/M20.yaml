interpretationPages:
- page: 375
  title: MAE
  text: " MAE\n\n   M20 | Interpretation\n\n What the answer means\n The model misses\
    \ actual settlement outflow by $12,500 per day on average, versus $22,500\n for\
    \ the baseline in this sample. The smaller miss is not automatically an equal\
    \ dollar saving:\n MAE measures forecast error, not funding cost. It also does\
    \ not show whether the forecast was\n too high or too low.\n Why these steps matter\n\
    \ Using absolute differences stops overforecasts and underforecasts from cancelling\
    \ each other.\n The mean remains in the financial target’s units, which makes\
    \ it interpretable. It does not\n distinguish the funding consequences of a shortage\
    \ from those of excess cash."
  paragraphs:
  - MAE
  - M20 | Interpretation
  - 'What the answer means The model misses actual settlement outflow by $12,500 per
    day on average, versus $22,500 for the baseline in this sample. The smaller miss
    is not automatically an equal dollar saving: MAE measures forecast error, not
    funding cost. It also does not show whether the forecast was too high or too low.
    Why these steps matter Using absolute differences stops overforecasts and underforecasts
    from cancelling each other. The mean remains in the financial target’s units,
    which makes it interpretable. It does not distinguish the funding consequences
    of a shortage from those of excess cash.'
