solutionPages:
- page: 573
  title: Latency
  text: " Latency\n\n   M39a | Worked solution — The Average Can Pass While the Service\
    \ Fails\n\n1. Total latency: 95(40) + 4(180) + 1(1,000) = 3,800 + 720 + 1,000\
    \ = 5,520 ms.\n2. Mean: 5,520/100 = 55.2 ms.\n3. p95: rank ⌈0.95(100)⌉ = 95; latency\
    \ = 40 ms.\n4. p99: rank 99 lies among the four 180 ms requests; p99 = 180 ms.\n\
    5. Deadline failures: 4 + 1 = 5 requests; 5/100 = 5%. Only 95% finish within 100\
    \ ms."
  paragraphs:
  - Latency
  - M39a | Worked solution — The Average Can Pass While the Service Fails
  - '1. Total latency: 95(40) + 4(180) + 1(1,000) = 3,800 + 720 + 1,000 = 5,520 ms.
