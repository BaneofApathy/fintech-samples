learning:
  title: The Average Can Pass While the Service Fails
  scenario: Requests are grouped by eventual response time. A response after the caller’s
    deadline is a failure even if it eventually arrives; a response at the deadline
    is on time.
  task: Calculate total response-time sum, mean, nearest-rank p95 and p99, late fraction
    and on-time fraction. The service objective is 99% on time.
  interpretation: Weight each duration by its request count. The mean and one percentile
    can look good while the deadline objective fails. Use the stated percentile and
    timeout conventions when comparing services.
  summary: 'Mean latency: {mean}; p95: {p95}; p99: {p99}. On-time share: {onTime}.'
