  workedExplanation:
  - 'The mean and p95 look fast, but the 99%-within-100-ms objective is missed. Five
    payment decisions arrive too late for the caller. The percentile convention and
    treatment of late responses are stated explicitly so the result can be reproduced. '
  - The 95 fast requests dominate the average and determine p95. The next four requests
    determine p99 and create deadline failures along with the slowest request. Averaging
    the three latency values without their request counts would give each group the
    wrong weight.
  workedArithmetic:
  - Response-time sum = 95 × 40 + 4 × 180 + 1 × 1,000 = 5,520 ms. Mean = 5,520/100
    = 55.2 ms.
  - p95 is request rank 95, at 40 ms. p99 is rank 99, among the 180 ms requests.
  - Late requests = 4 + 1 = 5. Deadline-failure rate = 5/100 = 5%; on-time rate =
    95%, below the 99% objective.
