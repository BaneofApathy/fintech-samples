interpretationPages:
- page: 574
  title: Latency
  text: " Latency\n\n   M39a | Interpretation\n\n What the answer means\n The mean\
    \ and p95 look fast, but the 99%-within-100-ms objective is missed. Five payment\n\
    \ decisions arrive too late for the caller. The percentile convention and treatment\
    \ of late\n responses are stated explicitly so the result can be reproduced.\n\
    \ Why these steps matter\n The 95 fast requests dominate the average and determine\
    \ p95. The next four requests\n determine p99 and create deadline failures along\
    \ with the slowest request. Averaging the three\n latency values without their\
    \ request counts would give each group the wrong weight."
  paragraphs:
  - Latency
