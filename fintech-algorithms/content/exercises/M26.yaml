learning:
  title: Does the Customer Belong in This Segment?
  scenario: Customers have distances measured in one fixed, scaled feature space.
    For each customer, a is average distance to its assigned cluster and b is the
    smallest average distance to another cluster.
  task: Calculate each silhouette score as (b − a) / max(a, b), then their mean.
  interpretation: Positive scores mean the assigned cluster is closer on average.
    Negative scores suggest inspecting another cluster assignment. These geometric
    relationships do not establish profitability or response to an offer.
  summary: 'Customer silhouette scores: {scores}; mean: {mean}.'
  labels: *id004
  steps:
    scores:
      title: Silhouette score for each customer
      hints: *id005
      unit: ''
    mean:
      title: Mean silhouette score
      hints: *id006
      unit: ''
  readAloud:
  - Subtract average distance to the assigned cluster from average distance to the
    closest alternative cluster; divide by the larger distance. Average the customer
    scores for a sample summary. “Closest alternative cluster” means the smallest
    average distance to that cluster’s members, not the distance to the single nearest
    other customer. Distances use one fixed scaled feature space throughout.
  workedExplanation:
  - 'A is closer to its own segment. B lies near a segment boundary. C is, on average,
    closer to another segment than to its assigned one, so its assignment needs inspection.
    The near-zero mean suggests weak separation for these customers. None of these
    values demonstrates that the segments improve marketing response, retention, or
    profitability. '
  - Positive, zero, and negative values indicate different geometric relationships.
    Those signs do not mean profitable, neutral, and unprofitable customers. Geometry
    is only one part of validating whether a segmentation is useful.
  workedArithmetic:
  - A’s silhouette = (5 − 2) / max(2, 5) = 3/5 = 0.60.
  - B’s silhouette = (4 − 4) / 4 = 0. C’s silhouette = (3 − 6) / 6 = −0.50.
  - Mean = (0.60 + 0 − 0.50) / 3 ≈ 0.0333.
