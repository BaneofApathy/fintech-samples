question: "A bank evaluates three customers’ segment assignments using a fixed, scaled\
  \ feature space.\n Here, a is average distance to other customers in the assigned\
  \ cluster. b is the smallest\n average distance to any other cluster.\n   Customer\
  \                                                               a              \
  \         b\n   A                                                              \
  \        2                       5\n   B                                       \
  \                               4                       4\n   C                \
  \                                                      6                       3\n\
  \n                                                        b−a\n                \
  \                                  s=             .\n                          \
  \                             max(a, b)\n Calculate each silhouette score and their\
  \ mean. Which assignment deserves inspection? Does a\n good score prove that a segment\
  \ will respond to a marketing offer?"
