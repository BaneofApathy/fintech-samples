id: S04
title: A Better Average Can Hide Worse Executions
minutes: 8
kind: skill
parent: reinforcement-learning
question: "Ten completed orders have total execution costs in basis points:\n    \
  \                                        [2, 3, 4, 5, 6, 7, 8, 9, 20, 30].\n A baseline\
  \ costs 12 basis points on every one of the same ten orders.\n Calculate the learned\
  \ policy’s mean, nearest-rank p90 and p95, and mean cost of its worst\n 20% of orders.\
  \ Compare the mean and worst-20% result with the baseline. Use percentile rank\n\
  \ ⌈pN ⌉. Which policy is better depends on what business preference?"
