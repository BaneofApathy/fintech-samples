solutionPages:
- page: 178
  title: Tail Slippage
  text: " Tail Slippage\n\n   S04 | Worked solution — A Better Average Can Hide Worse\
    \ Executions\n\n1. Mean: total = 2 + 3 + 4 + 5 + 6 + 7 + 8 + 9 + 20 + 30 = 94;\
    \ mean = 94/10 = 9.4 bps.\n2. p90: rank ⌈0.90(10)⌉ = 9; result = 20 bps.\n3. p95:\
    \ rank ⌈0.95(10)⌉ = 10; result = 30 bps.\n4. Worst 20%: two largest costs, 20\
    \ and 30; average = 25 bps.\n5. Baseline: mean and worst-20% average are both\
    \ 12 bps."
