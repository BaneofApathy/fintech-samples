  workedExplanation:
  - 'The learned policy improves average cost by 2.6 bps, but its worst fifth costs
    13 bps more than the baseline’s worst fifth. Choosing between them requires an
    explicit tolerance for execution tail risk. Ten orders are enough for arithmetic,
    not for a reliable estimate of future tail performance. '
  - The mean can improve when many orders get slightly cheaper even as a few become
    much more expensive. Percentiles describe thresholds and the tail mean describes
    the average beyond the selected worst-fraction boundary. Neither the small sample
    nor a lower overall mean establishes acceptable future tail behavior.
  workedArithmetic:
  - Total cost = 2 + 3 + 4 + 5 + 6 + 7 + 8 + 9 + 20 + 30 = 94 bps; mean = 94/10 =
    9.4 bps.
  - p90 uses rank ceiling(0.90 × 10) = 9, giving 20 bps. p95 uses rank 10, giving
    30 bps.
  - 'The worst 20% contains two orders: (20 + 30) / 2 = 25 bps.'
  - Mean saving = 12 − 9.4 = 2.6 bps. Extra tail cost = 25 − 12 = 13 bps.
