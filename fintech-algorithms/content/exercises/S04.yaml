interpretationPages:
- page: 179
  title: Tail Slippage
  text: " Tail Slippage\n\n   S04 | Interpretation\n\n What the answer means\n The\
    \ learned policy improves average cost by 2.6 bps, but its worst fifth costs 13\
    \ bps more than\n the baseline’s worst fifth. Choosing between them requires an\
    \ explicit tolerance for execution tail\n risk. Ten orders are enough for arithmetic,\
    \ not for a reliable estimate of future tail performance.\n Why these steps matter\n\
    \ The mean can improve when many orders get slightly cheaper even as a few become\
    \ much more\n expensive. Percentiles describe thresholds and the tail mean describes\
    \ the average beyond the\n selected worst-fraction boundary. Neither the small\
    \ sample nor a lower overall mean establishes\n acceptable future tail behavior."
  paragraphs:
