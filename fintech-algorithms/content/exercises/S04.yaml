learning:
  title: A Better Average Can Hide Worse Executions
  scenario: Completed orders have equal weight. Costs are measured in basis points.
    A baseline incurs the same supplied cost on every order.
  task: Calculate mean cost, nearest-rank p90 and p95, and mean cost in the supplied
    worst-tail fraction. Compare average and tail cost with the baseline. Use percentile
    rank ceiling(p × number of orders).
  interpretation: A policy can improve average cost while making its worst executions
    more expensive. Choose the comparison that reflects the desk’s risk tolerance;
    a small sample is not a reliable future tail estimate.
  summary: 'Mean cost: {mean}. Tail mean: {tailMean}. Mean saving versus baseline:
    {meanSaving}; extra tail cost: {tailExtra}.'
