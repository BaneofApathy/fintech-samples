learning:
  title: Expose the Weak Class
  scenario: 'A sentiment classifier has three classes in this order: neutral, positive,
    negative. Its confusion matrix is listed row by row, with actual classes as rows
    and predicted classes as columns. Every record has one actual and one predicted
    label.'
  task: Calculate per-class F1, macro-F1, support-weighted F1 and micro-F1. Also sum
    TP, FP and FN over all three one-versus-rest class comparisons.
  interpretation: Macro-F1 gives each class equal weight; weighted F1 uses actual
    class counts. Micro-F1 pools counts and equals accuracy for this single-label
    setup. Inspect per-class results to find a missed minority class.
  summary: 'Class F1 scores: {perClass}. Macro: {macro}; weighted: {weighted}; micro:
    {micro}.'
