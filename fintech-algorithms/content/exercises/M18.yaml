  - '2. Macro-F1: (0.7619 + 0.7500 + 0)/3 = 0.5040. 3. Weighted-F1: [10(0.7619) +
    4(0.75) + 2(0)]/16 = 0.6637. 4. Micro totals: T P = 11, F P = 5, F N = 5. F 1micro
