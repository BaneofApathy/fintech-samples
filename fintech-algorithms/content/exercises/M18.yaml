interpretationPages:
- page: 358
  title: Multi-Class F1
  text: " Multi-Class F1\n\n   M18 | Interpretation\n\n What the answer means\n The\
    \ classifier catches none of the negative statements. Micro-F1 and weighted-F1\
    \ conceal\n more of that weakness because neutral examples dominate. Here micro-F1\
    \ equals accuracy,\n 11/16, because every record has exactly one label.\n Why\
    \ these steps matter\n A wrong neutral-to-negative prediction adds a false negative\
    \ to neutral and a false positive to\n negative. The same record therefore appears\
    \ in two pooled error counts. Micro-F1 accounts for\n that convention; it must\
    \ not be calculated by simply averaging the class F1 scores."
  paragraphs:
  - Multi-Class F1
  - M18 | Interpretation
  - What the answer means The classifier catches none of the negative statements.
    Micro-F1 and weighted-F1 conceal more of that weakness because neutral examples
    dominate. Here micro-F1 equals accuracy, 11/16, because every record has exactly
    one label. Why these steps matter A wrong neutral-to-negative prediction adds
    a false negative to neutral and a false positive to negative. The same record
    therefore appears in two pooled error counts. Micro-F1 accounts for that convention;
    it must not be calculated by simply averaging the class F1 scores.
  source:
    pages:
    - 358
    verbatim: true
