  readAloud:
  - Pick one class. Count records correctly assigned to it, records incorrectly assigned
    to it, and records from it missed by the classifier. Apply the binary F1 formula
    to those counts. In the confusion matrix, rows are actual labels and columns are
    predicted labels. A diagonal cell is that class’s true-positive count. Its other
    column entries are false positives; its other row entries are false negatives.
  - Macro gives each class equal weight. Weighted F1 uses the class’s actual sample
    count as its weight. Micro pools the decision counts first and calculates one
    F1. The example has one true and one predicted label per record and includes every
    class. Under that setup, micro-F1 equals accuracy.
  workedExplanation:
  - 'The classifier catches none of the negative statements. Micro-F1 and weighted-F1
    conceal more of that weakness because neutral examples dominate. Here micro-F1
    equals accuracy, 11/16, because every record has exactly one label. '
  - A wrong neutral-to-negative prediction adds a false negative to neutral and a
    false positive to negative. The same record therefore appears in two pooled error
    counts. Micro-F1 accounts for that convention; it must not be calculated by simply
    averaging the class F1 scores.
  workedArithmetic:
  - Neutral counts (TP, FP, FN) = (8, 3, 2), so F1 = 16/21 ≈ 0.7619. Positive counts
    (3, 1, 1) give F1 = 6/8 = 0.75. Negative counts (0, 1, 2) give F1 = 0.
  - Macro-F1 = (16/21 + 0.75 + 0) / 3 ≈ 0.5040.
  - Weighted-F1 = [10 × (16/21) + 4 × 0.75 + 2 × 0] / 16 ≈ 0.6637.
  - Pooled counts are TP = 11, FP = 5, FN = 5. Micro-F1 = 22 / (22 + 5 + 5) = 0.6875.
