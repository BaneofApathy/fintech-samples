  workedArithmetic:
  - Overlap rows are [2, 1] and [1, 2]; both row totals and column totals are [3,
    3]. Total customers = 6, so T = 6 × 5 / 2 = 15 pairs.
  - 'Within-cell pairs: S = 1 + 0 + 0 + 1 = 2. Row pairs R = 3 + 3 = 6; column pairs
    C = 3 + 3 = 6.'
