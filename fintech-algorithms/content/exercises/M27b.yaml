solutionPages:
- page: 443
  title: Adjusted Rand Index
  text: " Adjusted Rand Index\n\n   M27b | Worked solution — Did the Same Segments\
    \ Reappear?\n\n1. Build the overlap table.\n   Original / rerun              \
    \                 X                            Y             Total\n   A     \
    \                                         2                                1 \
    \            3\n   B                                              1          \
    \                      2             3\n   Total                             \
    \             3                                3             6\n\n2. Within-cell\
    \ pairs: S = 1 + 0 + 0 + 1 = 2.\n3. Row and column pairs: R = 3 + 3 = 6; C = 3\
    \ + 3 = 6.\n4. Chance adjustment: RC/T = 36/15 = 2.4.\n5. ARI: (2 − 2.4)/(6 −\
    \ 2.4) = −0.4/3.6 = −0.1111."
  paragraphs:
  - Adjusted Rand Index
  - M27b | Worked solution — Did the Same Segments Reappear?
  - 1. Build the overlap table. Original / rerun X Y Total A 2 1 3 B 1 2 3 Total 3
    3 6
  - '2. Within-cell pairs: S = 1 + 0 + 0 + 1 = 2. 3. Row and column pairs: R = 3 +
    3 = 6; C = 3 + 3 = 6. 4. Chance adjustment: RC/T = 36/15 = 2.4. 5. ARI: (2 − 2.4)/(6
    − 2.4) = −0.4/3.6 = −0.1111.'
