learning:
  title: Did the Same Segments Reappear?
  scenario: Two clustering runs are compared with a 2 × 2 overlap table, listed row
    by row. A cell counts customers sharing one original cluster and one rerun cluster.
  task: For any count n, the number of unordered pairs is n(n − 1)/2. Sum pair counts
    over cells (S), rows (R), columns (C), and all customers (T). Compute ARI = (S
    − RC/T) / ((R + C)/2 − RC/T).
  interpretation: Cluster names are arbitrary. ARI compares membership pairs and adjusts
    for a reference holding cluster sizes fixed. A negative result is below that reference,
    not negative classification accuracy.
