learning:
  title: Check Economics and Capacity
  scenario: Two fraud thresholds are evaluated on the same population. Each missed
    fraud and false alert has a stated cost. Other outcomes have zero incremental
    cost in this simplified loss table. Every flag requires review.
  task: Calculate modeled cost and review volume for both thresholds. Compare the
    lower-cost choice with daily review capacity, including any excess for B.
  interpretation: A lower computed loss is useful only if the required reviews can
    actually be delivered. This example prices false alerts, not every review. Preserve
    that convention when comparing costs.
  summary: 'Modeled costs: A {costA}, B {costB}. Review volumes: A {volumeA}, B {volumeB}.
    B’s excess over capacity: {excess}.'
