  readAloud:
  - Add the dollar cost of missed frauds and false alerts. Separately count all alerts
    and require that count to fit daily review capacity. The example prices only false-negative
    and false-positive errors. Correct decisions have zero incremental cost in this
    particular loss table. This is distinct from pricing every review. Preserve the
    stated cost convention when comparing the two thresholds.
  workedExplanation:
  - 'B has lower modeled error cost but is not feasible under the stated review policy.
    A is the feasible choice among these two today. B requires additional capacity
    or a separately tested workflow—not an assumption that unreviewed alerts still
    prevent fraud. '
  - A lower computed cost assumes the required interventions can be delivered. Once
    the review queue exceeds capacity, the loss calculation is no longer enough to
    justify that operating point. Unreviewed alerts must not be credited as prevented
    fraud.
  workedArithmetic:
  - A’s cost = 5 × $500 + 35 × $4 = $2,640. B’s cost = 2 × $500 + 82 × $4 = $1,328.
  - Modeled saving from B = $2,640 − $1,328 = $1,312.
  - A requires 15 + 35 = 50 reviews; B requires 18 + 82 = 100. With capacity 75, A
    fits and B exceeds capacity by 100 − 75 = 25.
