formulaPages:
- page: 338
  title: Expected Cost
  text: " Expected Cost\n\n   M17a | Formula explained (1/1)\n\n Question: Which threshold\
    \ has lower modeled error cost and can actually be operated?\n               \
    \                       C = cF N F N + cF P F P,   V = T P + F P,            V\
    \ ≤ H.\n Read it aloud: Add the dollar cost of missed frauds and false alerts.\
    \ Separately count all alerts\n and require that count to fit daily review capacity.\n\
    \ The example prices only false-negative and false-positive errors. Correct decisions\
    \ have zero\n incremental cost in this particular loss table.\n This is distinct\
    \ from pricing every review. Preserve the stated cost convention when comparing\n\
    \ the two thresholds."
