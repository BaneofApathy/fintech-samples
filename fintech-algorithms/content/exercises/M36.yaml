learning:
  title: Better Than the Baseline, Short of Hindsight
  scenario: A learned execution policy, TWAP baseline and best feasible hindsight
    schedule complete the same order. Each comparison includes the same cost components.
    Reward is negative cost and is undiscounted.
  task: Add policy costs, calculate cumulative reward, savings versus TWAP and regret
    versus hindsight. Convert savings and regret to basis points of order notional.
  interpretation: Beating a feasible baseline and matching hindsight are different
    comparisons. Hindsight has information unavailable to the live policy. Omitted
    costs or incomplete-order penalties can make a reward misleading.
