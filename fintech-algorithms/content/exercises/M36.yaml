solutionPages:
- page: 547
  title: Reward and Regret
  text: " Reward and Regret\n\n   M36 | Worked solution — Better Than the Baseline,\
    \ Short of Hindsight\n\n1. Policy total cost: 300 + 200 + 400 = $900.\n2. Cumulative\
    \ reward: −300 − 200 − 400 = −$900 in the chosen reward units.\n3. Improvement\
    \ over TWAP: 1,200 − 900 = $300.\n4. Hindsight regret: 900 − 700 = $200.\n5. One\
    \ basis point of this order: 1,000,000 × 0.0001 = $100. Improvement\n   = 300/100\
    \ = 3 bps; regret = 200/100 = 2 bps."
  paragraphs:
  - Reward and Regret
  - M36 | Worked solution — Better Than the Baseline, Short of Hindsight
  - '1. Policy total cost: 300 + 200 + 400 = $900. 2. Cumulative reward: −300 − 200
    − 400 = −$900 in the chosen reward units. 3. Improvement over TWAP: 1,200 − 900
    = $300. 4. Hindsight regret: 900 − 700 = $200. 5. One basis point of this order:
    1,000,000 × 0.0001 = $100. Improvement = 300/100 = 3 bps; regret = 200/100 = 2
    bps.'
  source:
