    - 547
    verbatim: true
interpretationPages:
- page: 548
  title: Reward and Regret
  text: " Reward and Regret\n\n   M36 | Interpretation\n\n What the answer means\n\
    \ The policy saves 3 basis points versus TWAP but costs 2 basis points more than\
    \ the hindsight\n schedule. Hindsight has information the live policy did not\
    \ possess. A less negative reward is\n better here; reward becomes economically\
    \ misleading if material costs or incomplete-order\n penalties are omitted.\n\
    \ Why these steps matter\n The policy can beat a realistic baseline while still\
    \ falling short of hindsight. Those are different\n comparisons and should not\
    \ be combined. The order-value denominator turns dollar differences\n into comparable\
    \ cost fractions, while the reward sign convention determines which numerical\n\
    \ direction is better."
  paragraphs:
  - Reward and Regret
  - M36 | Interpretation
