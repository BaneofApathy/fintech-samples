question: "A desk executes a $1 million order over three intervals. All compared schedules\
  \ complete the\n order. Costs include the same execution-cost components.\n   Interval\
  \                                       Learned policy cost\n   1              \
  \                                $300\n   2                                    \
  \          $200\n   3                                              $400\n Reward\
  \ equals negative cost, and rewards are undiscounted for this exercise. A TWAP\n\
  \ baseline costs $1,200. The best feasible schedule chosen with hindsight costs\
  \ $700.\n Calculate cumulative reward, dollar improvement over TWAP, and hindsight\
  \ regret. Express the\n last two values in basis points of order value. One basis\
  \ point is 0.0001 of the notional."
