solutionPages:
- page: 245
  title: Specificity and FPR
  text: " Specificity and FPR\n\n   M06 | Worked solution — Count Customer Interruptions\n\
    \n1. Specificity: 945/980 = 0.964286 = 96.43%.\n2. False-positive rate: 35/980\
    \ = 0.035714 = 3.57%.\n3. Check: 96.43% + 3.57% = 100% after rounding.\n4. Scale\
    \ to production:\n                                                  1,000,000(35/980)\
    \ ≈ 35,714 false alerts.\n5. Use the correct denominator: FPR asks what fraction\
    \ of legitimate activity was\n   disturbed. A denominator of all alerts would\
    \ answer a different question about queue quality."
  paragraphs:
  - Specificity and FPR
  - M06 | Worked solution — Count Customer Interruptions
  - '1. Specificity: 945/980 = 0.964286 = 96.43%. 2. False-positive rate: 35/980 =
    0.035714 = 3.57%. 3. Check: 96.43% + 3.57% = 100% after rounding. 4. Scale to
    production: 1,000,000(35/980) ≈ 35,714 false alerts. 5. Use the correct denominator:
    FPR asks what fraction of legitimate activity was disturbed. A denominator of
    all alerts would answer a different question about queue quality.'
  source:
    pages:
    - 245
    verbatim: true
interpretationPages:
- page: 246
  title: Specificity and FPR
  text: " Specificity and FPR\n\n   M06 | Interpretation\n\n What the answer means\n\
    \ A false-positive rate of about 3.57% would create roughly 35,714 interruptions\
    \ per million\n legitimate transactions, under the unchanged-rate assumption.\
    \ A small-looking rate can\n create a large operational burden.\n Why these steps\
    \ matter\n FPR divides false alerts by legitimate transactions. One minus precision\
    \ instead divides false\n alerts by all alerts. The same numerator can appear\
    \ in two metrics with very different business\n meanings because their denominators\
    \ differ."
  paragraphs:
  - Specificity and FPR
  - M06 | Interpretation
  - What the answer means A false-positive rate of about 3.57% would create roughly
    35,714 interruptions per million legitimate transactions, under the unchanged-rate
