learning:
  title: Count Customer Interruptions
  scenario: A detector passes some legitimate transactions and flags others incorrectly.
    You will project those rates onto a larger legitimate-transaction volume.
  task: Calculate specificity and false-positive rate, check their sum, then estimate
    false alerts at the supplied future volume. Assume the rate stays unchanged.
  interpretation: False-positive rate divides false alerts by actual legitimate transactions.
    One minus precision uses all alerts instead. The same numerator can answer a different
    question when the denominator changes.
