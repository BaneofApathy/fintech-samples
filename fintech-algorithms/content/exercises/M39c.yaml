question: "A financial assistant handles 1,000 requests:\n▶ Total model and retrieval\
  \ spend is $500, including calls that abstain.\n▶ It abstains on 100 requests. Each\
  \ goes to manual review at $3 and is answered correctly.\n▶ Of the 900 automatically\
  \ answered requests, 800 are correct and 100 are wrong.\n Calculate abstention rate,\
  \ automated-answer coverage, total operating cost, cost per incoming\n request,\
  \ and cost per correctly resolved request. Also calculate accuracy among automatic\n\
  \ answers. Include all spending in the cost numerator; exclude downstream financial\
  \ harm for this\n exercise."
