  workedExplanation:
  - 'Abstention adds review expense and routes those cases to correct manual resolution
    under the exercise’s assumptions. Model spend alone understates operating cost.
    Even the all-in $0.80 per request excludes the consequences of the 100 wrong answers;
    it is not a complete economic loss measure. '
  - 'The same numerical fraction can represent different concepts: 800/900 is automatic-answer
    accuracy, while $800 divided by 900 correct resolutions is a cost in dollars.
    The numerator’s units and the denominator’s population determine the meaning.
    The scenario does not establish what automatic answers would have been produced
    on the abstained cases.'
  workedArithmetic:
  - Abstention = 100/1,000 = 10%; automatic coverage = (1,000 − 100) / 1,000 = 90%.
  - Review spending = 100 × $3 = $300; total operating cost = $500 + $300 = $800.
  - Cost per incoming request = $800/1,000 = $0.80. Correct resolutions = 800 + 100
    = 900; cost per correct resolution = $800/900 ≈ $0.89.
  - Automatic-answer accuracy = 800/900 ≈ 88.89%. This shares the numerical fraction
    with cost per correct resolution but has different units and meaning.
