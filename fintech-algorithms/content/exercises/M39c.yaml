solutionPages:
- page: 589
  title: Cost and Abstention
  text: " Cost and Abstention\n\n   M39c | Worked solution — Price the Entire Workflow\n\
    \n1. Abstention rate: 100/1,000 = 10%. Automated-answer coverage = 900/1,000 =\
    \ 90%.\n2. Human review cost: 100($3) = $300.\n3. Total operating cost: $500 +\
    \ $300 = $800.\n4. Cost per incoming request: 800/1,000 = $0.80.\n5. Correctly\
    \ resolved requests: 800 + 100 = 900.\n                      All-in cost per correct\
    \ resolution = 800/900 ≈ $0.89.\n6. Automatic-answer accuracy: 800/900 = 88.89%."
  paragraphs:
  - Cost and Abstention
  - M39c | Worked solution — Price the Entire Workflow
  - '1. Abstention rate: 100/1,000 = 10%. Automated-answer coverage = 900/1,000 =
    90%. 2. Human review cost: 100($3) = $300. 3. Total operating cost: $500 + $300
    = $800. 4. Cost per incoming request: 800/1,000 = $0.80. 5. Correctly resolved
    requests: 800 + 100 = 900. All-in cost per correct resolution = 800/900 ≈ $0.89.
    6. Automatic-answer accuracy: 800/900 = 88.89%.'
