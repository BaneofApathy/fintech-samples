learning:
  title: Loan Review
  scenario: A lender estimates one-year default probability with z = −3 + 0.04 × DTI
    + 1.2 × D − 0.03 × I, then p = 1 / (1 + exp(−z)). D is 1 for prior delinquency
    and 0 otherwise.
  task: Use the applicant values below. Calculate the score, probability and expected
    loss. Send the application to review when its probability reaches the review threshold.
  interpretation: Expected loss averages the possible credit loss over comparable
    loans. It does not predict a certain loss on this applicant. The review threshold
    is a policy choice; calibration is needed to assess whether the probabilities
    are reliable.
  summary: 'Default probability: {p}. Expected loss: {EL}. Send to review: {decision}.'
  labels: *id006
  steps:
    z:
      title: Combined score z (log-odds)
      hints: *id007
