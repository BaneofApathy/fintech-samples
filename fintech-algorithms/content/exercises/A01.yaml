interpretationPages:
- page: 29
  title: Logistic Regression
  text: " Logistic Regression\n\n   A01 | Interpretation\n\n What the answer means\n\
    \ The estimated average credit loss is about $399 per comparable loan under these\n\
    \ assumptions. It is not a guaranteed loss on this loan, and review is not the\
    \ same as rejection.\n Whether the probability is reliable requires calibration\
    \ evidence.\n Why these steps matter\n The multiplication by 0.40 does not describe\
    \ how often default occurs; it describes how much\n is lost when default occurs.\
    \ The multiplication by p supplies the frequency weighting.\n Keeping those two\
    \ roles separate prevents confusing probability with severity."
  paragraphs:
