  text: " Logistic Regression\n\n   A01 | Formula explained (2/2)\n\n Question: How\
    \ does default probability translate into expected credit loss?\n            \
    \                                EL = P D × EAD × LGD.\n Read it aloud: Probability\
    \ of default × dollars exposed when default occurs × fraction of those\n dollars\
    \ lost after recovery.\n First compute EAD × LGD, the loss conditional on default.\
    \ Then multiply by P D to obtain\n the probability-weighted average loss.\n The\
    \ classroom policy sends an application to review when p ≥ 0.08. This is an assumed\
    \ routing\n rule, not a rule learned by the sigmoid."
