question: "A lender uses this fitted model to estimate one-year default probability:\n\
  \                                                                         1\n  \
  \                    z = −3 + 0.04(DTI) + 1.2D − 0.03I,        p=           .\n\
  \                                                                     1 + e−z\n\
  \ DTI is entered in percentage points, D = 1 for a prior delinquency and 0 otherwise,\
  \ and I is\n annual income in thousands of dollars.\n An applicant has DTI = 35,\
  \ D = 1, and I = 60. The requested loan is $10,000, with a 40%\n loss if default\
  \ occurs. Send applications to review when p ≥ 8%.\n1. Calculate z and the default\
  \ probability. Use e2.2 = 9.025.\n2. Calculate expected credit loss: p × loan amount\
  \ × loss fraction.\n3. Apply the review rule. Does the result mean the applicant\
  \ will default?"
