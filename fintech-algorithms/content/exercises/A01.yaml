      title: Send to review?
      hints: *id011
      unit: ''
  readAloud:
  - Start at −3, add the debt-burden and delinquency contributions, then subtract
    the income contribution. Turn the unrestricted score into a number between 0 and
    1. This conversion is called the logistic or sigmoid function. These are supplied,
    fitted coefficients. The exercise calculates a prediction; it does not estimate
    the coefficients from data.
  - Probability of default × dollars exposed when default occurs × fraction of those
    dollars lost after recovery. First compute EAD × LGD, the loss conditional on
    default. Then multiply by PD to obtain the probability-weighted average loss.
    The classroom policy sends an application to review when p ≥ 0.08. This is an
    assumed routing rule, not a rule learned by the sigmoid.
  workedExplanation:
  - 'The estimated average credit loss is about $399 per comparable loan under these
    assumptions. It is not a guaranteed loss on this loan, and review is not the same
    as rejection. Whether the probability is reliable requires calibration evidence. '
  - The multiplication by 0.40 does not describe how often default occurs; it describes
    how much is lost when default occurs. The multiplication by p supplies the frequency
    weighting. Keeping those two roles separate prevents confusing probability with
    severity.
  workedArithmetic:
  - z = −3 + 0.04 × 35 + 1.2 × 1 − 0.03 × 60 = −3 + 1.4 + 1.2 − 1.8 = −2.2.
  - p = 1 / (1 + exp(2.2)) ≈ 1 / (1 + 9.025) ≈ 0.09975 = 9.975%.
  - Loss on default = $10,000 × 0.40 = $4,000. Expected loss ≈ 0.09975 × $4,000 =
    $399.
  - 9.975% ≥ 8%, so this application goes to review.
