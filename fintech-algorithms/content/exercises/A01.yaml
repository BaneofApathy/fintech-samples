solutionPages:
- page: 28
  title: Logistic Regression
  text: " Logistic Regression\n\n   A01 | Worked solution — Loan Review\n\n1. Combine\
    \ the features.\n             z = −3 + 0.04(35) + 1.2 − 0.03(60) = −3 + 1.4 +\
    \ 1.2 − 1.8 = −2.2.\n2. Convert the score into a probability.\n              \
    \                         1\n                               p=             = 0.09975\
    \ ≈ 9.98%.\n                                   1 + 9.025\n3. Calculate the loss\
    \ if default occurs, then weight it by probability.\n                        \
    \    Loss on default = 10,000(0.40) = $4,000.\n                              \
    \              Expected loss = 0.09975(4,000) ≈ $399.\n4. Apply the policy. 9.98%\
    \ ≥ 8%, so send the application to review."
  paragraphs:
  - Logistic Regression
  - A01 | Worked solution — Loan Review
  - 1. Combine the features. z = −3 + 0.04(35) + 1.2 − 0.03(60) = −3 + 1.4 + 1.2 −
    1.8 = −2.2. 2. Convert the score into a probability. 1 p= = 0.09975 ≈ 9.98%. 1
    + 9.025 3. Calculate the loss if default occurs, then weight it by probability.
    Loss on default = 10,000(0.40) = $4,000. Expected loss = 0.09975(4,000) ≈ $399.
    4. Apply the policy. 9.98% ≥ 8%, so send the application to review.
