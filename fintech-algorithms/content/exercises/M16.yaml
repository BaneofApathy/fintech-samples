question: "Two fraud models differ only on their third prediction:\n   Transaction\
  \                                         Actual fraud y         Model A probability\
  \            Model B probability\n   1                                         \
  \                           1                          0.80                    \
  \ 0.80\n   2                                                                   \
  \ 0                          0.10                     0.10\n   3               \
  \                                                     0                        \
  \  0.99                     0.60\n\n                                           \
  \                      1 X\n                                                  Log\
  \ loss = −       [yi ln pi + (1 − yi ) ln(1 − pi )].\n                         \
  \                                        N i\n Use − ln(0.8) = 0.2231, − ln(0.9)\
  \ = 0.1054, − ln(0.01) = 4.6052, and − ln(0.4) = 0.9163.\n Calculate each model’s\
  \ average log loss. At threshold 0.50, do they make different yes/no\n classifications?\
  \ Explain why the probability measure still distinguishes them."
