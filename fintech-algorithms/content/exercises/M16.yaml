- page: 330
  title: Log Loss
  text: " Log Loss\n\n   M16 | Formula explained (2/2)\n\n Why the logarithm matters\n\
    \ A probability near 1 for the actual outcome gives a penalty near 0. A probability\
    \ near 0 for the\n actual outcome gives a very large penalty.\n For a legitimate\
    \ transaction, use the model’s probability of legitimacy, one minus its fraud\n\
    \ probability. Using the fraud probability directly would score the wrong event.\n\
    \ Natural logs give a unitless score conventionally measured in nats. This is\
    \ not a loss in dollars.\n An actual outcome assigned probability zero has unbounded\
    \ log penalty; all supplied values here\n are strictly between 0 and 1."
  paragraphs:
  - Log Loss
  - M16 | Formula explained (2/2)
  - Why the logarithm matters A probability near 1 for the actual outcome gives a
    penalty near 0. A probability near 0 for the actual outcome gives a very large
