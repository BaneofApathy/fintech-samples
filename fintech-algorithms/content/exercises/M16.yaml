interpretationPages:
- page: 335
  title: Log Loss
  text: " Log Loss\n\n   M16 | Interpretation\n\n What the answer means\n Model A’s\
    \ 99% fraud probability on a legitimate transaction receives a much larger penalty\
    \ than\n B’s 60%. Identical classification accuracy can conceal very different\
    \ probability quality.\n Log loss is not a dollar-cost calculation.\n Why these\
    \ steps matter\n Both models make the same yes/no decisions at 0.50, but the more\
    \ confident mistake puts\n much less probability on the true outcome. Log loss\
    \ detects that difference because it evaluates\n the full probabilities rather\
    \ than only the thresholded labels."
  paragraphs:
  - Log Loss
  - M16 | Interpretation
  - What the answer means Model A’s 99% fraud probability on a legitimate transaction
    receives a much larger penalty than B’s 60%. Identical classification accuracy
    can conceal very different probability quality. Log loss is not a dollar-cost
