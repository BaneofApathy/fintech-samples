  title: Log Loss
  text: " Log Loss\n\n   M16 | Formula explained (1/2)\n\n Question: How much probability\
    \ did the model place on the outcome that actually occurred?\n               \
    \                                   ℓi = − [yi ln pi + (1 − yi ) ln(1 − pi )]\
    \ ,\n                                                                        \
    \  N\n                                                                      1\
    \ X\n                                                              LL =      \
    \    ℓi .\n                                                                  \
    \    N i=1\n Read it aloud: For each transaction, take the negative natural logarithm\
    \ of the probability\n assigned to its actual outcome; average those penalties.\n\
    \ The 0/1 label selects the appropriate part of the formula: yi = 1 leaves − ln\
    \ pi ; yi = 0 leaves\n − ln(1 − pi )."
