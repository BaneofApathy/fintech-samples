learning:
  title: Penalize a Confident Mistake
  scenario: Two fraud models produce probabilities for the same transactions. Label
    1 is fraud and 0 is legitimate. A positive prediction occurs at or above the supplied
    threshold.
  task: Calculate each model’s mean log loss and the number of classification errors
    made by A. Use natural logarithms.
  interpretation: Log loss evaluates the probability assigned to the actual outcome.
    Two models can make the same thresholded decisions but receive different penalties
    for the confidence of a mistake.
