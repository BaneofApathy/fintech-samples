  readAloud:
  - Calculate how mixed each group is; average the child impurities using their record
    counts; subtract that average from the original impurity. A pure group contains
    only one class and has impurity zero. A useful candidate split reduces impurity
    on the training records; validation is still separate.
  - 'Add the fraud scores supplied by the trees and divide by the number of trees.
    Here the exercise averages three scores, not three yes/no votes. Challenge when
    the resulting score is at least 0.60. Distinguish the terms: A node is a group
    of records. A split divides a node. A leaf is a final node that supplies a prediction.
    A forest combines several trees.'
  workedExplanation:
  - 'The split creates more uniform groups in this training sample. Averaging trees
    changes the intervention decision; it does not prove that the resulting score
    is calibrated. Gini impurity here is different from the AUC-derived Gini coefficient. '
  - 'Child size matters: averaging the two child impurities 50/50 would incorrectly
    give the four-record group as much influence as the six-record group. The forest
    score and the split impurity answer different questions; neither is a measured
    probability calibration result.'
  workedArithmetic:
  - Parent Gini = 1 − (4/10)² − (6/10)² = 0.48.
  - New-device Gini = 1 − (3/4)² − (1/4)² = 0.375. Trusted-device Gini = 1 − (1/6)²
    − (5/6)² ≈ 0.2778.
  - Weighted child Gini = (4/10) × 0.375 + (6/10) × 0.2778 ≈ 0.3167. Reduction ≈ 0.48
    − 0.3167 = 0.1633.
  - Forest score = (0.75 + 0.50 + 0.25) / 3 = 0.50 < 0.60, so no challenge. The first
    tree alone scores 0.75 ≥ 0.60 and would challenge.
