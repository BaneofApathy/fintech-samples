interpretationPages:
- page: 41
  title: Trees and Random Forests
  text: " Trees and Random Forests\n\n   A02 | Interpretation\n\n What the answer\
    \ means\n The split creates more uniform groups in this training sample. Averaging\
    \ trees changes the\n intervention decision; it does not prove that the resulting\
    \ score is calibrated. Gini impurity\n here is different from the AUC-derived\
    \ Gini coefficient.\n Why these steps matter\n Child size matters: averaging the\
    \ two child impurities 50/50 would incorrectly give the\n four-record group as\
    \ much influence as the six-record group. The forest score and the split\n impurity\
    \ answer different questions; neither is a measured probability calibration result."
  paragraphs:
  - Trees and Random Forests
  - A02 | Interpretation
  - 'What the answer means The split creates more uniform groups in this training
    sample. Averaging trees changes the intervention decision; it does not prove that
    the resulting score is calibrated. Gini impurity here is different from the AUC-derived
    Gini coefficient. Why these steps matter Child size matters: averaging the two
    child impurities 50/50 would incorrectly give the four-record group as much influence
    as the six-record group. The forest score and the split impurity answer different
    questions; neither is a measured probability calibration result.'
