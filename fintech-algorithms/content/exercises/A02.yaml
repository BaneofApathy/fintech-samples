learning:
  title: A Fraud Split
  scenario: A proposed tree split groups transactions by whether the device is new
    or trusted. Counts below are ordered as new-device fraud, new-device legitimate,
    trusted-device fraud, trusted-device legitimate.
  task: Use Gini impurity 1 − fraud-share² − legitimate-share². Weight child impurities
    by their record counts. Average the fitted tree scores and apply the challenge
    threshold.
  interpretation: A useful training split reduces impurity. That does not establish
    validation performance or probability calibration. Average the supplied tree scores,
    rather than converting them to votes first.
  summary: 'Impurity reduction: {gain}. Forest score: {score}. Challenge the transaction:
    {decision}.'
