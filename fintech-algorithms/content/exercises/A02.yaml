id: A02
title: A Fraud Split
minutes: 10
kind: algorithm
parent: trees-and-forests
question: "A training node contains 10 transactions: 4 frauds and 6 legitimate transactions.\
  \ A\n proposed split produces:\n   Device group                                \
  \           Fraud                        Legitimate\n   New device             \
  \                                      3                                1\n   Trusted\
  \ device                                               1                       \
  \         5\n\n Use Gini impurity G = 1 − p2f − p2l . Weight each child node by\
  \ its share of the 10 records.\n For a new transaction, three fitted trees output\
  \ fraud scores of 0.75, 0.50, and 0.25. The\n forest averages these scores. The\
  \ challenge threshold is 0.60.\n1. Calculate parent impurity, weighted child impurity,\
  \ and the reduction.\n2. Calculate the forest score and apply the challenge threshold.\n\
  3. Would the first tree alone produce the same action?"
