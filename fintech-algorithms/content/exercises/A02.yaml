solutionPages:
- page: 40
  title: Trees and Random Forests
  text: " Trees and Random Forests\n\n   A02 | Worked solution — A Fraud Split\n\n\
    1. Parent impurity: 1 − 0.42 − 0.62 = 0.48.\n2. Child impurities:\n          \
    \                                     Gnew = 1 − (3/4)2 − (1/4)2 = 0.375.\n  \
    \                                           Gtrusted = 1 − (1/6)2 − (5/6)2 = 0.2778.\n\
    3. Weight the children:\n                      Gsplit = (4/10)(0.375) + (6/10)(0.2778)\
    \ = 0.3167.\n                                            Impurity reduction =\
    \ 0.48 − 0.3167 = 0.1633.\n4. Average the tree outputs: (0.75 + 0.50 + 0.25)/3\
    \ = 0.50.\n5. Apply the threshold: The forest does not trigger a challenge because\
    \ 0.50 < 0.60. The first\n   tree alone would trigger one because 0.75 ≥ 0.60."
  paragraphs:
  - Trees and Random Forests
  - A02 | Worked solution — A Fraud Split
  - '1. Parent impurity: 1 − 0.42 − 0.62 = 0.48. 2. Child impurities: Gnew = 1 − (3/4)2
    − (1/4)2 = 0.375. Gtrusted = 1 − (1/6)2 − (5/6)2 = 0.2778. 3. Weight the children:
    Gsplit = (4/10)(0.375) + (6/10)(0.2778) = 0.3167. Impurity reduction = 0.48 −
    0.3167 = 0.1633. 4. Average the tree outputs: (0.75 + 0.50 + 0.25)/3 = 0.50. 5.
    Apply the threshold: The forest does not trigger a challenge because 0.50 < 0.60.
    The first tree alone would trigger one because 0.75 ≥ 0.60.'
