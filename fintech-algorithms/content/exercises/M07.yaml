interpretationPages:
- page: 254
  title: F1 and F-beta
  text: " F1 and F-beta\n\n   M07 | Interpretation\n\n What the answer means\n F1\
    \ = 0.429 summarizes the tradeoff; F2 = 0.577 places more emphasis on the stronger\
    \ recall.\n These are differently weighted scores, not two competing models. Neither\
    \ score contains dollar\n loss, investigator capacity, or probability calibration.\n\
    \ Why these steps matter\n F1 and F2 are two summaries of the same operating point.\
    \ A larger F2 does not mean the\n detector has improved. It means the selected\
    \ weighting gives more credit to the detector’s\n relatively high recall."
