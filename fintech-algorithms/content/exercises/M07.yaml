learning:
  title: Balance Capture and Queue Quality
  scenario: A detector has the supplied precision and recall at one operating point.
    F1 is their harmonic mean; F-beta changes their relative weight.
  task: Calculate F1, F-beta with the supplied beta, and the ordinary arithmetic mean
    of precision and recall.
  interpretation: Changing beta changes the summary score, not the detector. These
    scores do not include financial loss, review capacity or probability calibration.
