  workedExplanation:
  - 'F1 = 0.429 summarizes the tradeoff; F2 = 0.577 places more emphasis on the stronger
    recall. These are differently weighted scores, not two competing models. Neither
    score contains dollar loss, investigator capacity, or probability calibration. '
  - F1 and F2 are two summaries of the same operating point. A larger F2 does not
    mean the detector has improved. It means the selected weighting gives more credit
    to the detector’s relatively high recall.
  workedArithmetic:
  - With P = 0.30 and R = 0.75, PR = 0.225.
  - F1 = (2 × 0.225) / (0.30 + 0.75) = 0.45/1.05 ≈ 0.4286.
  - For beta = 2, F2 = (5 × 0.225) / (4 × 0.30 + 0.75) = 1.125/1.95 ≈ 0.5769.
  - Arithmetic mean = (0.30 + 0.75) / 2 = 0.525.
