learning:
  title: Improvement Over Predicting the Mean
  scenario: A settlement forecast is scored against actuals in $ thousands. R² compares
    squared forecast error with squared deviations from the evaluated sample’s actual
    mean.
  task: Find the actual mean, model squared-error sum, sample-mean squared-error sum
    and R² = 1 − SSE/SST.
  interpretation: The evaluated sample’s mean is a scoring reference, not a forecast
    available in advance. R² measures relative squared-error reduction, not the fraction
    of exactly correct forecasts.
  summary: 'R²: {R2}. Model SSE: {SSE}; sample-mean reference SST: {SST}.'
  labels: *id004
  steps:
    actualMean:
      title: Mean actual outflow
      hints: *id005
      unit: $ thousands
    SSE:
      title: Model sum of squared errors
      hints: *id006
      unit: ''
