  readAloud:
  - Calculate total model squared error and total squared deviation from the actual
    sample mean. Divide the first by the second, then subtract from one. The reference
    uses the evaluated sample’s mean as a comparison for scoring. It is not a forecast
    available before those future actuals occurred.
  workedExplanation:
  - 'The model removes 73.83% of squared error relative to the sample-mean reference.
    It does not mean 73.83% of forecasts are correct. The test-set mean is an evaluation
    reference—not a forecast treasury could know before those outcomes occurred. '
  - The 73.83% interpretation refers to a reduction in squared-error total, not a
    share of exactly correct forecasts. A forecast can receive a positive R-squared
    without matching any daily actual exactly.
  workedArithmetic:
  - Actual mean = (100 + 120 + 80 + 150) / 4 = 112.5.
  - Model SSE = 10² + (−10)² + (−20)² + 10² = 100 + 100 + 400 + 100 = 700.
  - SST = (100 − 112.5)² + (120 − 112.5)² + (80 − 112.5)² + (150 − 112.5)² = 156.25
    + 56.25 + 1,056.25 + 1,406.25 = 2,675.
  - R² = 1 − 700/2,675 ≈ 0.7383.
