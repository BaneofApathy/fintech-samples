solutionPages:
- page: 309
  title: Lift and Gain
  text: " Lift and Gain\n\n   M13 | Worked solution — Compare With Random Review\n\
    \n1. Prevalence: 20/1,000 = 2%.\n2. Precision@50: 15/50 = 30%.\n3. Lift: 30%/2%\
    \ = 15.\n4. Cumulative gain: 15/20 = 75% of all frauds.\n5. Random-review expectation:\
    \ 50(0.02) = 1 fraud, compared with the model’s 15 in this\n   sample.\n6. Population\
    \ reviewed: 50/1,000 = 5%."
  paragraphs:
  - Lift and Gain
  - M13 | Worked solution — Compare With Random Review
  - '1. Prevalence: 20/1,000 = 2%. 2. Precision@50: 15/50 = 30%. 3. Lift: 30%/2% =
