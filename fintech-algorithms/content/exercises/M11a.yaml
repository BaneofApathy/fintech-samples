learning:
  title: Build It From a Ranked List
  scenario: Transactions are ordered from highest to lowest model score. The listed
    labels are 1 for fraud and 0 for legitimate.
  task: For every queue size from 1 through the length of the list, count captured
    frauds and calculate precision and recall. Plot recall horizontally and precision
    vertically.
  interpretation: Adding a legitimate case increases the queue size without adding
    fraud. Adding a fraud can raise precision. Recall cannot decrease when a queue
    only expands.
  summary: 'Captured frauds by queue size: {captured}. Precision: {precision}. Recall:
    {recall}.'
