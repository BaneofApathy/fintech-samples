solutionPages:
- page: 285
  title: Precision–Recall Curve
  text: " Precision–Recall Curve\n\n   M11a | Worked solution — Build It From a Ranked\
    \ List\n\n1. Count cumulative frauds: [1, 1, 2, 2, 2, 3].\n2. Calculate each operating\
    \ point.\n   K                                              Frauds found     \
    \   Precision             Recall\n   1                                       \
    \                 1               100%            33.33%\n   2               \
    \                                         1                 50%           33.33%\n\
    \   3                                                        2             66.67%\
    \            66.67%\n   4                                                    \
    \    2                 50%           66.67%\n   5                            \
    \                            2                 40%           66.67%\n   6    \
    \                                                    3                 50%   \
    \         100%\n\n3. Interpret the changes: Rank 2 adds a false alert: precision\
    \ drops while recall stays fixed.\n   Rank 3 adds a fraud: both precision and\
    \ recall increase."
  paragraphs:
  - Precision–Recall Curve
  - M11a | Worked solution — Build It From a Ranked List
