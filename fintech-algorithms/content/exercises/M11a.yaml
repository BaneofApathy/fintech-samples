  readAloud:
  - Count frauds in the first K ranked cases. Divide that count by K for precision
    and by all frauds for recall. For a precision–recall curve, plot recall horizontally
    and precision vertically. Repeat as K grows. Adding a legitimate case changes
    the queue denominator without increasing captured fraud. Adding a fraud increases
    the captured count and can increase both precision and recall.
  workedExplanation:
  - 'Reviewing six cases captures every fraud in this sample, but half the queue is
    legitimate. An empirical precision–recall curve can rise locally; precision does
    not necessarily fall at every additional rank. '
  - 'Recall cannot decrease when the queue only expands, because caught frauds are
    not removed. Precision can rise or fall: its numerator and denominator change
    differently depending on whether the next case is fraud.'
  workedArithmetic:
  - Cumulative frauds at K = 1 through 6 are [1, 1, 2, 2, 2, 3].
  - Precisions are [1/1, 1/2, 2/3, 2/4, 2/5, 3/6] = [100%, 50%, 66.67%, 50%, 40%,
    50%].
  - Recalls are [1/3, 1/3, 2/3, 2/3, 2/3, 3/3]. Adding rank 2 lowers precision only;
    adding rank 3 raises both precision and recall.
