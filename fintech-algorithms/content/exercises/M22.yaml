learning:
  title: Percentage of What?
  scenario: Settlement actuals and forecasts are in $ thousands. A separate training
    history provides the scale for a nonseasonal naive forecast that predicts the
    previous observation.
  task: Calculate test MAE, MAPE, WAPE, the training mean absolute one-step change
    and MASE. Enter MAPE and WAPE as proportions or with a percent sign.
  interpretation: MAPE averages daily proportional errors; WAPE divides total absolute
    error by total actual volume. MASE compares test error with the training naive-error
    scale, not necessarily a naive forecast’s test error. MAPE is undefined if an
    actual is zero.
