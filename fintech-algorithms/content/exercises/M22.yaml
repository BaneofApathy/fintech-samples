solutionPages:
- page: 392
  title: Scaled Forecast Errors
  text: " Scaled Forecast Errors\n\n   M22 | Worked solution — Percentage of What?\n\
    \n1. Absolute test errors: [10, 10, 20, 10]; sum = 50; test MAE = 50/4 = 12.5.\n\
    2. Percentage errors: 10/100 = 10%; 10/120 = 8.333%; 20/80 = 25%; 10/150 = 6.667%.\n\
    \                      M AP E = (10 + 8.333 + 25 + 6.667)/4 = 12.5%.\n3. Aggregate\
    \ scale: W AP E = 50/(100 + 120 + 80 + 150) = 11.11%.\n4. Training naive scale:\
    \ (|100 − 80| + |120 − 100| + |140 − 120|)/3 = 20.\n5. MASE: 12.5/20 = 0.625."
  paragraphs:
  - Scaled Forecast Errors
  - M22 | Worked solution — Percentage of What?
  - '1. Absolute test errors: [10, 10, 20, 10]; sum = 50; test MAE = 50/4 = 12.5.
    2. Percentage errors: 10/100 = 10%; 10/120 = 8.333%; 20/80 = 25%; 10/150 = 6.667%.
    M AP E = (10 + 8.333 + 25 + 6.667)/4 = 12.5%. 3. Aggregate scale: W AP E = 50/(100
    + 120 + 80 + 150) = 11.11%. 4. Training naive scale: (|100 − 80| + |120 − 100|
    + |140 − 120|)/3 = 20. 5. MASE: 12.5/20 = 0.625.'
  source:
