  readAloud:
  - MAPE divides each absolute error by its absolute actual and averages those fractions.
    WAPE divides total absolute error by total absolute actual volume. Multiply either
    fraction by 100 to write a percentage. MAPE is undefined when an individual actual
    is zero; WAPE requires a nonzero total denominator.
  - Average absolute changes between consecutive training values. Divide the test-period
    MAE by that training-period naive-error scale. Here the naive reference predicts
    the previous observation, with no seasonal lag. Training history and test outcomes
    remain separate. A MASE below one means test error is below the training reference
    scale, not necessarily below a test-period naive forecast’s error.
  workedExplanation:
  - 'MAPE averages each day’s percentage miss. WAPE compares total absolute error
    with total volume. MASE says the test error is 62.5% of the training naive-error
    scale; it does not, by itself, establish superiority to a naive forecast on the
    test period. MAPE is undefined at zero actuals. '
  - The denominators intentionally differ. MAPE gives each day’s proportional miss
    equal weight; WAPE evaluates error relative to total volume; MASE compares against
    a historical forecasting scale. A name containing “percentage” is not permission
    to ignore zeros, signs, or the evaluation window.
  workedArithmetic:
  - Absolute errors are [10, 10, 20, 10]; test MAE = 50/4 = 12.5.
  - MAPE = (10/100 + 10/120 + 20/80 + 10/150) / 4 = 0.125 = 12.5%.
  - WAPE = 50 / (100 + 120 + 80 + 150) = 50/450 ≈ 11.11%.
  - Training naive scale = (|100 − 80| + |120 − 100| + |140 − 120|) / 3 = 20. MASE
    = 12.5/20 = 0.625.
