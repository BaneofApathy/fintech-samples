readAloud:
- MAPE calculates a percentage-type error for each day and then averages. WAPE totals
  all absolute errors and divides by total absolute actual volume. Both formulas above
  return fractions; multiply by 100 when writing percentage numbers. MAPE is undefined
  when an individual actual value is zero. WAPE requires a nonzero total denominator.
- Average absolute changes between consecutive training values. Divide the test-period
  MAE by that training-period naive-error scale. Here the naive reference predicts
  the previous observation, with no seasonal lag. Training history and test outcomes
  remain separate. A MASE below one means test error is below the training reference
  scale, not necessarily below a test-period naive forecast’s error.
