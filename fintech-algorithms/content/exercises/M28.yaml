learning:
  title: Find All the Evidence
  scenario: A retriever returns the same number of distinct passages for each question.
    Relevant-passage counts are established by a relevance rubric. Context precision
    here is a simple relevant share, not a rank-weighted measure.
  task: Calculate recall and context precision per question, then the unweighted mean
    of each across questions.
  interpretation: Finding one relevant passage is a hit, but may leave required evidence
    missing. Averaging per-query recall is different from pooling all passage counts.
    Answer quality needs its own evaluation.
  summary: 'Mean retrieval recall: {meanRecall}; mean context precision: {meanPrecision}.'
  labels: *id003
  steps:
    recalls:
      title: Recall for each question
      hints: *id004
      unit: proportion
    precision:
      title: Context precision for each question
      hints: *id005
      unit: proportion
    meanRecall:
      title: Mean retrieval recall
      hints: *id006
      unit: proportion
    meanPrecision:
      title: Mean context precision
      hints: *id007
      unit: proportion
  readAloud:
  - Count retrieved chunks that are relevant. Divide by all relevant chunks for recall;
    divide by the retrieved queue size for context precision. Compute each question
    separately, then take an unweighted average across questions. Here each query
    retrieves exactly three distinct chunks. Context precision uses simple relevant-chunk
    share in this exercise, not a rank-weighted evaluator’s definition.
  workedExplanation:
  - 'Both questions have an evidence “hit,” but Q1 is missing half its required source
    material. A 100% question-level hit rate is not 100% relevant-chunk recall. Two-thirds
    of the supplied context is irrelevant in both cases. Generation still needs separate
    evaluation. '
  - The missing B chunk in Q1 matters even though A was retrieved. Counting Q1 as
    a binary “hit” discards information about completeness. Mean recall across questions
    also differs from pooling all retrieved chunks into one global numerator and denominator.
  workedArithmetic:
  - 'Q1 retrieves one of its two relevant passages: recall = 1/2 = 50%; context precision
    = 1/3 ≈ 33.33%.'
  - 'Q2 retrieves its only relevant passage: recall = 1/1 = 100%; context precision
    = 1/3 ≈ 33.33%.'
  - Mean recall = (0.5 + 1) / 2 = 75%. Mean context precision = (1/3 + 1/3) / 2 =
    1/3 ≈ 33.33%.
