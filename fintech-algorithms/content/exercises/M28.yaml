solutionPages:
- page: 451
  title: Retrieval Recall and Context Precision
  text: " Retrieval Recall and Context Precision\n\n   M28 | Worked solution — Find\
    \ All the Evidence\n\n1. Q1: retrieved evidence intersects {A, B} at {A} only.\n\
    \              Recall@3 = 1/2 = 50%,         Context precision@3 = 1/3 = 33.33%.\n\
    2. Q2: retrieved evidence includes its only relevant chunk, E.\n             \
    \ Recall@3 = 1/1 = 100%,          Context precision@3 = 1/3 = 33.33%.\n3. Mean\
    \ recall: (50% + 100%)/2 = 75%.\n4. Mean context precision: (1/3 + 1/3)/2 = 33.33%."
  paragraphs:
  - Retrieval Recall and Context Precision
  - M28 | Worked solution — Find All the Evidence
  - '1. Q1: retrieved evidence intersects {A, B} at {A} only. Recall@3 = 1/2 = 50%,
    Context precision@3 = 1/3 = 33.33%. 2. Q2: retrieved evidence includes its only
    relevant chunk, E. Recall@3 = 1/1 = 100%, Context precision@3 = 1/3 = 33.33%.
    3. Mean recall: (50% + 100%)/2 = 75%. 4. Mean context precision: (1/3 + 1/3)/2
    = 33.33%.'
