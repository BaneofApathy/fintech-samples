interpretationPages:
- page: 153
  title: Constrained Optimization
  text: " Constrained Optimization\n\n   A10 | Interpretation\n\n What the answer\
    \ means\n The lowest-risk candidate overall fails the return constraint. 50/50\
    \ is optimal only among\n these three permitted candidates under the supplied\
    \ estimates. Neither the 7% expected\n return nor the volatility is guaranteed.\n\
    \ Why these steps matter\n Compare variance only after checking feasibility. A\
    \ low-risk allocation can fail a mandatory\n return requirement. The covariance\
    \ term is shown so students can see exactly what the\n zero-correlation assumption\
    \ removes; it does not change any original exercise input."
  paragraphs:
  - Constrained Optimization
  - A10 | Interpretation
  - What the answer means The lowest-risk candidate overall fails the return constraint.
    50/50 is optimal only among these three permitted candidates under the supplied
    estimates. Neither the 7% expected return nor the volatility is guaranteed. Why
    these steps matter Compare variance only after checking feasibility. A low-risk
    allocation can fail a mandatory return requirement. The covariance term is shown
    so students can see exactly what the zero-correlation assumption removes; it does
    not change any original exercise input.
