formulaPages:
- page: 145
  title: Constrained Optimization
  text: " Constrained Optimization\n\n   A10 | Formula explained (1/2)\n\n Question:\
    \ Which permitted allocation meets the return requirement with the lowest modeled\n\
    \ variance?\n                                                       µp = wµs +\
    \ (1 − w)µb ,\n                                            σp2 = w2 σs2 + (1 −\
    \ w)2 σb2 + 2w(1 − w)ρσs σb ,\n                                              \
    \                      q\n                                                   \
    \           σp = σp2 .\n Read it aloud: Expected return is a weighted average.\
    \ Variance combines each asset’s\n weighted risk and a co-movement term. Take\
    \ its square root for volatility.\n Here correlation is zero, so the last term\
    \ is zero. Enter 20% volatility as 0.20 before squaring."
  paragraphs:
  - Constrained Optimization
  - A10 | Formula explained (1/2)
