  mistakes:
  - pattern: recompute
    message: Multiply portfolio value by the chosen stock weight.
- id: bondDollars
  title: Dollar allocation to bonds
  expects: number
  unit: $
  tolerance:
    rel: 0.005
    abs: 5.0e-05
  hints: &id011
  - Multiply portfolio value by one minus the chosen stock weight.
  mistakes:
  - pattern: recompute
    message: Multiply portfolio value by one minus the chosen stock weight.
learning:
  title: Choose a Feasible Portfolio
  scenario: A portfolio may use only the listed stock weights; the remaining weight
    goes to bonds. Stocks and bonds have zero correlation. Expected return must meet
    the supplied minimum.
  task: Calculate return and volatility for each candidate. Among feasible candidates,
    choose the lowest variance and calculate dollar allocations.
  interpretation: Check feasibility before comparing risk. This is an optimum among
    the listed candidates under estimated inputs; expected return and volatility are
    not guarantees.
  summary: 'Chosen stock weight: {weight}. Stock allocation: {stockDollars}; bond
    allocation: {bondDollars}.'
  labels: *id005
  steps:
    returns:
      title: Expected return of each candidate
      hints: *id006
      unit: proportion
    variances:
