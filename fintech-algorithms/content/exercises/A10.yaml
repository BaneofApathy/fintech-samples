id: A10
title: Choose a Feasible Portfolio
minutes: 10
kind: algorithm
parent: optimization
question: "A hypothetical $100,000 portfolio can use stocks and bonds with these annual\
  \ estimates:\n   Asset                                                     Expected\
  \ return                          Volatility\n   Stocks                        \
  \                                         10%                              20%\n\
  \   Bonds                                                                   4% \
  \                              5%\n\n Assume zero correlation. Policy permits only\
  \ three stock/bond allocations: 40/60, 50/50,\n and 60/40. Expected return must\
  \ be at least 7%.\n For stock weight w:\n                                µp = 0.10w\
  \ + 0.04(1 − w),   σp2 = w2 (0.20)2 + (1 − w)2 (0.05)2 .\n Calculate return and\
  \ volatility for each allocation. Choose the lowest-variance feasible\n candidate,\
  \ then calculate its dollar allocations."
