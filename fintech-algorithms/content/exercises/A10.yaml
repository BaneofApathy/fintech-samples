- page: 146
  title: Constrained Optimization
  text: " Constrained Optimization\n\n   A10 | Formula explained (2/2)\n\n Question:\
    \ How do the constraints change the selection?\n                             \
    \                     w ∈ {0.40, 0.50, 0.60},    µp ≥ 0.07.\n Read it aloud: Only\
    \ the three supplied stock weights are allowed, and expected return must\n reach\
    \ 7%. Discard candidates that fail; choose the remaining one with smallest variance.\n\
    \                                            Stock dollars = V w,     Bond dollars\
    \ = V (1 − w).\n Read it aloud: Multiply total portfolio value by each allocation\
    \ weight to turn fractions into\n dollars.\n This is a finite candidate comparison,\
    \ not a claim that the best choice over every possible\n investment has been found."
