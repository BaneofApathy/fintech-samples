solutionPages:
- page: 152
  title: Constrained Optimization
  text: " Constrained Optimization\n\n   A10 | Worked solution — Choose a Feasible\
    \ Portfolio\n\n1. Calculate return and variance for each allowed candidate.\n\
    \   Stock weight                             Expected return Variance calculation\
    \                Volatility Feasible?\n   40%                                \
    \            0.4(10) +   0.0064 + 0.0009 =                      8.54% No\n   \
    \                                          0.6(4) = 6.4%    0.0073\n   50%   \
    \                                         0.5(10) +   0.0100 + 0.000625 =    \
    \                10.31% Yes\n                                             0.5(4)\
    \ = 7.0%    0.010625\n   60%                                            0.6(10)\
    \ +   0.0144 + 0.0004 =                      12.17% Yes\n                    \
    \                         0.4(4) = 7.6%    0.0148\n\n2. Take the square root of\
    \ each variance to obtain the reported volatility.\n3. Compare feasible candidates:\
    \ 50/50 has lower variance than 60/40.\n4. Allocate dollars: 100,000(0.50) = $50,000\
    \ to each asset."
  paragraphs:
  - Constrained Optimization
