      hints: *id007
      unit: ''
    volatilities:
      title: Volatility of each candidate
      hints: *id008
      unit: proportion
    weight:
      title: Stock weight of the chosen candidate
      hints: *id009
      unit: proportion
    stockDollars:
      title: Dollar allocation to stocks
      hints: *id010
      unit: $
    bondDollars:
      title: Dollar allocation to bonds
      hints: *id011
      unit: $
  readAloud:
  - Expected return is a weighted average. Variance combines each asset’s weighted
    risk and a co-movement term. Take its square root for volatility. Here correlation
    is zero, so the last term is zero. Enter 20% volatility as 0.20 before squaring.
  - Only the three supplied stock weights are allowed, and expected return must reach
    7%. Discard candidates that fail; choose the remaining one with smallest variance.
    Stock dollars = V w, Bond dollars = V (1 − w). Multiply total portfolio value
    by each allocation weight to turn fractions into dollars. This is a finite candidate
    comparison, not a claim that the best choice over every possible investment has
    been found.
  workedExplanation:
  - 'The lowest-risk candidate overall fails the return constraint. 50/50 is optimal
    only among these three permitted candidates under the supplied estimates. Neither
    the 7% expected return nor the volatility is guaranteed. '
  - Compare variance only after checking feasibility. A low-risk allocation can fail
    a mandatory return requirement. The covariance term is shown so students can see
    exactly what the zero-correlation assumption removes; the example assumes zero
    correlation.
  workedArithmetic:
  - 'At 40% stocks: return = 0.4 × 10% + 0.6 × 4% = 6.4%; variance = 0.4² × 0.20²
    + 0.6² × 0.05² = 0.0073; volatility = √0.0073 ≈ 8.54%. This fails the 7% return
    minimum.'
  - 'At 50% stocks: return = 0.5 × 10% + 0.5 × 4% = 7%; variance = 0.010625; volatility
    ≈ 10.31%.'
  - 'At 60% stocks: return = 0.6 × 10% + 0.4 × 4% = 7.6%; variance = 0.0148; volatility
    ≈ 12.17%.'
  - The 50/50 candidate has the lower feasible variance. Stock and bond allocations
    are each $100,000 × 0.50 = $50,000.
