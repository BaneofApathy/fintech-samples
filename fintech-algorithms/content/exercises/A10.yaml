  mistakes:
  - pattern: recompute
    message: Calculate stock weight × stock return + bond weight × bond return.
- id: variances
  title: Variance of each candidate
  expects: cells
  unit: ''
  tolerance:
    rel: 0.005
    abs: 5.0e-05
  hints: &id007
  - With zero correlation, add squared stock weight × stock variance and squared bond
    weight × bond variance.
  mistakes:
  - pattern: recompute
    message: With zero correlation, add squared stock weight × stock variance and
      squared bond weight × bond variance.
