learning:
  title: Why the Cutoff Need Not Be 50%
  scenario: Choose between passing and flagging a transaction with calibrated fraud
    probability p. Passing fraud incurs a loss; flagging a legitimate transaction
    incurs a cost. Correct actions have zero incremental cost, and flagging fully
    prevents fraud loss.
  task: Find the probability where the two expected costs are equal. Calculate pass
    and flag costs for each listed probability. Ignore capacity and other costs for
    this exercise.
  interpretation: The break-even threshold follows from the supplied loss table and
    effective intervention assumption. Review costs, imperfect prevention or capacity
    constraints would change the decision.
  summary: 'Break-even probability: {threshold}. Pass costs: {pass}. Flag costs: {review}.'
  labels: *id005
  steps:
    threshold:
      title: Break-even fraud probability
      hints: *id006
      unit: proportion
    pass:
      title: Expected passing costs
      hints: *id007
      unit: $
    review:
      title: Expected flagging costs
      hints: *id008
      unit: $
  readAloud:
  - Passing costs cFN × p in expectation. Flagging costs cFP × (1 − p). Equating them
    gives the threshold cFP / (cFN + cFP). Below the threshold passing is cheaper;
    above it flagging is cheaper. The two actions have equal modeled cost at the threshold.
  workedExplanation:
  - 'Under this loss table, flagging becomes preferable above about 0.79%, not 50%.
    This is a classroom optimum for the stated assumptions; adding review costs, imperfect
    intervention, customer harm, or capacity constraints changes the decision. '
  - A cost-based threshold can be far below 50% because the penalties are unequal.
    The calculation depends on calibrated probabilities and the assumed effectiveness
    of flagging. It does not establish a universal threshold for fraud detection.
  workedArithmetic:
  - Set 500p = 4(1 − p). Then 504p = 4 and p = 4/504 ≈ 0.0079365 = 0.79365%.
  - 'At p = 0.005: pass cost = 500 × 0.005 = $2.50; flag cost = 4 × 0.995 = $3.98.
    Passing is cheaper.'
  - 'At p = 0.01: pass cost = $5; flag cost = $3.96. At p = 0.10: pass cost = $50;
    flag cost = $3.60. Flagging is cheaper in both cases.'
