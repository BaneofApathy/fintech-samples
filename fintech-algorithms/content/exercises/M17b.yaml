interpretationPages:
- page: 349
  title: Threshold Economics
  text: " Threshold Economics\n\n   M17b | Interpretation\n\n What the answer means\n\
    \ Under this loss table, flagging becomes preferable above about 0.79%, not 50%.\
    \ This is a\n classroom optimum for the stated assumptions; adding review costs,\
    \ imperfect intervention,\n customer harm, or capacity constraints changes the\
    \ decision.\n Why these steps matter\n A cost-based threshold can be far below\
    \ 50% because the penalties are unequal. The calculation\n depends on calibrated\
    \ probabilities and the assumed effectiveness of flagging. It does not\n establish\
    \ a universal threshold for fraud detection."
