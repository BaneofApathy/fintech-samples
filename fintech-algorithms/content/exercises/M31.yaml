latex:
- Sharpe=\frac{\bar r-r_f}{\sigma},\quad Sortino=\frac{\bar r-target}{\sigma_{downside}}
- \bar r=\frac1n\sum_tr_t,\quad s_r=\sqrt{\frac{\sum_t(r_t-\bar r)^2}{n-1}}
- d_r=\sqrt{\frac1n\sum_t\min(r_t-r_{target},0)^2}
