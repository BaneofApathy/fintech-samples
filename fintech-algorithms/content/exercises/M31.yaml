learning:
  title: Return Relative to Which Risk?
  scenario: Two funds have annualized arithmetic returns, total volatility and downside
    deviation measured consistently over the same period. The risk-free rate also
    serves as the minimum acceptable return.
  task: Calculate each fund’s excess return, Sharpe ratio and Sortino ratio. Inputs
    are already annualized; do not annualize again.
  interpretation: Sharpe charges for total volatility; Sortino charges for downside
    deviation from the stated target. Ratios describe the evaluated return and risk
    estimates, not guaranteed future performance or tail safety.
  summary: 'Sharpe ratios: A {sharpeA}, B {sharpeB}. Sortino ratios: A {sortinoA},
    B {sortinoB}.'
