interpretationPages:
- page: 74
  title: Isolation Forest
  text: " Isolation Forest\n\n   A05 | Interpretation\n\n What the answer means\n\
    \ A was isolated fastest and receives the highest anomaly score. 0.7071 is not\
    \ a 70.71% fraud\n probability. A large legitimate payment can also be unusual;\
    \ investigation supplies the missing\n evidence.\n Why these steps matter\n Normalization\
    \ makes the path length a comparable score. It does not add fraud labels. The\n\
    \ investor or merchant’s intent is absent from this calculation; the available\
    \ reviewer gets the\n most unusual case, not a mathematically proven fraud."
