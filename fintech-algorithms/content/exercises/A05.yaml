  text: " Isolation Forest\n\n   A05 | Formula explained (1/1)\n\n Question: Which\
    \ payment was easiest for the trees to separate from other payments?\n       \
    \                           h1 + h2 + · · · + hB\n                           \
    \  h̄ =                      ,   s = 2−h̄/c .\n                              \
    \             B\n Read it aloud: Average the isolation path lengths, divide by\
    \ the supplied normalization\n constant, negate that ratio, and use it as the\
    \ exponent of 2.\n A shorter average path produces a larger score with this convention.\
    \ Rank scores from largest to\n smallest.\n The exercise supplies c = 4 so students\
    \ can focus on scoring, not on calculating the sample-size\n adjustment."
