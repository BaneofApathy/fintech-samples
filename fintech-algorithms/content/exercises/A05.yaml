learning:
  title: Rank Unusual Payments
  scenario: Three transactions have isolation path lengths from three fitted trees.
    The first three values belong to transaction A, the next three to B, and the last
    three to C.
  task: Average each transaction’s path lengths and calculate score = 2^(−average
    path / normalization constant). Rank the transactions for a single investigation
    slot.
  interpretation: Short paths produce high anomaly scores under this convention. A
    high score shows unusual behavior; it does not establish fraud or give a fraud
    probability.
  summary: 'Anomaly scores for A, B and C: {scores}. Highest-scoring transaction number:
    {top}.'
  labels: *id003
  steps:
    means:
      title: Average path lengths for A, B and C
      hints: *id004
      unit: ''
    scores:
      title: Anomaly scores for A, B and C
      hints: *id005
      unit: ''
    top:
      title: Highest-scoring transaction (A=1, B=2, C=3)
      hints: *id006
      unit: ''
  readAloud:
  - Average the isolation path lengths, divide by the supplied normalization constant,
    negate that ratio, and use it as the exponent of 2. A shorter average path produces
    a larger score with this convention. Rank scores from largest to smallest. The
    exercise supplies c = 4 so students can focus on scoring, not on calculating the
    sample-size adjustment.
  workedExplanation:
  - 'A was isolated fastest and receives the highest anomaly score. 0.7071 is not
    a 70.71% fraud probability. A large legitimate payment can also be unusual; investigation
    supplies the missing evidence. '
  - Normalization makes the path length a comparable score. It does not add fraud
    labels. The investor or merchant’s intent is absent from this calculation; the
    available reviewer gets the most unusual case, not a mathematically proven fraud.
  workedArithmetic:
  - 'Average paths: A = (2 + 3 + 1) / 3 = 2; B = (4 + 5 + 3) / 3 = 4; C = (6 + 5 +
    7) / 3 = 6.'
  - 'Scores: A = 2^(−2/4) ≈ 0.7071; B = 2^(−4/4) = 0.5; C = 2^(−6/4) ≈ 0.3536.'
  - 0.7071 > 0.5 > 0.3536, so the one available investigation slot goes to A.
