solutionPages:
- page: 73
  title: Isolation Forest
  text: " Isolation Forest\n\n   A05 | Worked solution — Rank Unusual Payments\n\n\
    1. Average the path lengths:\n                       h̄A = (2 + 3 + 1)/3 = 2,\
    \               h̄B = 4,     h̄C = 6.\n2. Normalize and calculate scores:\n  \
    \ Transaction                              Average path Calculation          \
    \               Score\n   A                                                  \
    \ 2 2−2/4                               0.7071\n                             \
    \                             −4/4\n   B                                     \
    \              4 2                                   0.5000\n                \
    \                                          −6/4\n   C                        \
    \                           6 2                                   0.3536\n\n3.\
    \ Rank highest first: A, B, C. Send A to the available investigator."
  paragraphs:
  - Isolation Forest
  - A05 | Worked solution — Rank Unusual Payments
  - '1. Average the path lengths: h̄A = (2 + 3 + 1)/3 = 2, h̄B = 4, h̄C = 6. 2. Normalize
    and calculate scores: Transaction Average path Calculation Score A 2 2−2/4 0.7071
    −4/4 B 4 2 0.5000 −6/4 C 6 2 0.3536'
  - '3. Rank highest first: A, B, C. Send A to the available investigator.'
