question: "Three transactions have the following isolation path lengths across three\
  \ fitted trees:\n                                                              For\
  \ this exercise, the supplied normalization\n   Transaction                    \
  \     Tree     Tree   Tree\n                                          1        2\
  \      3\n                                                              constant\
  \ is c = 4. Calculate the anomaly score\n                                      \
  \                        using:\n   A                                        2 \
  \     3      1\n                                                               \
  \    s = 2−h̄/c ,        h̄ = average path length.\n   B                       \
  \                 4      5      3\n   C                                        6\
  \      5      7   1. Calculate each average path length and score.\n           \
  \                                                   2. Rank the transactions. Only\
  \ one can be\n                                                                 investigated\
  \ now.\n                                                              3. Does a\
  \ score near 0.71 mean a 71% probability\n                                     \
  \                            of fraud?\n                                       \
  \                       Use 2−0.5 = 0.7071 and 2−1.5 = 0.3536."
