solutionPages:
- page: 435
  title: Inertia
  text: " Inertia\n\n   M27a | Worked solution — When Does Another Segment Stop Helping?\n\
    \n1. One cluster: centroid = (1 + 2 + 8 + 9)/4 = 5.\n            I1 = (1 − 5)2\
    \ + (2 − 5)2 + (8 − 5)2 + (9 − 5)2 = 16 + 9 + 9 + 16 = 50.\n2. Two clusters: centroids\
    \ 1.5 and 8.5.\n                               I2 = 0.25 + 0.25 + 0.25 + 0.25\
    \ = 1.\n3. Three clusters: centroids 1.5, 8, 9.\n                            \
    \     I3 = 0.25 + 0.25 + 0 + 0 = 0.5.\n4. Reductions: 50 − 1 = 49, then 1 − 0.5\
    \ = 0.5. The apparent elbow is k = 2."
  paragraphs:
  - Inertia
  - M27a | Worked solution — When Does Another Segment Stop Helping?
  - '1. One cluster: centroid = (1 + 2 + 8 + 9)/4 = 5. I1 = (1 − 5)2 + (2 − 5)2 +
    (8 − 5)2 + (9 − 5)2 = 16 + 9 + 9 + 16 = 50. 2. Two clusters: centroids 1.5 and
    8.5. I2 = 0.25 + 0.25 + 0.25 + 0.25 = 1. 3. Three clusters: centroids 1.5, 8,
    9. I3 = 0.25 + 0.25 + 0 + 0 = 0.5. 4. Reductions: 50 − 1 = 49, then 1 − 0.5 =
    0.5. The apparent elbow is k = 2.'
