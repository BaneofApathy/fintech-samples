solutionPages:
- page: 86
  title: ARIMA
  text: " ARIMA\n\n   A06 | Worked solution — Forecast Settlement Outflows\n\n1. Calculate\
    \ the latest observed change: 116 − 110 = 6 million.\n2. Forecast the next change\
    \ and level:\n                       ∆y\n                       c\n          \
    \                t+1 = 0.5(6) = 3,               ŷt+1 = 116 + 3 = 119.\n3. Forecast\
    \ one more step, using the forecasted change:\n                    ∆y\n      \
    \              c\n                       t+2 = 0.5(3) = 1.5,    ŷt+2 = 119 +\
    \ 1.5 = 120.5.\n4. Add the buffer: 119 + 10 = $129 million.\n5. Evaluate after\
    \ observing the next day: Model error = |125 − 119| = 6 million; last-value\n\
    \   error = |125 − 116| = 9 million."
  paragraphs:
  - ARIMA
  - A06 | Worked solution — Forecast Settlement Outflows
  - '1. Calculate the latest observed change: 116 − 110 = 6 million. 2. Forecast the
    next change and level: ∆y c t+1 = 0.5(6) = 3, ŷt+1 = 116 + 3 = 119. 3. Forecast
    one more step, using the forecasted change: ∆y c t+2 = 0.5(3) = 1.5, ŷt+2 = 119
    + 1.5 = 120.5. 4. Add the buffer: 119 + 10 = $129 million. 5. Evaluate after observing
    the next day: Model error = |125 − 119| = 6 million; last-value error = |125 −
    116| = 9 million.'
  source:
    pages:
    - 86
    verbatim: true
interpretationPages:
- page: 87
  title: ARIMA
  text: " ARIMA\n\n   A06 | Interpretation\n\n What the answer means\n The model reduces\
    \ this day’s absolute error by $3 million. Treasury’s $129 million holding\n exceeds\
    \ the realized outflow by $4 million. One successful day does not validate the\
    \ model or\n establish that the fixed buffer is adequate.\n Why these steps matter\n\
    \ A forecasted change and a forecasted level have different jobs even though both\
    \ use dollar units.\n Treasury needs the level to fund settlements. The calculation\
    \ must not use the actual 125 until\n the evaluation step, because it was unknown\
    \ when the forecast was issued."
