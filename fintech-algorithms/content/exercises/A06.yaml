  title: ARIMA
  text: " ARIMA\n\n   A06 | Formula explained (1/1)\n\n Question: What outflow level\
    \ follows from forecasting the next change?\n                           ∆yt =\
    \ yt − yt−1 ,      ∆y\n                                                  c   \
    \   = 0.5∆yt ,\n                                                            t+1\n\
    \n                                            ŷt+1 = yt + ∆y\n              \
    \                                           c\n                              \
    \                              t+1 .\n\n Read it aloud: Subtract yesterday’s level\
    \ from today’s; predict half of that change for\n tomorrow; add the predicted\
    \ change to today’s level.\n For a second forecast step, use the first forecasted\
    \ change because the future observation is not\n yet available. The fixed liquidity\
    \ holding is first-day forecast + US$10 million.\n ARIMA(1,1,0): One autoregressive\
    \ lag, one differencing step, and no moving-average error lag.\n Drift is set\
    \ to zero here."
