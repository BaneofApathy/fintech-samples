id: A06
title: Forecast Settlement Outflows
minutes: 8
kind: algorithm
parent: time-series
question: "Daily settlement outflows, in $ millions, were 100, 110, and 116 over the\
  \ last three days.\n A fitted ARIMA(1,1,0) model forecasts changes using:\n    \
  \                                        ∆yt = yt − yt−1 ,   ∆y\n              \
  \                                                  c\n                         \
  \                                          t+1 = 0.5∆yt .\n\n Forecast future errors\
  \ as zero; there is no additional drift term.\n1. Forecast the next two daily outflow\
  \ levels, without using future observations.\n2. Treasury adds a fixed $10 million\
  \ buffer to the first forecast. How much liquidity does it\n   hold?\n3. The next\
  \ day’s actual outflow later becomes 125. Compare the model’s absolute error with\
  \ a\n   last-value forecast of 116."
