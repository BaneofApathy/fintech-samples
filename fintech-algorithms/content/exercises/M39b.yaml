learning:
  title: Calculate Both Bottlenecks
  scenario: A scoring API and a human investigation team have separate queues. Both
    start empty, arrivals and completion rates stay constant, and no items are dropped.
  task: Convert API capacity to requests per second and calculate its backlog after
    the supplied minutes. Separately calculate human daily capacity, daily excess,
    multi-day backlog and per-analyst pace needed to keep up.
  interpretation: Increasing API speed does not increase human review capacity. Multiply
    a rate gap by matching elapsed time to obtain a backlog count; do not confuse
    that count with latency.
  summary: 'API backlog: {requestBacklog} requests. Human backlog: {alertBacklog}
    alerts. Required analyst pace: {requiredPace}.'
