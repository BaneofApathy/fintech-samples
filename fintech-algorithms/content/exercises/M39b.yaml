  readAloud:
  - Convert processing capacity into the arrival rate’s time unit. Multiply any excess
    arrival rate by elapsed time. This simplified queue calculation starts empty,
    uses constant rates, and assumes no drops or added capacity. Capacity here is
    the maximum sustainable processing rate established by the load test, not a guarantee
    of low latency at every load.
  - Multiply analyst count by each analyst’s daily completion capacity. Subtract that
    from daily arrivals to find the day’s extra backlog. Divide incoming alerts by
    analyst count to see the pace required to keep up. This is a separate queue from
    the scoring service. Faster scoring does not increase investigator capacity.
  workedExplanation:
  - 'There are two separate capacity failures: scoring cannot keep up with incoming
    payments, and investigators cannot work the generated queue. Increasing API capacity
    would not fix the review backlog. A threshold or staffing change must account
    for the fraud that would remain unreviewed. '
  - A rate difference has units of requests per second or alerts per day. Multiplying
    by matching elapsed time produces a count. Keeping the units explicit prevents
    confusing 12,000 requests per minute with 12,000 per second, or interpreting a
    queue count as a response time.
  workedArithmetic:
  - API capacity = 12,000/60 = 200 requests/second. Arrival excess = 250 − 200 = 50
    requests/second.
  - Ten-minute API backlog = 50 × 10 × 60 = 30,000 requests.
  - Human capacity = 15 × 20 = 300 cases/day. Daily backlog growth = 500 − 300 = 200
    alerts; three-day backlog = 200 × 3 = 600.
  - Required analyst pace = 500/15 ≈ 33.33 cases/day, compared with the supplied capacity
    of 20.
