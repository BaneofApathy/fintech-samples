solutionPages:
- page: 277
  title: KS
  text: " KS\n\n   M10 | Worked solution — Find the Largest Separation\n\n1. Divide\
    \ each class count by its own total.\n   Cutoff                              \
    \           Default capture   Non-default capture         Absolute gap\n   A \
    \                                               5/20 = 25%           2/80 = 2.5%\
    \                 22.5 pp\n   B                                              \
    \ 12/20 = 60%           12/80 = 15%                  45 pp\n   C             \
    \                                  18/20 = 90%           40/80 = 50%         \
    \          40 pp\n   D                                              20/20 = 100%\
    \          80/80 = 100%                    0 pp\n\n2. Select the largest separation:\
    \ KS = 0.45, or 45 percentage points, at cutoff B among\n   those evaluated."
