solutionPages:
- page: 228
  title: Precision
  text: " Precision\n\n   M04 | Worked solution — How Productive Is the Review Queue?\n\
    \n1. Precision: Queue A = 15/50 = 30%; Queue B = 8/10 = 80%.\n2. Total review\
    \ cost: A = 50(4) = $200; B = 10(4) = $40.\n3. Review cost per confirmed fraud:\n\
    \                        A = 200/15 = $13.33,              B = 40/8 = $5.00.\n\
    4. Compare capture: A finds 15 frauds; B finds only 8, despite its higher precision."
  paragraphs:
  - Precision
  - M04 | Worked solution — How Productive Is the Review Queue?
  - '1. Precision: Queue A = 15/50 = 30%; Queue B = 8/10 = 80%. 2. Total review cost:
