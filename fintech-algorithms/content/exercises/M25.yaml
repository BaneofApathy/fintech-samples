interpretationPages:
- page: 419
  title: Pinball Loss
  text: " Pinball Loss\n\n   M25 | Interpretation\n\n What the answer means\n This\
    \ scoring rule strongly discourages underestimating a high liquidity quantile.\
    \ The 19-to-1\n weighting comes from choosing the 95th percentile; it is not automatically\
    \ the bank’s actual\n funding-cost ratio. The computed score is not a realized\
    \ cash loss.\n Why these steps matter\n The high quantile intentionally penalizes\
    \ shortfalls more than excess. The weights describe the\n scoring target, not\
    \ observed borrowing fees or a stated regulatory reserve requirement. The\n average\
    \ 6.5 is in weighted million-dollar error units, not realized loss."
