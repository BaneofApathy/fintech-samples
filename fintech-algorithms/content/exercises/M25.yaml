formulaPages:
- page: 413
  title: Pinball Loss
  text: " Pinball Loss\n\n   M25 | Formula explained (1/1)\n\n Question: How should\
    \ an error be scored when the forecast is intended to be a high quantile?\n  \
    \                                       (\n                                  \
    \        τ (y − q̂),       y ≥ q̂,\n                            Lτ (y, q̂) =\n\
    \                                          (1 − τ )(q̂ − y), y < q̂.\n Read it\
    \ aloud: If actual demand is above the quantile forecast, multiply the shortage\
    \ by tau.\n Otherwise multiply the excess by one minus tau.\n Average the daily\
    \ losses for an overall score. The two branches meet at zero when actual equals\n\
    \ forecast.\n At tau 0.95, equal-sized under- and overforecasts receive weights\
    \ 0.95 and 0.05."
