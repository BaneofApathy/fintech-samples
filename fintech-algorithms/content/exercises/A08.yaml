solutionPages:
- page: 112
  title: Transformers
  text: " Transformers\n\n   A08 | Worked solution — A Small Attention Calculation\n\
    \n1. Normalize attention scores: eln 1 = 1 and eln 3 = 3; total = 4. The weights\
    \ are 0.25 and\n   0.75.\n2. Combine the values:\n                     h = 0.25(−1)\
    \ + 0.75(+1) = −0.25 + 0.75 = 0.50.\n3. Calculate classifier logits: [2h, 0, −2h]\
    \ = [1, 0, −1].\n4. Normalize again: The denominator is 2.718 + 1 + 0.368 = 4.086.\n\
    \           P (positive) = 66.52%, P (neutral) = 24.47%, P (negative) = 9.01%.\n\
    5. Apply the routing rule: Positive is the largest score, but 66.52% < 70%. Send\
    \ the\n   sentence to human review."
  paragraphs:
  - Transformers
  - A08 | Worked solution — A Small Attention Calculation
  - '1. Normalize attention scores: eln 1 = 1 and eln 3 = 3; total = 4. The weights
    are 0.25 and 0.75. 2. Combine the values: h = 0.25(−1) + 0.75(+1) = −0.25 + 0.75
    = 0.50. 3. Calculate classifier logits: [2h, 0, −2h] = [1, 0, −1]. 4. Normalize
    again: The denominator is 2.718 + 1 + 0.368 = 4.086. P (positive) = 66.52%, P
    (neutral) = 24.47%, P (negative) = 9.01%. 5. Apply the routing rule: Positive
    is the largest score, but 66.52% < 70%. Send the sentence to human review.'
  source:
    pages:
    - 112
    verbatim: true
interpretationPages:
- page: 113
  title: Transformers
  text: " Transformers\n\n   A08 | Interpretation\n\n What the answer means\n Context\
    \ changes the representation of “loss”; the improvement word receives more weight\
    \ in\n this toy calculation. The output is a sentiment score, not an investment\
    \ recommendation.\n Attention weights alone are not a complete explanation of\
    \ a real transformer.\n Why these steps matter\n The representation h is not itself\
    \ a probability. The attention weights sum to one, and so do the\n class probabilities,\
    \ but they describe different objects. A high weight on a word is not proof that\n\
    \ the word caused a real model’s final decision."
  paragraphs:
  - Transformers
  - A08 | Interpretation
  - What the answer means Context changes the representation of “loss”; the improvement
    word receives more weight in this toy calculation. The output is a sentiment score,
    not an investment recommendation. Attention weights alone are not a complete explanation
    of a real transformer. Why these steps matter The representation h is not itself
    a probability. The attention weights sum to one, and so do the class probabilities,
    but they describe different objects. A high weight on a word is not proof that
    the word caused a real model’s final decision.
