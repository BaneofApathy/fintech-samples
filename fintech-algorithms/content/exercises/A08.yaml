  workedExplanation:
  - 'Context changes the representation of “loss”; the improvement word receives more
    weight in this toy calculation. The output is a sentiment score, not an investment
    recommendation. Attention weights alone are not a complete explanation of a real
    transformer. '
  - The representation h is not itself a probability. The attention weights sum to
    one, and so do the class probabilities, but they describe different objects. A
    high weight on a word is not proof that the word caused a real model’s final decision.
  workedArithmetic:
  - Exponentiated attention logits are exp(ln 1) = 1 and exp(ln 3) = 3. Weights are
    1/4 = 0.25 and 3/4 = 0.75.
  - h = 0.25 × (−1) + 0.75 × 1 = 0.50. Class logits [2h, 0, −2h] are [1, 0, −1].
  - Softmax denominator ≈ 2.718 + 1 + 0.368 = 4.086. Class probabilities are approximately
    [66.52%, 24.47%, 9.01%].
  - 66.52% < 70%, so the largest class score does not meet the automatic-label threshold;
    use human review.
