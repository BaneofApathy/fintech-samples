  title: A Small Attention Calculation
  scenario: This toy attention head represents “loss narrowed.” Token logits are already
    scaled. Token values are supplied in the same order. This is not a real FinBERT
    prediction.
  task: Apply softmax to token logits, compute the weighted representation h, then
    apply softmax to class logits [2h, 0, −2h] for positive, neutral and negative
    sentiment. Assign a label automatically only if the highest probability reaches
    the threshold.
  interpretation: Token attention weights and class probabilities each sum to one,
    but describe different things. The representation h is not a probability, and
    attention weights alone do not explain a real transformer’s decision.
