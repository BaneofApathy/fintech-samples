learning:
  title: Move the Threshold
  scenario: Fraud scores and actual labels are listed in matching transaction order.
    Label 1 means fraud and 0 means legitimate. Flag scores at or above each threshold.
  task: For each threshold, count TP and FP, then calculate TPR and FPR. Enter results
    in threshold order. Plot FPR horizontally and TPR vertically to locate the ROC
    operating points.
  interpretation: Changing a threshold changes who is flagged. Actual fraud and legitimate
    population counts stay fixed. An ROC curve shows possible tradeoffs but does not
    choose a cost-effective policy for you.
  summary: 'True-positive rates: {TPR}. False-positive rates: {FPR}.'
