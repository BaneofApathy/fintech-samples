solutionPages:
- page: 261
  title: ROC
  text: " ROC\n\n   M08 | Worked solution — Move the Threshold\n\n1. Count actual\
    \ classes: There are 3 frauds and 3 legitimate transactions.\n2. Count flags and\
    \ calculate rates.\n   Threshold                       Flagged        TP     \
    \       FP       FPR = F P/3         TPR = T P/3\n   0.85                    \
    \        A               1               0                  0%          33.33%\n\
    \   0.65                            A, B, C         2               1        \
    \       33.33%         66.67%\n   0.25                            A–E        \
    \     3               2               66.67%          100%\n\n3. Plot (F P R,\
    \ T P R): (0, 1/3), (1/3, 2/3), and (2/3, 1).\n4. Compare the lower two cutoffs:\
    \ Lowering 0.65 to 0.25 catches one more fraud and flags\n   one more legitimate\
    \ transaction."
  paragraphs:
  - ROC
  - M08 | Worked solution — Move the Threshold
  - '1. Count actual classes: There are 3 frauds and 3 legitimate transactions. 2.
    Count flags and calculate rates. Threshold Flagged TP FP FPR = F P/3 TPR = T P/3
