  workedExplanation:
  - 'Each ROC point represents a different capture-versus-interruption tradeoff. These
    are selected points, not the full curve. The ROC curve itself does not choose
    the economically appropriate threshold. '
  - The curve shows possible operating choices, not one mandatory threshold. Moving
    toward higher capture may also interrupt more legitimate activity. In this small
