  readAloud:
  - For each fill, multiply shares bought by the extra price above arrival. Add the
    benchmark cost of shares left unfilled when the price moved, then add fees. This
    is the buy-order convention specified in the exercise. A higher execution or closing
    price produces a positive cost. The unfilled-share term is a benchmark opportunity
    cost, not a paid transaction fee.
  - Add filled quantities and divide by the intended quantity. Multiply the intended
    quantity by the arrival price for the original target notional, then express total
    shortfall as basis points of that amount. Do not change the denominator to the
    executed portion merely because some shares remain unfilled.
  workedExplanation:
  - 'Looking only at executed prices would omit the cost of missing 200 shares while
    the market rose. The opportunity cost is a benchmark-based estimate, not a cash
    fee. The stated shortfall convention and completion rate should accompany the
    result. '
  - The intended order is the economic reference. Ignoring unfilled shares could make
    a policy look cheap simply by avoiding trades while the market moves against the
    unfinished order. Reporting completion alongside full-order shortfall exposes
    that failure.
  workedArithmetic:
  - Completion = (400 + 400) / 1,000 = 80%.
  - Executed slippage = 400 × (50.10 − 50.00) + 400 × (50.20 − 50.00) = $40 + $80
    = $120.
  - Unfilled opportunity cost = 200 × (50.30 − 50.00) = $60. Total shortfall = 120
    + 60 + 20 = $200.
  - Intended notional = 1,000 × $50 = $50,000. Shortfall = (200 / 50,000) × 10,000
    = 40 bps.
