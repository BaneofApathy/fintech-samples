question: "A desk must buy 1,000 shares. The arrival-price benchmark is $50.00 per\
  \ share.\n   Execution                                               Shares    \
  \                                 Price\n   First fill                         \
  \                        400                                    $50.10\n   Second\
  \ fill                                                400                      \
  \              $50.20\n   Still unfilled                                       \
  \      200                      Closing price: $50.30\n\n Total fees are $20. Define\
  \ buy-order implementation shortfall as executed price slippage versus\n arrival,\
  \ plus opportunity cost on unfilled shares at the closing price, plus fees.\n Calculate\
  \ completion rate, each cost component, total shortfall, and shortfall in basis\
  \ points of\n the original target notional. Use 1 bp = 0.0001."
