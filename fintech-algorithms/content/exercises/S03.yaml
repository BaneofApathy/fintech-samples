interpretationPages:
- page: 173
  title: Implementation Shortfall
  text: " Implementation Shortfall\n\n   S03 | Interpretation\n\n What the answer\
    \ means\n Looking only at executed prices would omit the cost of missing 200 shares\
    \ while the market\n rose. The opportunity cost is a benchmark-based estimate,\
    \ not a cash fee. The stated shortfall\n convention and completion rate should\
    \ accompany the result.\n Why these steps matter\n The intended order is the economic\
    \ reference. Ignoring unfilled shares could make a policy look\n cheap simply\
    \ by avoiding trades while the market moves against the unfinished order. Reporting\n\
    \ completion alongside full-order shortfall exposes that failure."
  paragraphs:
  - Implementation Shortfall
  - S03 | Interpretation
