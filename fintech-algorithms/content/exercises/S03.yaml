learning:
  title: Include the Shares You Did Not Buy
  scenario: A buy order is partially filled. Implementation shortfall includes price
    slippage from the arrival price, opportunity cost on unfilled shares at the closing
    price, and fees.
  task: Calculate completion, both cost components and total cost. Express total cost
    in basis points of the intended order’s arrival-price notional. One basis point
    is 0.0001.
  interpretation: Unfilled shares still belong in the intended-order comparison. Opportunity
    cost is a benchmark estimate, not a cash transaction fee.
