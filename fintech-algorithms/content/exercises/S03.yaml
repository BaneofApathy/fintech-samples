solutionPages:
- page: 172
  title: Implementation Shortfall
  text: " Implementation Shortfall\n\n   S03 | Worked solution — Include the Shares\
    \ You Did Not Buy\n\n1. Completion: (400 + 400)/1,000 = 80%.\n2. Executed slippage:\n\
    \                 400(50.10 − 50.00) + 400(50.20 − 50.00) = 40 + 80 = $120.\n\
    3. Unfilled-share opportunity cost: 200(50.30 − 50.00) = $60.\n4. Total shortfall:\
    \ 120 + 60 + 20 = $200.\n5. Original target notional: 1,000(50) = $50,000.\n \
    \                                            200\n                         Shortfall\
    \ in bps =        × 10,000 = 40 bps.\n                                       \
    \     50,000"
  paragraphs:
  - Implementation Shortfall
  - S03 | Worked solution — Include the Shares You Did Not Buy
  - '1. Completion: (400 + 400)/1,000 = 80%. 2. Executed slippage: 400(50.10 − 50.00)
