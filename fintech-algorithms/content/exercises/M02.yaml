learning:
  title: Compare Against Doing Nothing
  scenario: Compare a fraud detector with a baseline that labels every transaction
    legitimate. Both are evaluated on the same transactions, with fraud as the positive
    class.
  task: Calculate detector accuracy and mistakes, then baseline accuracy, frauds caught
    and mistakes.
  interpretation: Accuracy weights each transaction equally. A high accuracy can come
    from correctly passing the majority class while catching no fraud. Policy choice
    also needs loss amounts and review costs.
  summary: 'Detector accuracy: {accuracy}; always-legitimate baseline: {baseline}.
    The baseline catches {caught} frauds.'
