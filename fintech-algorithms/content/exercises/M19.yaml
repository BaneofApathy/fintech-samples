interpretationPages:
- page: 367
  title: Fairness Diagnostics
  text: " Fairness Diagnostics\n\n   M19 | Interpretation\n\n What the answer means\n\
    \ Approval rates and repayer capture differ even though both groups have the same\
    \ FPR. These\n diagnostics identify differences that need investigation; they\
    \ do not independently establish\n fairness, unfairness, or a legal conclusion.\
    \ Outcome definitions, population differences, and\n uncertainty remain important.\n\
    \ Why these steps matter\n The two groups have different repayment prevalences\
    \ in the supplied benchmark. Equal FPR\n alone therefore does not imply equal\
    \ approval rates or equal TPR. The arithmetic describes the\n pattern, not its\
    \ cause or whether any decision is legally justified."
  paragraphs:
  - Fairness Diagnostics
  - M19 | Interpretation
  - What the answer means Approval rates and repayer capture differ even though both
    groups have the same FPR. These diagnostics identify differences that need investigation;
    they do not independently establish fairness, unfairness, or a legal conclusion.
    Outcome definitions, population differences, and uncertainty remain important.
    Why these steps matter The two groups have different repayment prevalences in
    the supplied benchmark. Equal FPR alone therefore does not imply equal approval
    rates or equal TPR. The arithmetic describes the pattern, not its cause or whether
    any decision is legally justified.
