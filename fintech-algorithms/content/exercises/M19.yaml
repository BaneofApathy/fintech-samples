steps:
- id: selectionA
  title: Group A approval rate
  expects: number
  unit: proportion
  tolerance:
    rel: 0.005
    abs: 5.0e-05
  hints: &id004
  - Divide A’s approvals by A’s applicants.
  mistakes:
  - pattern: recompute
    message: Divide A’s approvals by A’s applicants.
- id: selectionB
  title: Group B approval rate
  expects: number
  unit: proportion
  tolerance:
    rel: 0.005
    abs: 5.0e-05
  hints: &id005
  - Divide B’s approvals by B’s applicants.
  mistakes:
  - pattern: recompute
    message: Divide B’s approvals by B’s applicants.
- id: ratio
  title: Selection-rate ratio B/A
  expects: number
  unit: ''
  tolerance:
    rel: 0.005
    abs: 5.0e-05
  hints: &id006
  - Divide B’s approval rate by A’s approval rate.
  mistakes:
  - pattern: recompute
    message: Divide B’s approval rate by A’s approval rate.
- id: TPRA
  title: Group A repayer true-positive rate
  expects: number
  unit: proportion
  tolerance:
    rel: 0.005
    abs: 5.0e-05
  hints: &id007
  - Divide approved repayers in A by all repayers in A.
  mistakes:
  - pattern: recompute
    message: Divide approved repayers in A by all repayers in A.
- id: TPRB
  title: Group B repayer true-positive rate
  expects: number
  unit: proportion
  tolerance:
    rel: 0.005
    abs: 5.0e-05
  hints: &id008
  - Divide approved repayers in B by all repayers in B.
  mistakes:
  - pattern: recompute
    message: Divide approved repayers in B by all repayers in B.
- id: gap
  title: Absolute repayer TPR gap
  expects: number
  unit: proportion
  tolerance:
    rel: 0.005
    abs: 5.0e-05
  hints: &id009
  - Take the absolute difference between the two TPRs.
  mistakes:
  - pattern: recompute
    message: Take the absolute difference between the two TPRs.
- id: FPRA
  title: Group A non-repayer false-positive rate
  expects: number
  unit: proportion
  tolerance:
    rel: 0.005
    abs: 5.0e-05
  hints: &id010
  - Subtract approved repayers from approvals; divide by applicants minus repayers
    in A.
  mistakes:
  - pattern: recompute
    message: Subtract approved repayers from approvals; divide by applicants minus
      repayers in A.
- id: FPRB
  title: Group B non-repayer false-positive rate
  expects: number
  unit: proportion
  tolerance:
    rel: 0.005
    abs: 5.0e-05
  hints: &id011
  - Use the corresponding non-repayer counts for B.
  mistakes:
  - pattern: recompute
    message: Use the corresponding non-repayer counts for B.
learning:
  title: Compare Rates, Not Just Counts
  scenario: A retrospective lending benchmark knows repayment outcomes for every applicant.
    Approval is the positive prediction; repayment is the positive outcome. These
    are simulated decisions, so rejected-applicant outcome gaps are outside this example.
  task: Calculate approval rates, the B/A selection-rate ratio, repayment TPRs, their
    absolute gap, and FPRs among non-repayers.
  interpretation: Different approval rates can coexist with equal FPR when repayment
    prevalences differ. These diagnostics identify differences to investigate; they
    do not independently establish fairness, cause or a legal conclusion.
  summary: 'Approval-rate ratio B/A: {ratio}. Repayer TPR gap: {gap}. FPRs: A {FPRA},
    B {FPRB}.'
