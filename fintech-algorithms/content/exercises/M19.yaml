  readAloud:
  - Calculate approvals among all applicants, approved repayers among all repayers,
    and approved non-repayers among all non-repayers. Here the positive decision is
    approval and the positive actual outcome is repayment. That differs from the fraud-positive
    convention used in most earlier exercises.
  - Subtract the repayer approval rates. This is a rate gap; multiply the decimal
    difference by 100 to state it in percentage points. The selection-rate ratio is
    a quotient, not a difference. It uses A as the reference group because the problem
    specifies B/A. The exercise is retrospective with known outcomes for every case.
    These diagnostics describe differences; no standalone legal or causal conclusion
    follows from the arithmetic.
  workedExplanation:
  - 'Approval rates and repayer capture differ even though both groups have the same
    FPR. These diagnostics identify differences that need investigation; they do not
    independently establish fairness, unfairness, or a legal conclusion. Outcome definitions,
    population differences, and uncertainty remain important. '
  - The two groups have different repayment prevalences in the supplied benchmark.
    Equal FPR alone therefore does not imply equal approval rates or equal TPR. The
    arithmetic describes the pattern, not its cause or whether any decision is legally
    justified.
  workedArithmetic:
  - 'Approval rates: A = 600/1,000 = 60%; B = 400/1,000 = 40%. B/A selection-rate
    ratio = 0.40/0.60 ≈ 0.667.'
  - 'Repayer TPRs: A = 560/800 = 70%; B = 300/500 = 60%; gap = 10 percentage points.'
  - A has 1,000 − 800 = 200 non-repayers and 600 − 560 = 40 approved non-repayers,
    so FPR = 40/200 = 20%.
  - B has 1,000 − 500 = 500 non-repayers and 400 − 300 = 100 approved non-repayers,
    so FPR = 100/500 = 20%.
