formulaPages:
- page: 232
  title: Recall
  text: " Recall\n\n   M05 | Formula explained (1/1)\n\n Question: What fraction of\
    \ fraud was found, and how much loss remains from misses?\n                  \
    \                     TP\n                         Recall =             ,    F\
    \ N = F − T P,\n                                   TP + FN\n                 \
    \                    Lmiss = cF N F N.\n Read it aloud: Divide caught frauds by\
    \ all actual frauds. Subtract the caught count from the\n total to find misses.\
    \ Multiply misses by the assumed loss per miss.\n This is event recall: each fraud\
    \ counts once. Because the example assigns every fraud the\n same US$2,000 loss,\
    \ the capture fractions also describe the share of fraud value detected here."
