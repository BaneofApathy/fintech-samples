question: "A batch contains 20 actual frauds.\n▶ Detector A catches 15.\n▶ Detector\
  \ B catches 8.\n Assume each missed fraud causes $2,000 of unrecovered loss. For\
  \ this exercise, all frauds\n have the same loss amount.\n                     \
  \                          Frauds caught\n                                    Recall\
