learning:
  title: Can the Allocation Be Implemented?
  scenario: A fully invested portfolio is rebalanced without market movement or cash
    flows. One-way turnover is half the sum of absolute weight changes. The transaction
    fee applies to every dollar bought or sold.
  task: Calculate changes, turnover, gross trading and fees for the proposed weights.
    Separately test the alternative weights against the asset cap and quantify the
    largest excess.
  interpretation: Selling and reinvesting the same amount creates two sides of gross
    trading. A cap violation is a separate feasibility failure and cannot be offset
    by favorable expected return.
