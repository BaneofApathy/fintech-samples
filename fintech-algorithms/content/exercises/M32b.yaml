  readAloud:
  - Calculate every weight change and add their absolute sizes. Half of that total
    is one-way turnover; the full total captures both purchases and sales for the
    fee calculation. The identities here assume a fully invested portfolio, unchanged
    value during rebalancing, and no external cash flows, as specified in the problem.
  - 'Subtract the permitted maximum from each proposed weight. A positive result is
    a violation; otherwise the excess is zero. For transaction fees: 1 bp = 0.0001,
    10 bps = 0.001 = 0.10%. The fee in this exercise applies to every dollar bought
    or sold. A cap violation is separate from transaction cost and cannot be offset
    by a favorable expected return.'
  workedExplanation:
  - 'Turnover estimates the trading burden; the fee calculation depends on the stated
    convention. A mandatory allocation cap is a separate pass/fail condition. Better
    expected performance does not make a noncompliant proposed allocation feasible. '
  - Selling 20% of portfolio value and reinvesting it creates 20% one-way turnover
    but 40% gross trading. The stated fee charges both sides. Likewise, an asset at
    55% breaches a 50% cap by five percentage points, not by 5% of its current holding.
  workedArithmetic:
  - Weight changes = [0.40 − 0.60, 0.40 − 0.30, 0.20 − 0.10] = [−0.20, 0.10, 0.10].
  - One-way turnover = (0.20 + 0.10 + 0.10) / 2 = 20%. Gross trading = 0.40 × $1,000,000
    = $400,000.
  - Fees = $400,000 × 0.001 = $400, charging both purchases and sales.
  - Alternative cap violation = 0.55 − 0.50 = 0.05, or 5 percentage points; dollar
    excess = 0.05 × $1,000,000 = $50,000.
