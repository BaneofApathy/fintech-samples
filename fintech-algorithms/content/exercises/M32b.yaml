  title: Turnover and Constraints
  text: " Turnover and Constraints\n\n   M32b | Formula explained (2/2)\n\n Question:\
    \ Does each proposed weight satisfy the allocation cap?\n                    \
    \        Excessi = max(winew − ui , 0),             Dollar excessi = V × Excessi\
    \ .\n Read it aloud: Subtract the permitted maximum from each proposed weight.\
    \ A positive result\n is a violation; otherwise the excess is zero.\n For transaction\
    \ fees:\n                                                  1 bp = 0.0001,   10\
    \ bps = 0.001 = 0.10%.\n The fee in this exercise applies to every dollar bought\
    \ or sold. A cap violation is separate\n from transaction cost and cannot be offset\
    \ by a favorable expected return."
