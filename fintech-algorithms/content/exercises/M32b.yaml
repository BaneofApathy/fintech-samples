question: "A $1 million portfolio is rebalanced without market movement or cash flows.\n\
  \   Asset                                             Current weight           \
  \        Proposed weight\n   A                                                 \
  \            60%                             40%\n   B                         \
  \                                    30%                             40%\n   C \
  \                                                            10%               \
  \              20%\n\n Define one-way turnover as 12 i |winew − wiold |. Transaction\
  \ costs are 10 basis points of\n                              P\n\n every dollar\
  \ bought or sold; 10 bps = 0.10%.\n Calculate turnover, total dollars bought and\
  \ sold, and cost. Every proposed allocation must now\n have no asset above 50%.\
  \ Does an alternative proposal of 55%, 35%, 10% comply?\n Quantify any violation."
