interpretationPages:
- page: 52
  title: Gradient Boosting
  text: " Gradient Boosting\n\n   A03 | Interpretation\n\n What the answer means\n\
    \ Smaller corrections leave the applicant below the review cutoff in this example.\
    \ The corrections\n are log-odds increments, not probability percentage points.\
    \ In a full retraining, changing\n the learning rate can also change the later\
    \ fitted trees.\n Why these steps matter\n The learning rate changes the amount\
    \ of correction, not the definition of probability. Adding 0.4\n to a log-odds\
    \ score is not adding 40 percentage points to default risk. The same score\n increment\
    \ produces different probability changes at different starting scores."
