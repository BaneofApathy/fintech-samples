formulaPages:
- page: 47
  title: Gradient Boosting
  text: " Gradient Boosting\n\n   A03 | Formula explained (1/1)\n\n Question: How\
    \ do successive tree corrections change a default score?\n                   \
    \                                               1\n                          \
    \    Fm = Fm−1 + ηhm ,          p=           .\n                             \
    \                                1 + e−Fm\n Read it aloud: New score = previous\
    \ score + learning rate × this tree’s correction. Convert\n the final score to\
    \ a probability only after adding the corrections.\n The tree outputs here are\
    \ already fitted and supplied. Changing the learning rate scales these\n fixed\
    \ contributions for the hand calculation; a newly trained model may learn different\
    \ trees.\n Review if the resulting probability reaches 18%, or 0.18."
  paragraphs:
  - Gradient Boosting
