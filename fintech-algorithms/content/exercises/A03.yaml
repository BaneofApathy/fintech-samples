  readAloud:
  - New score = previous score + learning rate × this tree’s correction. Convert the
    final score to a probability only after adding the corrections. The tree outputs
    here are already fitted and supplied. Changing the learning rate scales these
    fixed contributions for the hand calculation; a newly trained model may learn
    different trees. Review if the resulting probability reaches 18%, or 0.18.
  workedExplanation:
  - 'Smaller corrections leave the applicant below the review cutoff in this example.
    The corrections are log-odds increments, not probability percentage points. In
    a full retraining, changing the learning rate can also change the later fitted
    trees. '
  - The learning rate changes the amount of correction, not the definition of probability.
    Adding 0.4 to a log-odds score is not adding 40 percentage points to default risk.
    The same score increment produces different probability changes at different starting
    scores.
  workedArithmetic:
  - 'With learning rate 0.5: F1 = −2 + 0.5 × 0.8 = −1.6; F2 = −1.6 + 0.5 × 0.4 = −1.4.'
  - p = 1 / (1 + exp(1.4)) ≈ 0.1978 = 19.78%, which exceeds the 18% review threshold.
  - 'With learning rate 0.25: F1 = −2 + 0.25 × 0.8 = −1.8; F2 = −1.8 + 0.25 × 0.4
    = −1.7.'
  - p = 1 / (1 + exp(1.7)) ≈ 0.1545 = 15.45%, below the same threshold.
