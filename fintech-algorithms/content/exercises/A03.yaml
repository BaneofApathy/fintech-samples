learning:
  title: Update a Credit Score
  scenario: A credit model starts with a log-odds score. Each fitted tree adds its
    output multiplied by a learning rate. The supplied tree outputs stay fixed in
    this calculation.
  task: Calculate the scores and probability after two trees using each of the two
    learning rates. Review an application when its probability reaches the threshold.
  interpretation: Tree outputs change log-odds, not probability percentage points.
    In a newly trained model, changing the learning rate may also change the trees
    that are fitted.
  summary: 'Probability with the first learning rate: {p}; with the comparison rate:
    {smallP}. Review decisions: {decision}, {smallDecision}.'
