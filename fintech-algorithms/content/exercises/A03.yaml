  title: Gradient Boosting
  text: " Gradient Boosting\n\n   A03 | Worked solution — Update a Credit Score\n\n\
    1. First correction: F1 = −2.0 + 0.5(0.8) = −1.6.\n2. Second correction: F2 =\
    \ −1.6 + 0.5(0.4) = −1.4.\n3. Convert to probability:\n                      \
    \                     1\n                                            p=   = 0.1978\
    \ = 19.78%.\n                                       1 + 4.055\n      This exceeds\
    \ 18%, so the application goes to review.\n4. Use the smaller learning rate:\n\
    \                 F1 = −2 + 0.25(0.8) = −1.8, F2 = −1.8 + 0.25(0.4) = −1.7.\n\
    \                                        1\n                                p=\
    \            = 0.1545 = 15.45%.\n                                    1 + 5.474\n\
    \   This does not reach the review threshold."
