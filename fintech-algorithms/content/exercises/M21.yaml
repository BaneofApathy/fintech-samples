interpretationPages:
- page: 383
  title: RMSE
  text: " RMSE\n\n   M21 | Interpretation\n\n What the answer means\n B has the smaller\
    \ average absolute miss—$7,500 versus $10,000—but a $30,000\n underforecast on\
    \ one day. RMSE ranks A better because it gives large misses more weight.\n RMSE\
    \ itself does not distinguish shortages from excess cash; the sign and funding\
    \ consequences\n require separate attention.\n Why these steps matter\n The root\
    \ does not undo the greater weight given to large errors; averaging occurs after\
    \ squaring\n and before taking the root. A US$30,000 underforecast contributes\
    \ nine times the squared\n penalty of a US$10,000 miss."
  paragraphs:
  - RMSE
  - M21 | Interpretation
  - What the answer means B has the smaller average absolute miss—$7,500 versus $10,000—but
    a $30,000 underforecast on one day. RMSE ranks A better because it gives large
    misses more weight. RMSE itself does not distinguish shortages from excess cash;
    the sign and funding consequences require separate attention. Why these steps
    matter The root does not undo the greater weight given to large errors; averaging
    occurs after squaring and before taking the root. A US$30,000 underforecast contributes
    nine times the squared penalty of a US$10,000 miss.
