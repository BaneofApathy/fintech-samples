learning:
  title: Which Forecast Has the More Dangerous Miss?
  scenario: Two forecasts have signed errors measured as forecast minus actual, in
    $ thousands. Negative values are underforecasts.
  task: Calculate MAE and RMSE for each forecast. For RMSE, divide the sum of squared
    errors by the number of observations, then take the square root.
  interpretation: RMSE gives larger misses more weight, but does not distinguish shortage
    from excess. Keep the error signs and funding consequences when making a treasury
    decision.
  summary: 'MAE: A {MAEA}, B {MAEB}. RMSE: A {RMSEA}, B {RMSEB}.'
  labels: *id003
  steps:
    MAEA:
      title: Forecast A MAE
      hints: *id004
