  readAloud:
  - For MAE, average error magnitudes. For RMSE, square each error, average the squares,
    and take the square root. Use n, not n − 1, for this mean forecast-error calculation.
    This is not a sample-standard-deviation estimate around an estimated error mean.
    A negative error means underforecasting under the forecast-minus-actual convention.
  workedExplanation:
  - 'B has the smaller average absolute miss—$7,500 versus $10,000—but a $30,000 underforecast
    on one day. RMSE ranks A better because it gives large misses more weight. RMSE
    itself does not distinguish shortages from excess cash; the sign and funding consequences
    require separate attention. '
  - The root does not undo the greater weight given to large errors; averaging occurs
    after squaring and before taking the root. A US$30,000 underforecast contributes
    nine times the squared penalty of a US$10,000 miss.
  workedArithmetic:
  - A’s MAE = (10 + 10 + 10 + 10) / 4 = $10 thousand; B’s MAE = (0 + 0 + 0 + 30) /
    4 = $7.5 thousand.
  - A’s RMSE = √[(100 + 100 + 100 + 100) / 4] = $10 thousand.
  - B’s RMSE = √[(0 + 0 + 0 + 900) / 4] = √225 = $15 thousand.
