  workedExplanation:
  - 'Under this empirical scenario distribution, 80% of one-day losses are no more
    than $7,000; the worst fifth averages $15,000. VaR is not a maximum loss: even
    this tiny sample includes a $20,000 loss. The 80% level is a teaching choice,
