steps:
- id: sorted
  title: Losses in ascending order
  expects: cells
  unit: $ thousands
  tolerance:
    rel: 0.005
    abs: 5.0e-05
  hints: &id004
  - Sort every scenario from smallest to largest.
  mistakes:
  - pattern: recompute
    message: Sort every scenario from smallest to largest.
- id: VaR
  title: Nearest-rank Value at Risk
  expects: number
  unit: $ thousands
  tolerance:
    rel: 0.005
    abs: 5.0e-05
  hints: &id005
  - Select rank ceiling(confidence × scenario count), with ranks starting at 1.
  mistakes:
  - pattern: recompute
    message: Select rank ceiling(confidence × scenario count), with ranks starting
      at 1.
- id: ES
  title: Expected Shortfall
  expects: number
  unit: $ thousands
  tolerance:
    rel: 0.005
    abs: 5.0e-05
  hints: &id006
  - Average the largest (1 − confidence) fraction of losses, rounding the tail count
    upward.
  mistakes:
  - pattern: recompute
    message: Average the largest (1 − confidence) fraction of losses, rounding the
      tail count upward.
- id: exceed
  title: Fraction strictly above VaR
  expects: number
  unit: proportion
  tolerance:
    rel: 0.005
    abs: 5.0e-05
  hints: &id007
  - Count losses greater than VaR, excluding equal values, then divide by scenario
    count.
  mistakes:
  - pattern: recompute
    message: Count losses greater than VaR, excluding equal values, then divide by
      scenario count.
