solutionPages:
- page: 521
  title: VaR and Expected Shortfall
  text: " VaR and Expected Shortfall\n\n   M33 | Worked solution — Threshold versus\
    \ Tail Average\n\n1. Sort losses: [0, 1, 2, 3, 4, 5, 6, 7, 10, 20].\n2. Locate\
    \ VaR: ⌈0.80 × 10⌉ = 8. The eighth loss is 7.\n                              \
    \   V aR80%,1 day = $7, 000.\n3. Identify the tail: worst 20% × 10 = 2 scenarios\
    \ have losses 10 and 20.\n                             ES80%,1 day = (10 + 20)/2\
    \ = $15, 000.\n4. Strict exceedances: 10 and 20 exceed 7, so 2/10 = 20%."
  paragraphs:
  - VaR and Expected Shortfall
  - M33 | Worked solution — Threshold versus Tail Average
  - '1. Sort losses: [0, 1, 2, 3, 4, 5, 6, 7, 10, 20]. 2. Locate VaR: ⌈0.80 × 10⌉
    = 8. The eighth loss is 7. V aR80%,1 day = $7, 000. 3. Identify the tail: worst
    20% × 10 = 2 scenarios have losses 10 and 20. ES80%,1 day = (10 + 20)/2 = $15,
    000. 4. Strict exceedances: 10 and 20 exceed 7, so 2/10 = 20%.'
