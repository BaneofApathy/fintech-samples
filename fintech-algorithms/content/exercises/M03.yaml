solutionPages:
- page: 220
  title: Balanced Accuracy
  text: " Balanced Accuracy\n\n   M03 | Worked solution — Give Both Classes a Voice\n\
    \n1. Recall: 15/(15 + 5) = 15/20 = 75%.\n2. Specificity: 945/(945 + 35) = 945/980\
    \ = 96.43%.\n3. Balanced accuracy:\n                                  75% + 96.43%\n\
    \                                                   = 85.71%.\n              \
    \                            2\n4. Always-legitimate baseline: Recall is 0%; specificity\
    \ is 100%.\n                                                0% + 100%\n      \
    \                    Balanced accuracy =                  = 50%.\n           \
    \                                            2"
