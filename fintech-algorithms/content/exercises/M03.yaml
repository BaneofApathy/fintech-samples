  title: Give Both Classes a Voice
  scenario: A fraud detector is compared with a baseline that always predicts legitimate.
    Balanced accuracy gives fraud and legitimate transactions equal class-level weight.
  task: Calculate recall, specificity, their average and the baseline’s balanced accuracy.
  interpretation: Balanced accuracy first normalizes within each class. It is not
    ordinary accuracy and does not price either kind of error in dollars.
