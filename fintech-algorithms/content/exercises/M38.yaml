  readAloud:
  - For each band, multiply the change in its population share by the natural logarithm
    of its current-to-reference share ratio. Add the contributions across bands. Use
    proportions that sum to 1 within each period and the same band boundaries in both
    periods. The supplied shares are all positive, so the logarithms are defined.
    PSI is a distribution-shift measure. No realized default labels appear in its
    formula.
  workedExplanation:
  - 'The score distribution has changed. Investigate applicant channels, product mix,
    policy changes, and the data pipeline. PSI is not an accuracy score or a default-rate
    estimate; outcome labels are needed to assess prediction quality. Identical band
    shares would give PSI of zero, but zero PSI would not guarantee a sound model. '
  - For the lower band, both the share change and the log ratio are negative, producing
    a positive contribution. For the higher band, both are positive. The sum records
    the distribution change without establishing that predictions became wrong or
    that default rates actually rose.
  workedArithmetic:
  - Lower-risk contribution = (0.20 − 0.50) × ln(0.20/0.50) ≈ (−0.30) × (−0.9163)
    = 0.27489.
  - Higher-risk contribution = (0.80 − 0.50) × ln(0.80/0.50) ≈ 0.30 × 0.4700 = 0.14100.
  - PSI ≈ 0.27489 + 0.14100 = 0.41589. Higher-risk share increased by 80% − 50% =
    30 percentage points.
