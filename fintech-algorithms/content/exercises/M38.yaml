solutionPages:
- page: 564
  title: PSI
  text: " PSI\n\n   M38 | Worked solution — Has the Applicant Mix Changed?\n\n1. Lower-risk\
    \ band:\n                 (0.20 − 0.50) ln(0.20/0.50) = (−0.30)(−0.9163) = 0.27489.\n\
    2. Higher-risk band:\n                   (0.80 − 0.50) ln(0.80/0.50) = (0.30)(0.4700)\
    \ = 0.14100.\n3. Total: P SI = 0.27489 + 0.14100 = 0.41589.\n4. Describe the actual\
    \ shift: the higher-risk band rose from 50% to 80%, a\n   30-percentage-point\
    \ increase."
  paragraphs:
  - PSI
  - M38 | Worked solution — Has the Applicant Mix Changed?
