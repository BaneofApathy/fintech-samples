interpretationPages:
- page: 565
  title: PSI
  text: " PSI\n\n   M38 | Interpretation\n\n What the answer means\n The score distribution\
    \ has changed. Investigate applicant channels, product mix, policy changes,\n\
    \ and the data pipeline. PSI is not an accuracy score or a default-rate estimate;\
    \ outcome labels\n are needed to assess prediction quality. Identical band shares\
    \ would give PSI of zero, but zero\n PSI would not guarantee a sound model.\n\
    \ Why these steps matter\n For the lower band, both the share change and the log\
    \ ratio are negative, producing a positive\n contribution. For the higher band,\
    \ both are positive. The sum records the distribution change\n without establishing\
    \ that predictions became wrong or that default rates actually rose."
  paragraphs:
  - PSI
  - M38 | Interpretation
  - What the answer means The score distribution has changed. Investigate applicant
    channels, product mix, policy changes, and the data pipeline. PSI is not an accuracy
    score or a default-rate estimate; outcome labels are needed to assess prediction
    quality. Identical band shares would give PSI of zero, but zero PSI would not
