learning:
  title: Has the Applicant Mix Changed?
  scenario: 'Credit scores use two identical bands in both periods: lower risk, then
    higher risk. Current and reference shares are positive and sum to one.'
  task: For each band calculate (current − reference) × ln(current/reference). Add
    the contributions for PSI and calculate the higher-risk share change.
  interpretation: PSI measures distribution change without using realized outcome
    labels. It cannot establish accuracy deterioration or its cause. Investigate population,
    policy and data changes before drawing conclusions.
  summary: 'PSI: {PSI}. Higher-risk share change: {shift}.'
