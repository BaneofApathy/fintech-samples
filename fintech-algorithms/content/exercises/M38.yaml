id: M38
title: Has the Applicant Mix Changed?
minutes: 8
kind: measure
parent: population-stability-index
question: "A credit model uses two fixed score bands. Higher scores mean higher default\
  \ risk. The bands\n and their boundaries are identical in both periods.\n   Band\
  \                                                         Reference share E    \
  \                Current share A\n   Lower risk                                \
  \                                   50%                             20%\n   Higher\
  \ risk                                                                  50%    \
  \                         80%\n                                                \
  \           X\n                                                  P SI =       (Ai\
  \ − Ei ) ln(Ai /Ei ).\n                                                        \
  \   i\n\n Use proportions, not whole-number percentages. Calculate each band’s contribution\
  \ and total\n PSI. Use ln(0.4) ≈ −0.9163 and ln(1.6) ≈ 0.4700. Does this calculation\
  \ prove that model\n accuracy has deteriorated?"
