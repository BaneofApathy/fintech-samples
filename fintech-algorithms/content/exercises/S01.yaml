interpretationPages:
- page: 132
  title: Parsing Quality
  text: " Parsing Quality\n\n   S01 | Interpretation\n\n What the answer means\n The\
    \ retriever cannot reliably recover information that parsing omitted or corrupted.\
    \ A filing can\n have most sections present and still support a materially wrong\
    \ answer. These are separate\n audit measures with explicit classroom definitions,\
    \ not an invitation to average table, section,\n and cell percentages into one\
    \ score.\n Why these steps matter\n An intact table is a whole-table success,\
    \ whereas a numeric error is counted cell by cell. A single\n table can therefore\
    \ contain multiple erroneous cells, and the three scores need not move\n together.\
    \ Their averages cannot establish whether a critical debt or covenant value is\
    \ usable."
  paragraphs:
  - Parsing Quality
  - S01 | Interpretation
  - What the answer means The retriever cannot reliably recover information that parsing
    omitted or corrupted. A filing can have most sections present and still support
    a materially wrong answer. These are separate audit measures with explicit classroom
    definitions, not an invitation to average table, section, and cell percentages
    into one score. Why these steps matter An intact table is a whole-table success,
    whereas a numeric error is counted cell by cell. A single table can therefore
    contain multiple erroneous cells, and the three scores need not move together.
    Their averages cannot establish whether a critical debt or covenant value is usable.
