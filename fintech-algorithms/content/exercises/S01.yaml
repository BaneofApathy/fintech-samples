id: S01
title: Check the Evidence Before Retrieval
minutes: 7
kind: skill
parent: rag
question: "A filing parser is audited before the financial Q&A system is evaluated:\n\
  ▶ Eight tables are checked; seven retain every required header, row, and unit label.\n\
  ▶ Ten required sections are checked; nine appear in the parsed output.\n▶ Two hundred\
  \ numeric cells are checked; six contain a wrong number or unit.\n For this exercise\
  \ define table integrity rate as intact tables / audited tables, section coverage\n\
  \ as present required sections / required sections, and numeric extraction error\
  \ rate as incorrect\n cells / audited cells.\n Calculate all three. Can high section\
  \ coverage compensate for a wrongly parsed debt figure?"
