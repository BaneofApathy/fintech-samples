  workedExplanation:
  - 'The retriever cannot reliably recover information that parsing omitted or corrupted.
    A filing can have most sections present and still support a materially wrong answer.
    These are separate audit measures with explicit classroom definitions, not an
    invitation to average table, section, and cell percentages into one score. '
  - An intact table is a whole-table success, whereas a numeric error is counted cell
    by cell. A single table can therefore contain multiple erroneous cells, and the
    three scores need not move together. Their averages cannot establish whether a
    critical debt or covenant value is usable.
  workedArithmetic:
  - Table integrity = 7/8 = 87.5%. Section coverage = 9/10 = 90%.
  - Numeric extraction error = 6/200 = 3%. Numeric correctness = (200 − 6) / 200 =
    97%.
  - The counts do not reveal whether the six incorrect cells contain financially material
    figures.
