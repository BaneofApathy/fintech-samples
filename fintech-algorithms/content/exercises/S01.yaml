learning:
  title: Check the Evidence Before Retrieval
  scenario: A filing parser is checked before retrieval is evaluated. Table integrity
    counts tables retaining all required headers, rows and units. Section coverage
    counts required sections present. Numeric error counts wrong numbers or units
    in audited cells.
  task: Calculate table integrity, section coverage, numeric error rate and numeric
    correctness using the audit counts.
  interpretation: Tables, sections and cells are separate units of evaluation. High
    section coverage cannot compensate for an incorrectly extracted debt figure.
