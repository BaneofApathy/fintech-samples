solutionPages:
- page: 131
  title: Parsing Quality
  text: " Parsing Quality\n\n   S01 | Worked solution — Check the Evidence Before\
    \ Retrieval\n\n1. Table integrity: 7/8 = 87.5%.\n2. Section coverage: 9/10 = 90%.\n\
    3. Numeric extraction error rate: 6/200 = 3%; numeric extraction correctness is\n\
    \   194/200 = 97%.\n4. Identify the unchecked consequence: the six incorrect cells\
    \ could include financially\n   material figures; the counts do not reveal their\
    \ importance."
