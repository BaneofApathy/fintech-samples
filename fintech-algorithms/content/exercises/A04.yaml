interpretationPages:
- page: 63
  title: K-Means
  text: " K-Means\n\n   A04 | Interpretation\n\n What the answer means\n The groups\
    \ represent lower and higher observed savings rates. A 15% center is a group average,\n\
    \ not a required savings target or a default probability. The groups alone do\
    \ not justify credit\n decisions.\n Why these steps matter\n A cluster center\
    \ describes the customers currently assigned to it. It is not a rule about how\n\
    \ much customers should save. This exercise groups one behavior; creditworthiness\
    \ would require\n a different target and supporting evidence."
