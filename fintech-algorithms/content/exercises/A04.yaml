id: A04
title: Group Savings Behavior
minutes: 6
kind: algorithm
parent: k-means
question: "A bank groups customers using one feature: the percentage of monthly income\
  \ saved.\n Four customers save 10%, 20%, 60%, and 70%. Start K-means with two centers:\
  \ 10% and\n 60%.\n Use absolute distance for assignment; with one feature, it produces\
  \ the same nearest-center\n assignment as squared distance.\n1. Assign each customer\
  \ to the nearest starting center.\n2. Update each center to the average of its assigned\
  \ customers.\n3. Assign a new customer who saves 35% using the updated centers.\n\
  4. Describe the two groups without claiming that one is more creditworthy."
