learning:
  title: Group Savings Behavior
  scenario: A bank groups customers by the percentage of income they save. The two
    supplied centers are numbered 1 and 2.
  task: Assign each customer to the nearest starting center, update both centers to
    their group means, then assign the new customer. If distances tie, use group 1.
  interpretation: The centers describe observed savings behavior. They are not required
    savings targets or estimates of creditworthiness. In one dimension, absolute and
    squared distances give the same nearest-center assignment.
  summary: 'Updated centers: {c1}, {c2}. The new customer belongs to group {group}.'
