solutionPages:
- page: 62
  title: K-Means
  text: " K-Means\n\n   A04 | Worked solution — Group Savings Behavior\n\n1. Assign\
    \ customers using the original centers.\n   Savings rate                     \
    \        Distance to 10%   Distance to 60% Assignment\n   10%                \
    \                                    0                       50 Group 1\n   20%\
    \                                                   10                       40\
    \ Group 1\n   60%                                                   50       \
    \                     0 Group 2\n   70%                                      \
    \             60                       10 Group 2\n\n2. Update the centers: µ1\
    \ = (10 + 20)/2 = 15%; µ2 = (60 + 70)/2 = 65%.\n3. Assign the new customer: Distances\
    \ from 35% are |35 − 15| = 20 and |35 − 65| = 30\n   percentage points. Assign\
    \ the customer to Group 1."
