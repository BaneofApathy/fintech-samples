interpretationPages:
- page: 597
  title: Uptime
  text: " Uptime\n\n   M39d | Interpretation\n\n What the answer means\n “Over 99%\
    \ available” is not enough for the specified 99.9% objective. The service was\n\
    \ unavailable for more than twice its allotted downtime. Time-based availability\
    \ also does not\n reveal how many payment requests were affected or whether the\
    \ outage coincided with peak\n demand.\n Why these steps matter\n A target of\
    \ 99.9% leaves 0.1% of scheduled time for unavailability, not 0.9%. Multiplying\
    \ that\n small fraction by the full month’s minutes makes the allowance concrete.\
    \ The same outage\n length can affect very different payment volumes depending\
    \ on when it occurs."
  paragraphs:
  - Uptime
  - M39d | Interpretation
  - What the answer means “Over 99% available” is not enough for the specified 99.9%
    objective. The service was unavailable for more than twice its allotted downtime.
    Time-based availability also does not reveal how many payment requests were affected
    or whether the outage coincided with peak demand. Why these steps matter A target
    of 99.9% leaves 0.1% of scheduled time for unavailability, not 0.9%. Multiplying
    that small fraction by the full month’s minutes makes the allowance concrete.
    The same outage length can affect very different payment volumes depending on
    when it occurs.
