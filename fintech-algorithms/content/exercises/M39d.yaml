solutionPages:
- page: 596
  title: Uptime
  text: " Uptime\n\n   M39d | Worked solution — Translate the Percentage into Minutes\n\
    \n1. Scheduled time: 30 × 24 × 60 = 43, 200 minutes.\n2. Available time: 43,200\
    \ − 90 = 43,110 minutes.\n3. Achieved availability:\n                        \
    \                          43,110/43,200 × 100% = 99.7917%.\n4. Allowed unavailability:\
    \ 43,200(1 − 0.999) = 43.2 minutes.\n5. Excess downtime: 90 − 43.2 = 46.8 minutes."
  paragraphs:
  - Uptime
  - M39d | Worked solution — Translate the Percentage into Minutes
  - '1. Scheduled time: 30 × 24 × 60 = 43, 200 minutes. 2. Available time: 43,200
    − 90 = 43,110 minutes. 3. Achieved availability: 43,110/43,200 × 100% = 99.7917%.
    4. Allowed unavailability: 43,200(1 − 0.999) = 43.2 minutes. 5. Excess downtime:
    90 − 43.2 = 46.8 minutes.'
