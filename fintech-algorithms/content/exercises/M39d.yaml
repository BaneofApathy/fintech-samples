learning:
  title: Translate the Percentage into Minutes
  scenario: A service is scheduled continuously for the supplied number of days. Use
    time-based availability, not request-weighted success.
  task: Convert the scheduled period to minutes, calculate available minutes and availability,
    then compute downtime allowed by the objective and downtime beyond that allowance.
  interpretation: An availability percentage must be compared with its exact target.
    Time-based availability also does not reveal how many requests were affected or
    whether downtime coincided with peak demand.
