interpretationPages:
- page: 499
  title: Maximum Drawdown
  text: " Maximum Drawdown\n\n   M32a | Interpretation\n\n What the answer means\n\
    \ An investor ended up 25% but first endured a one-third decline from the account’s\
    \ earlier peak.\n Final return hides that path. The later value of 125 cannot\
    \ be used as the peak for the earlier\n decline to 80.\n Why these steps matter\n\
    \ The denominator is the earlier peak of 120, not the starting value of 100 or\
    \ the later value of\n 125. The numerator measures the investor’s decline from\
    \ that peak. A strong final return\n cannot remove the funding or behavioral strain\
    \ experienced during the earlier drawdown."
