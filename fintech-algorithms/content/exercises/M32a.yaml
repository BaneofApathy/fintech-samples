  workedArithmetic:
  - Running peaks for [100, 120, 90, 110, 80, 125] are [100, 120, 120, 120, 120, 125].
  - Drawdowns are [0, 0, 30/120, 10/120, 40/120, 0] = [0%, 0%, 25%, 8.33%, 33.33%,
    0%].
  - Maximum drawdown = (120 − 80) / 120 = 33.33%. Final return = (125 − 100) / 100
    = 25%.
