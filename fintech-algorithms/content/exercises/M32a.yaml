  workedExplanation:
  - 'An investor ended up 25% but first endured a one-third decline from the account’s
    earlier peak. Final return hides that path. The later value of 125 cannot be used
    as the peak for the earlier decline to 80. '
  - The denominator is the earlier peak of 120, not the starting value of 100 or the
    later value of 125. The numerator measures the investor’s decline from that peak.
