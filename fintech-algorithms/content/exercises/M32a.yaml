solutionPages:
- page: 498
  title: Maximum Drawdown
  text: " Maximum Drawdown\n\n   M32a | Worked solution — The Loss Hidden by a Good\
    \ Ending\n\n1. Track the peak before calculating the decline.\n   Observation\
    \                                    Value        Running peak               \
    \   Drawdown\n   1                                                100        \
    \               100                 0%\n   2                                 \
    \               120                       120                 0%\n   3       \
    \                                          90                       120     30/120\
    \ = 25%\n   4                                                110             \
    \          120    10/120 = 8.33%\n   5                                       \
    \          80                       120    40/120 = 33.33%\n   6             \
    \                                   125                       125            \
    \     0%\n\n2. Maximum drawdown: 33.33%, from 120 down to 80.\n3. Final return:\
    \ (125 − 100)/100 = 25%."
  paragraphs:
  - Maximum Drawdown
  - M32a | Worked solution — The Loss Hidden by a Good Ending
  - 1. Track the peak before calculating the decline. Observation Value Running peak
    Drawdown 1 100 100 0% 2 120 120 0% 3 90 120 30/120 = 25% 4 110 120 10/120 = 8.33%
    5 80 120 40/120 = 33.33% 6 125 125 0%
  - '2. Maximum drawdown: 33.33%, from 120 down to 80. 3. Final return: (125 − 100)/100
    = 25%.'
