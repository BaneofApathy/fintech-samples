learning:
  title: The Loss Hidden by a Good Ending
  scenario: An account follows the supplied value path in $ thousands, with no external
    cash flows. Report drawdown as a positive loss magnitude.
  task: Find the running peak at each observation, drawdown from that peak, maximum
    drawdown and final return from the initial value.
  interpretation: Only peaks reached by that time belong in a drawdown calculation.
    A profitable ending can follow a severe decline; final return does not describe
    the funding or behavioral strain along the path.
  summary: 'Maximum drawdown: {MDD}. Final return: {finalReturn}.'
