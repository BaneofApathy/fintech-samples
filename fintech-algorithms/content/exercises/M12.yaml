id: M12
title: Match Review Capacity
minutes: 6
kind: measure
parent: precision-k-and-recall-k
question: "A batch contains 100 transactions and 8 actual frauds.\n The top 5 model-ranked\
  \ transactions contain 3 frauds. The top 10 contain 5 frauds.\n1. Calculate precision@5\
  \ and recall@5.\n2. Calculate precision@10 and recall@10.\n3. How many extra reviews\
  \ and extra frauds result from increasing capacity from 5 to 10?\n4. Each review\
  \ costs $2. What is the additional review cost per additional fraud found?\n Assume\
  \ all reviewed cases receive correct investigation outcomes. Do not assume investigation\n\
  \ automatically prevents the loss."
