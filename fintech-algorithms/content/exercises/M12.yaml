solutionPages:
- page: 301
  title: Precision@K and Recall@K
  text: " Precision@K and Recall@K\n\n   M12 | Worked solution — Match Review Capacity\n\
    \n1. At K = 5:\n                                                   P @5 = 3/5\
    \ = 60%,    R@5 = 3/8 = 37.5%.\n2. At K = 10:\n                              \
    \                    P @10 = 5/10 = 50%,   R@10 = 5/8 = 62.5%.\n3. Incremental\
    \ work and capture: 10 − 5 = 5 additional reviews find 5 − 3 = 2 additional\n\
    \   frauds.\n4. Incremental cost: 5($2) = $10, or $10/2 = $5 per additional fraud\
    \ found."
  paragraphs:
  - Precision@K and Recall@K
  - M12 | Worked solution — Match Review Capacity
  - '1. At K = 5: P @5 = 3/5 = 60%, R@5 = 3/8 = 37.5%. 2. At K = 10: P @10 = 5/10
