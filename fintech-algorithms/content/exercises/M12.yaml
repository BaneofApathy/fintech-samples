learning:
  title: Match Review Capacity
  scenario: A fraud team can review either a smaller or a larger prefix of the same
    ranked transaction list. Every review costs the supplied amount and produces the
    correct investigation outcome.
  task: Calculate precision and recall for each queue, extra reviews and frauds, then
    added review cost per added fraud found.
  interpretation: Discovering a fraud does not guarantee that its loss can be prevented
    or recovered. Use incremental discoveries, not all discoveries in the larger queue,
    when pricing the expansion.
  summary: 'Smaller-queue precision/recall: {P5}, {R5}; larger-queue: {P10}, {R10}.
