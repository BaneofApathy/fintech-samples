interpretationPages:
- page: 302
  title: Precision@K and Recall@K
  text: " Precision@K and Recall@K\n\n   M12 | Interpretation\n\n What the answer\
    \ means\n Expanding the queue lowers precision from 60% to 50% but increases fraud\
    \ coverage from\n 37.5% to 62.5%. The extra cases may be worth reviewing, but\
    \ the institution must have\n capacity and a useful intervention. Higher precision\
    \ alone is not the objective.\n Why these steps matter\n Use the difference in\
    \ fraud discoveries to assess the added five reviews. Dividing incremental\n spending\
    \ by all five frauds in the expanded queue would over-credit discoveries already\
    \ made by\n the smaller queue."
