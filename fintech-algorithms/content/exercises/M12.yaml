  readAloud:
  - Fraud count divided by queue size gives queue quality; fraud count divided by
    all frauds gives coverage. To price an expansion, divide additional review spending
    by additional discoveries. Use the two queue sizes from the same ranked population.
    A discovered fraud is not automatically a prevented or recovered loss.
  workedExplanation:
  - 'Expanding the queue lowers precision from 60% to 50% but increases fraud coverage
    from 37.5% to 62.5%. The extra cases may be worth reviewing, but the institution
    must have capacity and a useful intervention. Higher precision alone is not the
    objective. '
  - Use the difference in fraud discoveries to assess the added five reviews. Dividing
    incremental spending by all five frauds in the expanded queue would over-credit
    discoveries already made by the smaller queue.
  workedArithmetic:
  - 'At K = 5: precision = 3/5 = 60%; recall = 3/8 = 37.5%.'
  - 'At K = 10: precision = 5/10 = 50%; recall = 5/8 = 62.5%.'
  - Additional reviews = 10 − 5 = 5; additional frauds = 5 − 3 = 2.
  - Additional cost = 5 × $2 = $10; cost per additional fraud = $10/2 = $5.
