formulaPages:
- page: 265
  title: ROC-AUC and Gini
  text: " ROC-AUC and Gini\n\n   M09 | Formula explained (1/1)\n\n Question: How often\
    \ is a fraud ranked above a legitimate case?\n                               \
    \                            W + 12 T\n                                      \
    \            AU C =            ,   Gini = 2AU C − 1.\n                       \
    \                                    N+ N−\n Read it aloud: Count fraud–legitimate\
    \ pairs ordered correctly, give half credit to tied scores,\n then divide by all\
    \ such pairs. Double AUC and subtract one for the AUC-derived Gini coefficient.\n\
    \ The denominator is the number of pairs, not the number of transactions. No classification\n\
    \ threshold is needed for this calculation.\n AUC stands for area under the ROC\
    \ curve; pair-counting gives its ranking interpretation."
