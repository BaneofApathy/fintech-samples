solutionPages:
- page: 269
  title: ROC-AUC and Gini
  text: " ROC-AUC and Gini\n\n   M09 | Worked solution — Count Correct Rankings\n\n\
    1. Compare every fraud score with every legitimate score.\n   Fraud score    \
    \                       Beats 0.80?   Beats 0.40?   Beats 0.10?              \
    \  Points\n   0.90                                  Yes           Yes        \
    \   Yes                             3\n   0.70                               \
    \   No            Yes           Yes                             2\n   0.30   \
    \                               No            No            Yes              \
    \               1\n\n2. Add ranking points: 3 + 2 + 1 = 6; there are no ties.\n\
    3. AUC: 6/9 = 0.6667.\n4. Gini: 2(0.6667) − 1 = 0.3333."
  paragraphs:
  - ROC-AUC and Gini
