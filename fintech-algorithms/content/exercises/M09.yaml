interpretationPages:
- page: 270
  title: ROC-AUC and Gini
  text: " ROC-AUC and Gini\n\n   M09 | Interpretation\n\n What the answer means\n\
    \ The model ranks a fraud above a legitimate transaction in two-thirds of these\
    \ pairs. AUC is\n not threshold-specific accuracy, a fraud probability, or a profit\
    \ estimate. This Gini is a rescaling\n of ranking AUC, not tree-node impurity.\n\
    \ Why these steps matter\n AUC uses all nine fraud–legitimate comparisons. Accuracy\
    \ at a particular cutoff would use six\n yes/no decisions instead. The two fractions\
    \ summarize different questions even when calculated\n from the same records."
