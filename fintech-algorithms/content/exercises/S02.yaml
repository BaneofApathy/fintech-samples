learning:
  title: Did It Answer the Whole Question?
  scenario: An answer rubric lists required components for each question. All supplied
    components are correct; no extra unsupported claims are present.
  task: Count questions with every required component, then calculate question-level
    exactness and pooled component completeness.
  interpretation: Exactness gives each question equal weight. Pooled completeness
    gives each required component equal weight. Missing a critical fact may matter
    more than the aggregate score suggests.
  summary: 'Fully answered questions: {complete}. Exactness: {exactness}. Component
    completeness: {completeness}.'
  labels: *id004
  steps:
    complete:
      title: Fully answered questions
      hints: *id005
      unit: ''
    exactness:
      title: Answer exactness
      hints: *id006
      unit: proportion
    required:
      title: Total required components
      hints: *id007
      unit: ''
    correct:
      title: Total correct components supplied
      hints: *id008
      unit: ''
    completeness:
      title: Component completeness
      hints: *id009
      unit: proportion
  readAloud:
  - For exactness, count questions with all required components correct and divide
    by questions. For completeness, add all correctly supplied components and divide
    by all required components. This example assumes that every supplied component
    is correct and there are no extra unsupported claims. Exactness is judged against
    the answer rubric, not literal wording.
  workedExplanation:
  - 'The system supplied most required facts but fully answered only half the questions.
    Reporting 80% alone would hide the incomplete answers. Components are equally
    weighted in this exercise; missing a critical covenant or denominator may matter
    more than missing a minor descriptive detail. '
  - Exactness gives every question one vote. Pooled completeness gives every required
    component one vote. A partly answered three-component question can contribute
    two correct components but zero fully correct questions. Neither measure alone
    establishes whether a missing component is financially critical.
  workedArithmetic:
  - Q1 supplies 2/2 components and Q4 supplies 4/4; both are complete. Q2 supplies
    2/3 and Q3 supplies 0/1, so both are incomplete.
  - Exactness = 2 fully answered questions / 4 questions = 50%.
  - Required components = 2 + 3 + 1 + 4 = 10. Correct supplied components = 2 + 2
    + 0 + 4 = 8. Completeness = 8/10 = 80%.
