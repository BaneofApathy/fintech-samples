interpretationPages:
- page: 139
  title: Answer Exactness and Completeness
  text: " Answer Exactness and Completeness\n\n   S02 | Interpretation\n\n What the\
    \ answer means\n The system supplied most required facts but fully answered only\
    \ half the questions. Reporting\n 80% alone would hide the incomplete answers.\
    \ Components are equally weighted in this\n exercise; missing a critical covenant\
    \ or denominator may matter more than missing a minor\n descriptive detail.\n\
    \ Why these steps matter\n Exactness gives every question one vote. Pooled completeness\
    \ gives every required component\n one vote. A partly answered three-component\
    \ question can contribute two correct components\n but zero fully correct questions.\
    \ Neither measure alone establishes whether a missing\n component is financially\
    \ critical."
  paragraphs:
