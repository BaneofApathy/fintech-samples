solutionPages:
- page: 138
  title: Answer Exactness and Completeness
  text: " Answer Exactness and Completeness\n\n   S02 | Worked solution — Did It Answer\
    \ the Whole Question?\n\n1. Entirely correct answers: Q1 supplies 2/2 and Q4 supplies\
    \ 4/4. Q2 and Q3 are incomplete.\n2. Answer exactness: 2/4 = 50%.\n3. Total required\
    \ components: 2 + 3 + 1 + 4 = 10.\n4. Correctly supplied components: 2 + 2 + 0\
    \ + 4 = 8.\n5. Component completeness: 8/10 = 80%."
  paragraphs:
  - Answer Exactness and Completeness
  - S02 | Worked solution — Did It Answer the Whole Question?
  - '1. Entirely correct answers: Q1 supplies 2/2 and Q4 supplies 4/4. Q2 and Q3 are
    incomplete. 2. Answer exactness: 2/4 = 50%. 3. Total required components: 2 +
    3 + 1 + 4 = 10. 4. Correctly supplied components: 2 + 2 + 0 + 4 = 8. 5. Component
    completeness: 8/10 = 80%.'
