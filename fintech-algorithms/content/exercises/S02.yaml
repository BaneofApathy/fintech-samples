question: "An instructor’s answer key divides four financial questions into required\
  \ components. Every\n supplied component is correct; there are no extra unsupported\
  \ claims in this exercise.\n   Question                                 Required\
  \ components             Correct components supplied\n   Q1                    \
  \                                     2                                       2\n\
  \   Q2                                                         3               \
  \                        2\n   Q3                                              \
  \           1                                       0\n   Q4                   \
  \                                      4                                       4\n\
  \ Define answer exactness as the share of questions with every required component\
  \ correct,\n using the rubric rather than literal wording. Define component completeness\
  \ as correctly\n supplied components / all required components.\n Calculate both.\
  \ Which questions are incomplete?"
