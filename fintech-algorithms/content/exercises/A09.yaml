interpretationPages:
- page: 125
  title: Embeddings and RAG
  text: " Embeddings and RAG\n\n   A09 | Interpretation\n\n What the answer means\n\
    \ The 0.80 retrieval score indicates vector similarity, not an 80% probability\
    \ that the answer is\n correct. Both revenue figures are needed; retrieval finds\
    \ the evidence and arithmetic establishes\n the growth rate.\n Why these steps\
    \ matter\n Dividing by the previous year’s revenue expresses the increase relative\
    \ to the starting amount,\n rather than relative to the new total. Similarity\
    \ ranking does not perform that arithmetic or\n verify the financial definitions."
