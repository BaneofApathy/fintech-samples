learning:
  title: Retrieve, Then Calculate
  scenario: A query and three document chunks have toy two-dimensional vectors. Chunk
    A gives old-period revenue, B gives new-period revenue, and C describes branch
    locations. Revenue figures use the same units and accounting basis.
  task: Calculate cosine similarity for A, B and C, select the two highest-scoring
    chunks, and calculate revenue growth as (new − old) / old.
  interpretation: Cosine similarity ranks passages; it is not a probability of correctness.
    Growth needs both revenue figures. A supported answer identifies both chunks and
    checks the arithmetic.
  summary: 'Chunk similarities (A, B, C): {similarities}. Revenue growth: {growth}.'
  labels: *id003
  steps:
    similarities:
      title: Cosine similarities for A, B and C
      hints: *id004
      unit: ''
    growth:
      title: Revenue growth
      hints: *id005
      unit: proportion
  readAloud:
  - Multiply matching coordinates and add; divide by both vector lengths. A higher
    cosine similarity ranks a passage closer to the question in this example. Retrieve
    the two highest-scoring chunks. The calculation uses artificial two-coordinate
    embeddings so it can be done by hand.
  - New revenue minus old revenue, divided by old revenue; multiply by 100 to express
    the fractional change as a percentage number. Both inputs must use the same currency,
    unit, period definition, and revenue basis. One year alone is not enough to calculate
    year-over-year growth. Retrieval supplies evidence. Arithmetic calculates growth.
    A grounded answer identifies both supporting chunks.
  workedExplanation:
  - 'The 0.80 retrieval score indicates vector similarity, not an 80% probability
    that the answer is correct. Both revenue figures are needed; retrieval finds the
    evidence and arithmetic establishes the growth rate. '
  - Dividing by the previous year’s revenue expresses the increase relative to the
    starting amount, rather than relative to the new total. Similarity ranking does
    not perform that arithmetic or verify the financial definitions.
  workedArithmetic:
  - 'The query has length 1. Each document vector has length 5: √(3² + 4²) = √(4²
    + 3²) = √(0² + 5²) = 5.'
  - Cosine similarities are A = 3/5 = 0.60, B = 4/5 = 0.80, C = 0/5 = 0. Retrieve
    B, then A.
  - Revenue growth = (120 − 100) / 100 = 0.20 = 20%. Both revenue chunks are needed
    to support this comparison.
