  readAloud:
  - Turn each relevance grade into a gain, then reduce its contribution according
    to its rank. Add the discounted gains across the top K results. This exercise
    explicitly uses exponential gain. Higher grades are rewarded disproportionately.
    Rank 1 has divisor 1, so its gain is undiscounted.
  - 'Divide the observed discounted gain by the gain obtained by putting the same
    candidates in descending relevance order. The ideal order uses the same cutoff,
    gain function, and discount rule. A score of 1 indicates the ideal score has been
    reached, not that the generated answer is correct. Calculation convention: The
    reported detailed totals use the unrounded value of log2 (3). The supplied 1.585
    approximation can change the last printed decimal.'
  workedExplanation:
  - 'The retriever found the strongest passage but put it behind weaker evidence.
    Its discounted relevance score is about 71% of the ideal ordering’s score. Moving
    the grade-3 passage first gives nDCG of 1 here. Neither score establishes that
    the generated answer uses the passage correctly. '
  - The normalized result is a fraction of ideal discounted relevance, not the fraction
    of sources that are relevant. Ranking the strongest source second loses more credit
    under exponential gain than a simple relevant-versus-irrelevant count would reveal.
  workedArithmetic:
  - Gains for grades [1, 3, 0] are [2¹ − 1, 2³ − 1, 2⁰ − 1] = [1, 7, 0].
  - DCG = 1/log2(2) + 7/log2(3) + 0/log2(4) ≈ 5.4165.
  - Ideal grades [3, 1, 0] give IDCG = 7/log2(2) + 1/log2(3) + 0/log2(4) ≈ 7.6309.
  - nDCG ≈ 5.4165/7.6309 ≈ 0.7098. These totals use the unrounded logarithms.
