steps:
- id: DCG
  title: Discounted cumulative gain
  expects: number
  unit: ''
  tolerance:
    rel: 0.005
    abs: 5.0e-05
  hints: &id005
  - For each rank, divide 2^grade − 1 by log2(rank + 1), then add.
  mistakes:
  - pattern: recompute
    message: For each rank, divide 2^grade − 1 by log2(rank + 1), then add.
- id: IDCG
  title: Ideal discounted cumulative gain
  expects: number
  unit: ''
  tolerance:
    rel: 0.005
    abs: 5.0e-05
  hints: &id006
  - Sort the grades highest first and repeat the same discounted-gain calculation.
  mistakes:
  - pattern: recompute
    message: Sort the grades highest first and repeat the same discounted-gain calculation.
- id: nDCG
  title: Normalized discounted cumulative gain
  expects: number
  unit: ''
  tolerance:
    rel: 0.005
    abs: 5.0e-05
  hints: &id007
  - Divide actual DCG by ideal DCG.
  mistakes:
  - pattern: recompute
    message: Divide actual DCG by ideal DCG.
learning:
  title: Put the Best Evidence First
  scenario: Retrieved passages have graded relevance in their current order. Use gain
    2^grade − 1 and rank discount log2(rank + 1), with ranks starting at 1.
  task: Calculate actual DCG, ideal DCG after sorting the same grades highest first,
    and normalized DCG. Use full precision in logarithms.
  interpretation: nDCG is a fraction of the ideal discounted-relevance score under
    the same gain and cutoff. It is not the fraction of relevant passages or the probability
    that an answer is correct.
  summary: 'DCG: {DCG}; ideal DCG: {IDCG}; nDCG: {nDCG}.'
  labels: *id004
  steps:
    DCG:
      title: Discounted cumulative gain
      hints: *id005
      unit: ''
    IDCG:
      title: Ideal discounted cumulative gain
      hints: *id006
      unit: ''
