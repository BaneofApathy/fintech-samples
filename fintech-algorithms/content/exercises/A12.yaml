  readAloud:
  - For each loan in each run, record 1 when its draw falls below its default probability
    and 0 otherwise. Add the losses of the loans with a 1. The two draws within a
    run are independent under the supplied model. A draw below 0.20 represents a default;
    equality would not count because the rule uses “below.” The uniform draws are
    provided, not generated by students.
  - Average the scenario losses. Separately count losses strictly above the reserve
    and divide by the run count. Analytical expected loss is the sum, over both loans,
    of default probability times exposure times loss given default.
  workedExplanation:
  - 'Five runs produce noisy estimates: $4,000 versus a true model mean of $2,000,
    and 20% versus a true model breach probability of 4%. More independent runs reduce
    simulation noise; they do not validate the assumed 20% default probability or
    independence. '
  - The default indicators are 0/1, the portfolio losses are dollars, and the breach
    estimate is a proportion. Analytical expected loss does not require independent
    defaults when the individual expected losses are given; independence is required
    for the simple product used to calculate the probability that both loans default.
  workedArithmetic:
  - Loss per default = $10,000 × 0.50 = $5,000. The five default patterns are A only,
    neither, both, neither, B only, giving losses [$5,000, $0, $10,000, $0, $5,000].
  - Simulated mean = (5,000 + 0 + 10,000 + 0 + 5,000) / 5 = $4,000. Only the third
    loss exceeds $5,000, so estimated breach probability = 1/5 = 20%.
  - Analytical expected loss = 2 × 0.20 × $10,000 × 0.50 = $2,000.
  - Under independence, both-default probability = 0.20 × 0.20 = 4%. Here both defaults
    are needed to exceed the reserve.
