    \                2(0.20)(10,000)(0.50) = $2,000.\n   4                       \
    \    Neither            $0\n                                                 \
    \       5. Exact breach probability here: Both loans\n   5                   \
    \        B              $5,000       must default; 0.20(0.20) = 4%."
