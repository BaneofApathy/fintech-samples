question: "Two independent loans each have a 20% default probability, $10,000 exposure,\
  \ and 50%\n loss given default.\n For each loan, default occurs when its supplied\
  \ uniform draw is below 0.20.\n                                                \
  \            Calculate each simulated loss, the average loss, and\n   Simulation\
  \                            Loan        Loan\n                                \
  \       A draw      B draw\n                                                   \
  \         the fraction of runs with loss strictly greater than\n               \
  \                                             a $5,000 reserve. Compare the simulated\
  \ mean\n   1                                        0.10     0.80   with analytical\
  \ expected loss. Under independence,\n   2                                     \
  \   0.60     0.40   what is the exact probability of both loans\n   3          \
  \                              0.05     0.15   defaulting?\n   4               \
  \                         0.90     0.70\n   5                                  \
  \      0.30     0.10"
