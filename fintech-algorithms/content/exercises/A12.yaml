learning:
  title: Simulate Loan Losses
  scenario: Two independent loans have the same default probability, exposure and
    loss fraction. Draws are supplied in pairs, one for each loan in each simulation.
    A draw below PD causes default; equality does not.
  task: Calculate each simulated loss, mean loss and fraction strictly exceeding the
    reserve. Compare with analytical expected loss and the exact probability that
    both loans default.
  interpretation: More runs reduce simulation noise under the assumed model. They
    do not validate the default probability or independence. Expected losses add even
    without independence; multiplying the two default probabilities requires independence.
  summary: 'Simulated mean loss: {mean}; analytical expected loss: {analytical}. Reserve-breach
    estimate: {breach}; exact probability of both defaults: {exact}.'
