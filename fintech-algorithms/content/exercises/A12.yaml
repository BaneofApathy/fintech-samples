interpretationPages:
- page: 192
  title: Monte Carlo
  text: " Monte Carlo\n\n   A12 | Interpretation\n\n What the answer means\n Five\
    \ runs produce noisy estimates: $4,000 versus a true model mean of $2,000, and\
    \ 20%\n versus a true model breach probability of 4%. More independent runs reduce\
    \ simulation\n noise; they do not validate the assumed 20% default probability\
    \ or independence.\n Why these steps matter\n The default indicators are 0/1,\
    \ the portfolio losses are dollars, and the breach estimate is a\n proportion.\
    \ Analytical expected loss does not require independent defaults when the individual\n\
    \ expected losses are given; independence is required for the simple product used\
    \ to calculate the\n probability that both loans default."
  paragraphs:
  - Monte Carlo
  - A12 | Interpretation
  - 'What the answer means Five runs produce noisy estimates: $4,000 versus a true
    model mean of $2,000, and 20% versus a true model breach probability of 4%. More
