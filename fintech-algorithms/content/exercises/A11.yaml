formulaPages:
- page: 159
  title: Q-Learning
  text: " Q-Learning\n\n   A11 | Formula explained (1/1)\n\n Question: How should\
    \ one observation update the estimated value of “buy now”?\n                 \
    \                           T = r + γ max Q(s′ , a),   δ = T − Qold ,\n      \
    \                                                  a\n                       \
    \                                Qnew = Qold + αδ.\n Read it aloud: Target = immediate\
    \ reward + discounted best next-state value. Update error\n = target minus old\
    \ estimate. Move the old estimate a fraction of the way toward the target.\n These\
    \ three steps are the original Q-learning update written separately. If the transition\
    \ ends\n the episode, the future-value term is zero.\n The greedy choice selects\
    \ the largest current action value. With negative costs as rewards, less\n negative\
    \ is better."
