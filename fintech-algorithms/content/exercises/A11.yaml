solutionPages:
- page: 163
  title: Q-Learning
  text: " Q-Learning\n\n   A11 | Worked solution — Update an Execution Decision\n\n\
    1. Choose the best next-state value: max(−4, −1) = −1.\n2. Calculate the target:\
    \ −2 + 0.9(−1) = −2.9.\n3. Calculate the update error: −2.9 − (−5) = 2.1.\n4.\
    \ Apply the learning rate:\n                                            Qnew =\
    \ −5 + 0.5(2.1) = −3.95.\n5. Compare current actions: Buy now has −3.95 versus\
    \ waiting at −4.2. A greedy policy\n   chooses buy now because −3.95 is higher.\n\
    6. Terminal case: No future reward remains, so the target is the immediate reward\
    \ −2."
  paragraphs:
  - Q-Learning
  - A11 | Worked solution — Update an Execution Decision
  - '1. Choose the best next-state value: max(−4, −1) = −1. 2. Calculate the target:
    −2 + 0.9(−1) = −2.9. 3. Calculate the update error: −2.9 − (−5) = 2.1. 4. Apply
    the learning rate: Qnew = −5 + 0.5(2.1) = −3.95. 5. Compare current actions: Buy
    now has −3.95 versus waiting at −4.2. A greedy policy chooses buy now because
    −3.95 is higher. 6. Terminal case: No future reward remains, so the target is
    the immediate reward −2.'
