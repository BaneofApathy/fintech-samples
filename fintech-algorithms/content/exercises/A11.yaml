learning:
  title: Update an Execution Decision
  scenario: An execution simulator treats costs as negative rewards. You are updating
    the Q-value of “buy now”; the competing “wait” value is supplied.
  task: Find the best next-state action value, form the discounted target, and move
    the old Q-value toward it using the learning rate. Compare the updated value with
    waiting. Also find the target for a terminal transition.
  interpretation: Larger Q-values are preferred, including when both are negative.
    A terminal transition has no future-value term. These are estimated simulator
    rewards, not guaranteed trading outcomes.
  summary: 'Updated buy-now value: {updated}. Greedy policy chooses buy now: {decision}.
    Terminal target: {terminal}.'
