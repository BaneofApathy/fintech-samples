  readAloud:
  - Target = immediate reward + discounted best next-state value. Update error = target
    minus old estimate. Move the old estimate a fraction of the way toward the target.
    These three steps are the Q-learning update written separately. If the transition
    ends the episode, the future-value term is zero. The greedy choice selects the
    largest current action value. With negative costs as rewards, less negative is
    better.
  workedExplanation:
  - 'The observation made “buy now” look less costly than previously estimated. The
    Q-value estimates discounted future reward in the simulator; it is not a guaranteed
    trading outcome or a probability. '
  - Subtracting an old negative value means adding its magnitude when calculating
    the update error. A positive update error raises the Q-value, meaning this observation
    makes the action look better. Neither the target nor the updated value is a probability.
  workedArithmetic:
  - Best next-state value = max(−4, −1) = −1. Target = −2 + 0.9 × (−1) = −2.9.
  - Update error = −2.9 − (−5) = 2.1. New Q = −5 + 0.5 × 2.1 = −3.95.
  - −3.95 > −4.2, so the greedy policy chooses buy now. If this transition were terminal,
    its target would be the immediate reward −2.
