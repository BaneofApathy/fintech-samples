id: A11
title: Update an Execution Decision
minutes: 7
kind: algorithm
parent: reinforcement-learning
question: "A trading simulator records negative costs as rewards: less negative is\
  \ better.\n For the action “buy now,” Q(s, a) = −5. The action produces immediate\
  \ reward r = −2. At\n the next state, the available action values are −4 and −1.\n\
  \ Use learning rate α = 0.5 and discount factor γ = 0.9:\n                     \
  \                      h                       i\n                         Qnew\
  \ = Qold + α r + γ max Q(s′ , a) − Qold .\n                                    \
  \                     a\n\n The alternative action “wait” currently has value −4.2.\n\
  1. Calculate the update target, update error, and new “buy now” value.\n2. Which\
  \ action does a greedy policy now select?\n3. What would the update target be if\
  \ the transition ended the episode?"
