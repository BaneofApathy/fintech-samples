interpretationPages:
- page: 164
  title: Q-Learning
  text: " Q-Learning\n\n   A11 | Interpretation\n\n What the answer means\n The observation\
    \ made “buy now” look less costly than previously estimated. The Q-value\n estimates\
    \ discounted future reward in the simulator; it is not a guaranteed trading outcome\
    \ or a\n probability.\n Why these steps matter\n Subtracting an old negative value\
    \ means adding its magnitude when calculating the update\n error. A positive update\
    \ error raises the Q-value, meaning this observation makes the action\n look better.\
    \ Neither the target nor the updated value is a probability."
  paragraphs:
