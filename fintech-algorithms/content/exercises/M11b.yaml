learning:
  title: State the Convention
  scenario: A ranked list can be summarized by average precision or by trapezoidal
    precision–recall area. The recall increments and interval endpoint precisions
    are supplied.
  task: Calculate AP as the sum of recall increment × precision at each discovery.
    Calculate each trapezoid as recall width × average endpoint precision, then add
    the areas.
  interpretation: The same ranking can have different AP and trapezoidal areas because
    the interpolation convention differs. State which quantity you report as PR-AUC.
  summary: 'Average precision: {AP}. Trapezoidal PR area: {trapezoid}.'
  labels: *id003
  steps:
