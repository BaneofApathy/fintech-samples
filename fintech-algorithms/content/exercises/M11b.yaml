interpretationPages:
- page: 294
  title: Average Precision and PR-AUC
  text: " Average Precision and PR-AUC\n\n   M11b | Interpretation\n\n What the answer\
    \ means\n AP = 0.7222 and trapezoidal PR-area = 0.6778 describe the same ranking\
    \ using different\n interpolation conventions. AP is a recall-weighted summary\
    \ of precision, not “72.22% of\n transactions are correct.” Report the convention\
    \ explicitly when comparing models.\n Why these steps matter\n The difference\
    \ between 0.7222 and 0.6778 is not a change in the model or its ranking. It comes\n\
    \ from the way the curve’s area is summarized. Comparing these two numbers as\
    \ if they were the\n same statistic would manufacture a performance difference."
  paragraphs:
  - Average Precision and PR-AUC
  - M11b | Interpretation
  - What the answer means AP = 0.7222 and trapezoidal PR-area = 0.6778 describe the
    same ranking using different interpolation conventions. AP is a recall-weighted
    summary of precision, not “72.22% of transactions are correct.” Report the convention
    explicitly when comparing models. Why these steps matter The difference between
    0.7222 and 0.6778 is not a change in the model or its ranking. It comes from the
    way the curve’s area is summarized. Comparing these two numbers as if they were
    the same statistic would manufacture a performance difference.
