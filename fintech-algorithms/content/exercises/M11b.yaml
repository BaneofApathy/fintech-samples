  readAloud:
  - For every increase in recall, multiply the size of the increase by precision at
    that point, then add the contributions. Only newly discovered frauds increase
    recall in this untied ranking. With three frauds, each discovery contributes a
    recall increase of one-third. This is a weighted average of precision, with recall
    increments as weights. It is not the ordinary average of precision at every rank.
  - For each horizontal recall interval, multiply its width by the average of its
    two endpoint precision values. Add the trapezoids. The exercise supplies which
    endpoints to use, including the starting point (R, P ) = (0, 1). Vertical movements
    add no area because their recall width is zero. AP uses one precision level per
    recall increment; the trapezoidal rule joins endpoints with straight lines. State
    the convention when reporting “PR-AUC.”
  workedExplanation:
  - 'AP = 0.7222 and trapezoidal PR-area = 0.6778 describe the same ranking using
    different interpolation conventions. AP is a recall-weighted summary of precision,
    not “72.22% of transactions are correct.” Report the convention explicitly when
    comparing models. '
  - The difference between 0.7222 and 0.6778 is not a change in the model or its ranking.
    It comes from the way the curve’s area is summarized. Comparing these two numbers
    as if they were the same statistic would manufacture a performance difference.
  workedArithmetic:
  - AP = (1/3) × 1 + (1/3) × (2/3) + (1/3) × (1/2) = 13/18 ≈ 0.7222.
  - Trapezoid 1 = (1/3) × (1 + 1) / 2 = 1/3. Trapezoid 2 = (1/3) × (1/2 + 2/3) / 2
    = 7/36 ≈ 0.1944.
  - Trapezoid 3 = (1/3) × (2/5 + 1/2) / 2 = 0.15. Total area ≈ 0.3333 + 0.1944 + 0.15
    = 0.6778. Vertical movements add zero area.
