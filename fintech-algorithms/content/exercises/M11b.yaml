question: "In a ranking of 20 transactions, the 3 frauds appear at ranks 1, 3, and\
  \ 6. The precision at\n those ranks is 1, 2/3, and 1/2.\n Average precision (AP),\
  \ the calculation used by the deck’s classification code, is:\n                \
  \                            X\n                                     AP =      \
  \ ∆Rj Pj .\n                                                    j\n\n Each discovered\
  \ fraud increases recall by 1/3.\n\nFor a trapezoidal PR-area comparison, use these\
  \ three nonzero-width segments, including the\n conventional starting point (R,\
  \ P ) = (0, 1):\n   Recall interval                                Starting precision\
  \               Ending precision\n   0 to 1/3                                  \
  \                       1                             1\n   1/3 to 2/3         \
  \                                          1/2                            2/3\n\
  \   2/3 to 1                                                     2/5           \
  \                 1/2\n Calculate AP and the trapezoidal area. Why should a report\
  \ not label both numbers identically\n without a definition?"
