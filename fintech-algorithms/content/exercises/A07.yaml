interpretationPages:
- page: 98
  title: Graph Methods
  text: " Graph Methods\n\n   A07 | Interpretation\n\n What the answer means\n B connects\
    \ two parts of the account network and may be useful to investigate. Component\
    \ size\n and degree are relational features, not probabilities or findings of\
    \ misconduct.\n Why these steps matter\n A four-edge path does not imply four\
    \ transfers or four criminal steps. Its meaning comes from\n the edge definitions.\
    \ Device sharing and merchant sharing may produce legitimate links, so\n graph\
    \ features support investigation rather than establish misconduct."
  paragraphs:
  - Graph Methods
