id: A07
title: Trace Shared Connections
minutes: 7
kind: algorithm
parent: graph-methods
question: "At the decision cutoff, an undirected graph contains these links:\n   \
  \ Account A –- Device 7\n    Account B –- Device 7\n    Account B –- Merchant 9\n\
  \    Account C –- Merchant 9\n    Account D –- Device 8\n\n A connected component\
  \ is a set of nodes reachable from one another. A node’s degree is its\n number\
  \ of direct links.\n1. List the connected components and their sizes, counting all\
  \ node types.\n2. Calculate each account’s degree. Which account has the most direct\
  \ links?\n3. Find the shortest path from Account A to Account C; count its edges.\n\
  4. Does being in the same component establish that A and C committed fraud?"
