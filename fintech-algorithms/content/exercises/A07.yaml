formulaPages:
- page: 93
  title: Graph Methods
  text: " Graph Methods\n\n   A07 | Formula explained (1/1)\n\n Question: Which entities\
    \ are connected, and how many links separate two accounts?\n                 \
    \  deg(v) = |N (v)|,        d(u, v) = min{number of edges in a path from u to\
    \ v}.\n Read it aloud: Degree counts direct neighbors. Shortest-path distance\
    \ counts the fewest links\n needed to travel between two nodes.\n A connected\
    \ component contains all nodes that can reach one another through these links.\n\
    \ Count accounts, devices, and merchants when finding its size.\n The graph is\
    \ undirected: a listed link can be followed in either direction. It represents\n\
    \ relationships, not the flow of money."
