solutionPages:
- page: 97
  title: Graph Methods
  text: " Graph Methods\n\n   A07 | Worked solution — Trace Shared Connections\n\n\
    1. Follow the links to identify components.\n       • Component 1: A, B, C, Device\
    \ 7, Merchant 9 — 5 nodes.\n       • Component 2: D, Device 8 — 2 nodes.\n2. Count\
    \ account links: A has 1; B has 2; C has 1; D has 1. B has the highest account\n\
    \   degree.\n3. Trace the shortest A-to-C route:\n                          A\
    \ → Device 7 → B → M erchant 9 → C.\n      The route contains 4 edges.\n4. Separate\
    \ a link from a conclusion: Shared use of a device or merchant may warrant\n \
    \  investigation, but it is not proof of fraud."
  paragraphs:
  - Graph Methods
  - A07 | Worked solution — Trace Shared Connections
  - '1. Follow the links to identify components. • Component 1: A, B, C, Device 7,
    Merchant 9 — 5 nodes. • Component 2: D, Device 8 — 2 nodes. 2. Count account links:
    A has 1; B has 2; C has 1; D has 1. B has the highest account degree. 3. Trace
    the shortest A-to-C route: A → Device 7 → B → M erchant 9 → C. The route contains
    4 edges. 4. Separate a link from a conclusion: Shared use of a device or merchant
    may warrant investigation, but it is not proof of fraud.'
